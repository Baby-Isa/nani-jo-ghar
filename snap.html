<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3e7d3">
<title>Snap with Nani</title>
<!-- the app frame: the house colour on first paint, cross-fades, the way home (js/shared/app.js) -->
<link rel="stylesheet" href="css/shared/app.css?v=20260926T141949Z">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/cook.css?v=20260926T141949Z">
<link rel="stylesheet" href="css/snap.css?v=20260926T141949Z">
</head>
<body class="snap">

<div id="rotate">
  <div class="rotate-card"><div class="rotate-icon">&#8635;</div><p>Turn your phone sideways to take photos for Nani</p></div>
</div>

<div id="app">
  <main id="stage">
    <!-- the orchard under a fixed viewfinder (js/snap/mechanics/viewfinder.js): the world pans and zooms, the frame never moves -->
    <div id="vf" class="hidden">
      <div id="vf-world"></div>
      <div id="vf-mask" aria-hidden="true"></div>
      <div id="vf-frame" aria-hidden="true"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div id="vf-flash"></div></div>
      <!-- the camera body: zoom steps, the film left, the shutter; bottom right, never over the frame -->
      <div id="vf-body">
        <div class="vf-zoom">
          <button id="vf-zoom-out" class="vf-btn" type="button" aria-label="Zoom out">&minus;</button>
          <button id="vf-zoom-in" class="vf-btn" type="button" aria-label="Zoom in">+</button>
        </div>
        <button id="vf-shutter" type="button" aria-label="Take the photo"><span class="vf-film" aria-label="Film left"></span></button>
        <button id="vf-show" class="vf-btn wide hidden" type="button">Show Nani</button>
      </div>
      <!-- the prints tray: bottom left, at most 22% of the height -->
      <div id="tray" aria-label="Your photos"></div>
    </div>

    <!-- Show Nani (js/snap/mechanics/handin.js): Nani on the charpai, your prints to hand her -->
    <div id="handin" class="hidden">
      <div class="hi-nani"><img class="hi-face" src="assets/cook/characters/nani-happy.webp?v=20260926T141949Z" alt="Nani"><div class="hi-charpai"></div><div class="hi-held"></div></div>
      <div class="hi-prints"></div>
      <div class="hi-tools"><button id="hi-back" class="btn" type="button">None of these: take another</button></div>
    </div>

    <!-- Ali's camera (js/snap/mechanics/ali-camera.js): the picture card, the microphone, the pills -->
    <div id="ali" class="hidden">
      <div class="ali-card"><div class="ali-pic"></div></div>
      <div class="ali-side">
        <img class="ali-face" src="assets/cook/characters/cousin-happy.webp?v=20260926T141949Z" alt="Ali">
        <button id="ali-mic" type="button" aria-label="Say it to Ali"><span class="mic"></span><span class="ali-mic-t">Say it</span></button>
        <div class="ali-pills hidden"></div>
        <div class="ali-judge hidden"><span>Did they say it?</span><button class="btn" id="ali-yes" type="button">&#10003;</button><button class="btn" id="ali-again" type="button">Again</button></div>
      </div>
    </div>

    <div id="bubble" class="hidden" role="status" aria-live="polite"><div class="say-slot"></div></div>
    <div id="gist" class="hidden"></div>
    <div id="choices" class="hidden"></div>
    <div id="count-badge" class="hidden"><span class="count-digit"></span></div>
    <button id="done-btn" class="hidden" aria-label="Done">&#10003;</button>
    <div id="toast" class="hidden"></div>

    <div id="intro" class="hidden" role="dialog" aria-label="Nani's photos">
      <div class="ic-card">
        <div class="ic-head"><img class="ic-face" alt=""><div class="ic-name"></div><button class="ic-say" type="button" aria-label="Hear it again"></button></div>
        <div class="ic-order"></div>
        <div class="ic-go">Tap to start</div>
      </div>
    </div>
  </main>

  <aside id="side">
    <div id="mission" class="card hidden">
      <div class="m-head">
        <div class="m-ring" aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle class="pr-bg" cx="24" cy="24" r="22"/><circle class="pr-fg" cx="24" cy="24" r="22" pathLength="100"/></svg>
          <img class="m-face" alt="">
        </div>
        <div class="m-who"><div class="m-dish"></div><div class="m-stars"></div></div>
        <div class="m-tools">
          <button class="m-replay" type="button" aria-label="Hear it again" title="Hear it again"></button>
          <button class="m-tr" type="button" aria-label="Show in English" title="Show in English"></button>
        </div>
      </div>
      <div class="m-order"></div>
      <div class="m-stamp">Done!</div>
    </div>
    <div id="live">
      <div id="nani-card" class="card hidden" role="status" aria-live="polite">
        <img class="nc-face" src="assets/cook/characters/nani-badge.webp?v=20260926T141949Z" alt="Nani">
        <div class="say-slot"></div>
      </div>
    </div>
    <div class="side-rail">
      <button id="btn-help" class="rail-btn" title="What do I do here?" aria-label="What do I do here?" aria-expanded="false">?</button>
      <button id="btn-home" class="rail-btn" title="Menu" aria-label="Menu">&#8962;</button>
    </div>
  </aside>

  <div id="help-pop" class="hidden" role="dialog" aria-label="What do I do here?"><div class="hp-text"></div></div>
  <div id="passme" class="hidden"><div class="pm-nani"><div class="pm-say"></div></div><div class="pm-tray"></div></div>
</div>

<div id="overlay" class="hidden"><div id="panel"></div></div>

<!-- shared with Cook with Nani (read only): data, save, word progress, voice, word pills, the order ladder -->
<script src="js/version.js?v=20260926T141949Z"></script>
<!-- one app, one save: every page reads and writes progress through js/shared/save.js -->
<script src="js/shared/save.js?v=20260926T141949Z"></script>
<script src="js/shared/app.js?v=20260926T141949Z"></script>
<script src="js/cook/core.js?v=20260926T141949Z"></script>
<script src="js/cook/lang.js?v=20260926T141949Z"></script>
<script src="js/cook/ui.js?v=20260926T141949Z"></script>
<script src="js/cook/order.js?v=20260926T141949Z"></script>
<!-- the shared recogniser (foundation) -->
<script src="js/shared/speech.js?v=20260926T141949Z"></script>
<!-- Snap: pure logic first (also run by build/leak_snap.mjs), then the stubs, the adapters, the mechanics and the game -->
<script src="js/snap/photo.js?v=20260926T141949Z"></script>
<script src="js/snap/stubs/which-one.js?v=20260926T141949Z"></script>
<script src="js/snap/stubs/stars.js?v=20260926T141949Z"></script>
<script src="js/snap/requests.js?v=20260926T141949Z"></script>
<script src="js/snap/sim.js?v=20260926T141949Z"></script>
<script src="js/snap/core.js?v=20260926T141949Z"></script>
<script src="js/snap/adapters.js?v=20260926T141949Z"></script>
<script src="js/snap/prints.js?v=20260926T141949Z"></script>
<script src="js/snap/mechanics/viewfinder.js?v=20260926T141949Z"></script>
<script src="js/snap/mechanics/handin.js?v=20260926T141949Z"></script>
<script src="js/snap/mechanics/ali-camera.js?v=20260926T141949Z"></script>
<script src="js/snap/round.js?v=20260926T141949Z"></script>
<script src="js/snap/bot.js?v=20260926T141949Z"></script>
<script src="js/snap/flow.js?v=20260926T141949Z"></script>
</body>
</html>
