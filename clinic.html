<!--

  clinic.html                      a clinic morning (the saved session; the first ever is one tiny patient)
  clinic.html?lab=1                the lab bar: any stage x variant x level, any healing game in the pipeline, a patient, a morning
  Direct lab entries (all take &seed=N &quiet=1 &fast=1 &speak=0 &onboard=0 &results=0):
    ?stage=waiting&variant=W1&level=4      one stage alone (waiting | diagnosis | pharmacy | heal | sendoff); the waiting room has levels 1-5

    &grandparent=1                         the speaking moments show the grown-up's tick ("They said it")
  The index of every entry: lab/clinic-core.html.
  Runs through the one game host (js/clinic/main.js, js/shared/host.js). Add &nonav=1 so the end screen's buttons stay on the page (tests).
  window.njgTest.clinic for tests: {Run, Stages, expect(), finishHeal(), last, ready, host}; window.njgTest is the one hook (target-model § 8.1).

<script type="module">
  // R5: the clinic runs through the one game host (js/shared/host.js) as a mode plug-in (js/clinic/main.js).
  // The URL entries below are the same as before; window.njgTest.clinic keeps its calls for the tests (the host keeps it when it sets window.njgTest).
  const Q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const C = ((window.njgTest = window.njgTest || {}).clinic = { expect: () => (window.Clinic && Clinic.Stages ? Clinic.Stages.expect() : null), finishHeal: () => Clinic.Stages.heal.finish(), last: null, ready: false, errors: [] });
  window.addEventListener("error", (e) => C.errors.push(String(e.message)));
  window.addEventListener("unhandledrejection", (e) => C.errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason)));
  const out = $("lab-out");
  const print = (s) => { out.textContent = (out.textContent + s + "\n").split("\n").slice(-30).join("\n"); };

  const M = await import(njgV("./js/shared/mode.js"));
  const { loadCore } = await import("#core/index.js");
  const CM = await import(njgV("./js/clinic/main.js"));
  const core = await loadCore({ base: "" });
  const mode = await M.loadMode("clinic", { stamp: njgV });
  const Kit = Clinic.Kit, Run = Clinic.Run;
  C.Run = Run; C.Stages = Clinic.Stages; C.core = core; C.mode = mode;
  Kit.Voice.quiet = Q.get("quiet") === "1";
  Kit.fast = Q.get("fast") === "1";
  Run.opts.speak = Q.get("speak") !== "0";
  Run.opts.onboard = Q.get("onboard") !== "0";
  Run.opts.grandparent = Q.get("grandparent") === "1"; // a grown-up's tick in the speaking moments
  const nonav = Q.get("nonav") === "1";
  const host = M.createHost({
    root: $("clinic-root"),
    core,
    kit: { Results: window.Results, Onboard: window.Onboard },
    hook: true,
    results: Q.get("results") !== "0",
    resultsContainer: document.body,
    sound: !Kit.fast,
    onboard: Q.get("onboard") !== "0",
    speakWord: (w) => Kit.Voice.say({ kutchi: w.kutchi, english: w.english, placeholder: w.placeholder, plan: w.plan || (w.id && ClinicLang.engine && ClinicLang.lex(w.id) ? ClinicLang.w(w.id).plan : []) }, { who: "doctor", noBubble: true }), // the engine's clip plan (step 4e)
  });
  C.host = host;
  const endActions = window.NjgButtons && window.NjgButtons.endActions;
  const go = (href) => { if (!nonav) location.href = href; };

  // ---- the lab bar (developer chrome) ----
  const lab = Q.get("lab") === "1";
  const VARIANTS = { waiting: ["W1", "W3", "W4"], diagnosis: ["D1", "D2", "D3"], sendoff: ["E1", "E2", "E4"] };
  const fillVariants = () => {
    const w = $("lab-what").value;
    $("lab-variant").innerHTML = '<option value="">draw</option>' + (VARIANTS[w] || []).map((v) => `<option>${v}</option>`).join("");
  };
  $("lab-game").innerHTML = '<option value="">draw</option>' + CM.HEAL.concat(CM.PARKED).map((g) => `<option>${g}</option>`).join("");
  $("lab-what").onchange = fillVariants;
  $("lab-min").onclick = () => $("lab").classList.toggle("min");
  $("lab-reset").onclick = () => { Run.reset(); if (window.Onboard) Onboard.reset(); print("progress reset"); };

  /** A URL's (or the lab bar's) choice -> a shell entry. */
  function entryOf(o) {
    const seed = +o.seed || Math.floor(Math.random() * 1e5) + 1; // fixed per entry: Again is the same patient (H34)
    const level = +o.level || 1;
    const params = {};
    if (o.variant) params.variant = o.variant;
    if (o.what === "patient") return { play: "lab", level, seed, game: null, params };
    if (o.what === "heal") return { play: "lab", level, seed, game: o.game || CM.HEAL[Math.floor(Math.random() * CM.HEAL.length)], params };
    return { play: "lab", level, seed, game: o.what, params };
  }
  C.go = async function (o) {
    print(`-- ${o.what} L${o.level || 1}${o.variant ? " " + o.variant : ""}${o.game ? " " + o.game : ""}`);
    try {
      if (o.what === "morning") {
        const play = (more) => CM.playMorning(Object.assign({ mode, host, core, session: +o.session || null, seed: +o.seed || null, noSave: Q.get("nosave") === "1", endActions, onRound: (res) => (C.round = res), patients: +Q.get("patients") || null }, more));
        let r = await play({});
        // CLN-111: the end of the morning's Again plays the same morning again (its progress was saved the first time)
        while (r && r.action === "again") r = await play({ session: r.session, seed: r.seed, noSave: true });
        C.last = r;
        print(`morning done: ${r.outs.map((x) => `${x.plan.kind}/${x.plan.ailment} ${x.right}/${x.total}`).join(", ")}`);
        // All patients: the list of every patient and game, like Cook's "All" (the lab list)
        if (r && r.action === "list") go("labs.html");
        return r;
      }
      const entry = entryOf(o);
      const last = await M.playMode({
        mode, entry, host, core, endActions,
        onRound: (r) => {
          const round = CM.default.session.round;
          C.last = { round: r.round, finish: r.finish, plan: round && round.plan, rows: (r.round && r.round.marks) || [], right: r.round.right, total: r.round.total, coins: r.finish && r.finish.pay ? r.finish.pay.coins : 0, results: round && round.results };
          print(`${o.what} done: ${r.round.right}/${r.round.total}, ${C.last.coins} coins`);
        },
        nav: { list: () => go("labs.html"), home: () => go("index.html"), locked: async () => print("locked") },
      });
      return last;
    } catch (e) {
      console.error(e);
      print(`error: ${e.message}`);
      C.errors.push(String(e.message));
    }
  };
  $("lab-go").onclick = () => C.go({ what: $("lab-what").value, variant: $("lab-variant").value, game: $("lab-game").value, level: $("lab-level").value, session: $("lab-session").value, seed: $("lab-seed").value });

  if (lab) { $("lab").classList.remove("hidden"); $("lab-out").classList.remove("hidden"); }
  const what = Q.get("stage") || (Q.get("patient") ? "patient" : Q.get("morning") ? "morning" : null);
  if (Q.get("level")) $("lab-level").value = Q.get("level");
  if (Q.get("seed")) $("lab-seed").value = Q.get("seed");
  // the clinic's data first, so the first stage starts at once; a healing game's code and pictures load when its patient
  // is chosen (decision 68: js/clinic/main.js loadGame), never all twelve with the page
  await Run.load();
  if (Q.get("game")) CM.prefetchGame(Q.get("game"));
  C.ready = true;
  if (what) {
    $("lab-what").value = what;
    fillVariants();
    if (Q.get("variant")) $("lab-variant").value = Q.get("variant");
    if (Q.get("game")) $("lab-game").value = Q.get("game");
    C.go({ what, variant: Q.get("variant"), game: Q.get("game"), level: Q.get("level"), session: Q.get("session"), seed: Q.get("seed") });
  } else if (!lab) {
    // the game: a clinic morning, then another
    for (;;) await C.go({ what: "morning" });
  } else fillVariants();
</script>
