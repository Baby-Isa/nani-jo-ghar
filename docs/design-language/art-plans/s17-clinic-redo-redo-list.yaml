# The clinic redo pack's redo list (7 Nov), from the landing judge (build/reports/s17-clinic-redo-landed-2026-11-07.md).
# Input to: python3 build/tools/art/artblock.py --spec build/tools/art/specs/s17-clinic-redo.run.yaml --redo docs/design-language/art-plans/s17-clinic-redo-redo-list.yaml
# Each line regenerates its whole sheet; only the named item is wanted from it (the sheet's other cuts stay as cut).
# Two are the wood rule (PASS/FAIL: light oak or pine; any wood is walnut), one item on each sheet; one is a cut that cannot
# be made clean (a grey rubber bulb on the grey ground). The other 21 items on these three sheets are usable now. Zafar may
# also let the two wood ones stand (the tongue depressor and the hourglass are decoys no game asks for yet).
# CN09's line needs its run-spec words changed first (item 4: "a soft grey rubber ear-syringe bulb" to a cream one), a
# request in the landing report: the run spec is not the landing session's to edit.
# Two more (CB01's tweezers, CD02's honey jar) are the light tool's FAILs ("light from the lower right" on the steel, "from
# below" on the lit honey); by eye both are lit from the upper left, so the recommended fix is no run at all: their two paths
# into look-rules.json light.eye_passed (Fable, 7 Nov) and a re-cut with their `failed` entries removed from the cut spec.
# That route was taken (the orchestrator, 7 Nov): both passed by eye, re-cut; their lines are off this list.
pack: s17-clinic-redo
redo:
