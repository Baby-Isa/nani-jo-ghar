<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1366">
<title>Chai v2 mock-up</title>
<!-- docs/design/cook-design-system-v1.md §9 step 1: a static, high-fidelity mock-up of the chai station v2
     (laptop, 1366x768), three states: #a start, #b mid-cook, #c serving. Add ?shot to hide the switcher.
     Not the game: nothing here is wired to js/cook. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="chai-v2-mockup.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path d="M15.2 9a4.2 4.2 0 0 1 0 6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><path d="M9.2 9.2a2.9 2.9 0 1 1 4.2 2.6c-.9.5-1.4 1.2-1.4 2.2v.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2 12 4.5l8 6.7M6.5 9.5V19h11V9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7.2C10.3 5.8 7.7 5.3 4.5 5.6v12.2c3.2-.3 5.8.2 7.5 1.6 1.7-1.4 4.3-1.9 7.5-1.6V5.6c-3.2-.3-5.8.2-7.5 1.6zm0 0v12.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<div class="stage" id="stage">
  <aside class="panel">
    <section class="nani">
      <div class="nani-top">
        <button class="nani-face" aria-label="Nani (hear her again)"><img src="../assets/cook/characters/nani-talk.webp?v=20260929T033017Z" alt=""></button>
        <div class="nani-tools">
          <button class="round" aria-label="A hint"><img src="../assets/ui/results/icon-bulb.webp?v=20260929T033017Z" alt=""></button>
          <button class="round" aria-label="Sound"><svg><use href="#i-speaker"/></svg></button>
        </div>
      </div>
      <p class="nani-line" id="nani-line"></p>
    </section>
    <div id="people"></div>
    <nav class="dock">
      <button class="round" aria-label="Help"><svg><use href="#i-help"/></svg></button>
      <button class="round" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button class="round" aria-label="Words"><svg><use href="#i-book"/></svg></button>
    </nav>
  </aside>

  <main class="play">
    <section class="scene" id="scene">
      <div class="obj hob" id="hob">
        <img src="../assets/cook/items/chai-v2/hob-2-burner-t.webp?v=20260929T033017Z" alt="">
      </div>
      <div class="obj tray" id="tray">
        <img src="../assets/cook/items/chai-v2/tray-4-cutout-t.webp?v=20260929T033017Z" alt="">
      </div>
    </section>
    <section class="shelf" id="shelf"><div class="slots" id="slots"></div></section>
  </main>
</div>

<nav class="switcher" id="switcher">
  <a href="#a">a · start</a><a href="#b">b · mid-cook</a><a href="#c">c · serving</a>
  <span>Static mock-up of the chai station v2 (design system v1 §9). Not the game.</span>
</nav>

<script>
// Every Kutchi word and line below is already in data/cook.json (words: paani, dudh, chai, khun, elchi,
// jeeru, rai, hakro, ba, Nana, Ali; lines: first "Pela {x}.", and "Ne {x}.", forwho "Hi {x} lai ai.",
// the card headline "Muke chai khape.", the rows "{n} khun"). Nothing new is invented here.
const A = '../assets/';
const FACE = { nana: A + 'cook/characters/nana-badge.webp', ali: A + 'cook/characters/cousin-badge.webp' };
const PEOPLE = [
  { id: 'nana', pills: ['dudh', 'hakro khun', 'elchi'] },
  { id: 'ali', pills: ['dudh', 'ba khun'] },
];
// the shelf: liquids | jars | spices (small identical jars; no masala dabba)
const GROUPS = [
  [{ id: 'paani', img: 'shelf-cook-paani-bare-f.webp', cls: 'tall' }, { id: 'dudh', img: 'shelf-cook-dudh-bare-f.webp', cls: 'tall' }],
  [{ id: 'chai', img: 'shelf-cook-chai-bare-f.webp', cls: 'tall' }, { id: 'khun', img: 'shelf-cook-khun-bare-f.webp', cls: 'tall' }],
  [{ id: 'elchi', img: 'shelf-spi-10-bare-f.webp', cls: 'sq' }, { id: 'jeeru', img: 'shelf-spi-02-bare-f.webp', cls: 'sq' },
   { id: 'rai', img: 'shelf-spi-05-bare-f.webp', cls: 'sq' }],
];
// the hob's burners (px inside the 500 px hob) and the tray's cut-outs (px inside the 290 px tray)
const BURNER = [[130, 145], [374, 145]];
const WELL = [[82, 81], [208, 81], [82, 202], [208, 202]];
const TRAY = [674, 141]; // the tray's top-left in scene px (lab/chai-v2-mockup.css .tray)

const STATES = {
  a: {
    nani: 'Pela <span class="k">paani</span>.',
    done: { nana: [], ali: [] },
    next: 'paani', used: [], hearOnly: [], trayQuiet: true,
    pans: [{}, {}],
    glasses: [null, null],
  },
  b: {
    nani: 'Ne <span class="k">dudh</span>.',
    done: { nana: ['dudh'], ali: ['dudh', 'ba khun'] },
    next: 'khun', used: ['dudh'], hearOnly: ['elchi'], trayQuiet: true,
    pans: [{ liquid: 'brew', swirl: true, flame: 'low', pour: true }, { liquid: 'chai', flame: 'high', boil: true }],
    glasses: [null, null],
  },
  c: {
    nani: 'Hi <span class="k">Nana</span> lai ai.',
    done: { nana: ['dudh', 'hakro khun', 'elchi'], ali: ['dudh', 'ba khun'] },
    next: null, used: [], hearOnly: [], trayQuiet: false, shelfQuiet: true,
    pans: [{ liquid: 'chai', tilt: true }, { liquid: 'empty' }],
    glasses: [0.55, 1],
  },
};

const svg = (id, cls = '') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const kw = s => s.replace(/^(hakro |ba )?(\w+)$/, (m, n, w) => (n || '') + w);

// a glass seen from above: a clear rim, and the chai surface widening as it fills (the glass tapers)
function glassSVG(fill) {
  const r = fill == null ? 0 : 20 + 16 * fill;
  const chai = fill == null ? '' : `
    <circle cx="45" cy="45" r="${r}" fill="#b9794a"/>
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="#d9a877" stroke-width="3" opacity=".7"/>
    ${fill < 1 ? `<circle cx="45" cy="45" r="7" fill="#f4e3cf" opacity=".9"/><circle cx="45" cy="45" r="13" fill="none" stroke="#e7c7a3" stroke-width="2" opacity=".8"/>`
               : `<ellipse cx="37" cy="36" rx="10" ry="5" fill="#fff" opacity=".22" transform="rotate(-35 37 36)"/>`}`;
  return `<svg class="glass" viewBox="0 0 90 90">
    <circle cx="45" cy="45" r="40" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.75)" stroke-width="2"/>
    <circle cx="45" cy="45" r="37" fill="none" stroke="rgba(90,60,30,.22)" stroke-width="1"/>
    <circle cx="45" cy="45" r="29" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
    ${chai}
    <path d="M17 32 A31 31 0 0 1 33 13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  </svg>`;
}

function bubbles() {
  const spots = [[22, 30, 9], [58, 24, 7], [70, 58, 10], [34, 66, 8], [50, 44, 6], [16, 54, 6], [78, 36, 5]];
  return spots.map(([x, y, s]) => `<i class="bubble" style="left:${x}%;top:${y}%;width:${s * 2}px;height:${s * 2}px"></i>`).join('');
}

function render(key) {
  const S = STATES[key] || STATES.a;
  document.querySelectorAll('.switcher a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + key));
  document.getElementById('nani-line').innerHTML = S.nani;

  // the person cards: face (= replay), headline, their pills
  document.getElementById('people').innerHTML = PEOPLE.map(p => `
    <section class="person" style="margin-bottom:12px">
      <div class="person-head">
        <button class="face" aria-label="Hear again"><img src="${FACE[p.id]}" alt=""></button>
        <p class="headline">Muke <span class="k">chai</span> khape.</p>
      </div>
      <div class="pills">${p.pills.map(w => `<span class="pill${S.done[p.id].includes(w) ? ' done' : ''}">${svg('check', 'check')}${w}</span>`).join('')}</div>
    </section>`).join('');

  // the shelf
  const slots = document.getElementById('slots');
  slots.className = 'slots' + (S.next ? ' focus' : '');
  slots.innerHTML = GROUPS.map(g => `<div class="group">${g.map(it => `
    <button class="slot${S.next === it.id ? ' next' : ''}${S.used.includes(it.id) ? ' used' : ''}" aria-label="${it.id}">
      <span class="art"><img class="${it.cls}" src="${A}cook/items/${it.img}" alt=""></span>
      <span class="chip${S.hearOnly.includes(it.id) ? ' hear-only' : ''}" role="button" aria-label="Hear ${it.id}">${svg('speaker')}<span>${it.id}</span></span>
    </button>`).join('')}</div>`).join('');
  document.getElementById('shelf').classList.toggle('quiet-all', !!S.shelfQuiet);

  // the hob: knobs, flames, pans (one per person, their face by the handle)
  const hob = document.getElementById('hob');
  hob.querySelectorAll('.knob,.flame,.pan,.pour,.stream,.pop').forEach(n => n.remove());
  document.querySelectorAll('#scene > .pour, #scene > .stream, #scene > .pop, #scene > .pan').forEach(n => n.remove());
  S.pans.forEach((pan, i) => {
    const [bx, by] = BURNER[i];
    hob.insertAdjacentHTML('beforeend', `
      <div class="knob" style="left:${bx}px"><img src="${A}cook/items/chai-station/knob-${pan.flame ? 'on' : 'off'}.webp" alt=""></div>
      <div class="flame${pan.flame ? ' on ' + pan.flame : ''}" style="left:${bx}px;top:${by}px"><img src="${A}cook/items/chai-station/flame-${pan.flame === 'low' ? 'low' : 'high'}.webp" alt=""></div>`);
    const flip = i === 0; // handles point outwards: left pan's to the upper left
    const liquid = pan.liquid && pan.liquid !== 'empty' ? `<div class="liquid ${pan.liquid}">${pan.swirl ? '<i class="swirl"></i>' : ''}${pan.boil ? bubbles() : ''}</div>` : '';
    // a pan that's pouring has left its burner: it tips over its person's glass on the tray
    const where = pan.tilt ? document.getElementById('scene') : hob;
    const style = pan.tilt ? `left:${TRAY[0] + WELL[i][0] - 78}px;top:${TRAY[1] + WELL[i][1] - 118}px;transform:rotate(-18deg) scale(.92);z-index:3`
                           : `left:${bx}px;top:${by}px`;
    where.insertAdjacentHTML('beforeend', `
      <div class="pan${flip ? ' flip' : ''}${pan.tilt ? ' tilt' : ''}" style="${style}">
        <img src="${A}cook/items/vessel-saucepan-t.webp" alt="">${liquid}
        <span class="badge"><img src="${FACE[PEOPLE[i].id]}" alt=""></span>
        ${pan.boil ? '<div class="steam"><i></i><i></i><i></i></div>' : ''}
      </div>`);
  });

  // the pour and its word pop (state b): the carton tips over Nana's pan
  const scene = document.getElementById('scene');
  if (S.pans.some(p => p.pour)) {
    const [bx, by] = BURNER[0];
    const hx = 102 + bx, hy = 130 + by; // the burner in scene px
    scene.insertAdjacentHTML('beforeend', `
      <div class="stream" style="left:${hx - 4}px;top:${hy - 70}px;height:62px"></div>
      <div class="pour" style="left:${hx - 77}px;top:${hy - 146}px;transform:rotate(118deg)"><img src="${A}cook/items/shelf-cook-dudh-bare-f.webp" alt=""></div>
      <div class="pop" style="left:${hx + 28}px;top:${hy - 196}px">${svg('speaker')}dudh</div>`);
  }

  // the tray: quiet until pouring; faces under the cut-outs, glasses in them
  const tray = document.getElementById('tray');
  tray.classList.toggle('quiet', S.trayQuiet);
  hob.classList.toggle('dim', !S.trayQuiet); // serving: the tray is the focus, the hob steps back
  tray.querySelectorAll('.well').forEach(n => n.remove());
  WELL.forEach(([x, y], i) => {
    const p = PEOPLE[i];
    if (!p) return; // 2 people: 2 cut-outs used, 2 empty
    tray.insertAdjacentHTML('beforeend', `
      <div class="well" style="left:${x}px;top:${y}px">
        ${S.glasses[i] !== null ? glassSVG(S.glasses[i]) : glassSVG(null)}
        <span class="who"><img src="${FACE[p.id]}" alt=""></span>
      </div>`);
  });
  // the chai stream from the tipped pan's lip into the filling glass
  S.pans.forEach((pan, i) => {
    if (!pan.tilt) return;
    const gx = TRAY[0] + WELL[i][0], gy = TRAY[1] + WELL[i][1];
    scene.insertAdjacentHTML('beforeend', `<div class="stream chai" style="left:${gx - 4}px;top:${gy - 62}px;height:60px"></div>`);
  });
}

const key = () => (location.hash || '#a').slice(1);
if (/[?&]shot\b/.test(location.search)) document.body.classList.add('shot');
addEventListener('hashchange', () => render(key()));
render(key());
</script>
</body>
</html>
