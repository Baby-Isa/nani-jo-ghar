<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clinic heal lab A</title>
<!--
  Clinic v2 heal games, lab A (design sheets part B): the scrape (plasters in the
  colours and order said), knee (hammer + flash-and-tap wrap), ear (wax blobs,
  pop-ups from L2), tooth (brush in the called order, drill the decay, fill to
  the line). Each link mounts the game on the REAL host (lab/clinic-heal-host.html)
  with the first-time cues on (&cues=1). Tests: build/test_clinic_heal_a.py,
  build/leak_clinic_heal_a.mjs. The stitches ("cut") variant, unchanged:
  the last links (&ailment=cut).
-->
<style>
  :root { --bg: #f4ecdf; --ink: #3a2e28; --line: #d8c6a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; border-bottom: 2px solid var(--line); }
  nav b { margin-right: 4px; }
  nav span { white-space: nowrap; }
  nav a { display: inline-block; padding: 2px 8px; border: 2px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; background: #fff; }
  nav a.on { border-color: #2e8b7a; background: #e2f3ee; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
<nav id="nav"><b>Heal lab A</b> <small>clinic v2 prototypes on CB6b</small></nav>
<iframe id="f" title="The heal host"></iframe>
<script>
  const GAMES = [
    { id: "cut", name: "scrape (cut.js)" },
    { id: "knee", name: "knee" },
    { id: "ear", name: "ear" },
    { id: "tooth", name: "tooth" },
  ];
  const Q = new URLSearchParams(location.search);
  const nav = document.getElementById("nav");
  const f = document.getElementById("f");
  const kinds = ["girl", "boy", "nana", "old-woman", "ma", "ali"];
  const extras = GAMES.filter((g) => g.src).map((g) => "&src=" + encodeURIComponent(g.src)).join("");
  const links = [];
  GAMES.forEach((g, gi) => {
    const s = document.createElement("span");
    s.textContent = g.name + " ";
    [1, 2, 3].forEach((l) => {
      const a = document.createElement("a");
      a.textContent = "L" + l;
      const seed = 1 + Math.floor(Math.random() * 9999);
      a.href = `clinic-heal-host.html?game=${g.id}&level=${l}&kind=${kinds[(gi + l) % kinds.length]}&seed=${seed}&cues=1${extras}`;
      a.target = "f";
      a.onclick = () => links.forEach((x) => x.classList.toggle("on", x === a));
      links.push(a);
      s.appendChild(a);
    });
    nav.appendChild(s);
  });
  // the stitches variant of cut.js (unchanged)
  const st = document.createElement("span");
  st.textContent = "stitches (unchanged) ";
  [2, 3].forEach((l) => {
    const a = document.createElement("a");
    a.textContent = "L" + l;
    a.href = `clinic-heal-host.html?game=cut&ailment=cut&level=${l}&kind=girl&seed=${1 + Math.floor(Math.random() * 9999)}`;
    a.target = "f";
    a.onclick = () => links.forEach((x) => x.classList.toggle("on", x === a));
    st.appendChild(a);
  });
  nav.appendChild(st);
  const first = links[Math.max(0, GAMES.findIndex((g) => g.id === (Q.get("game") || "eye"))) * 3 + (Number(Q.get("level") || 1) - 1)];
  first.classList.add("on");
  f.src = first.href;
</script>
</body>
</html>
