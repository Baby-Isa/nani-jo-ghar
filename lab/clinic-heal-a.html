<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic heal lab A: knee, ear, tooth</title>
<!--
  Dev page for healing games knee (H1), ear (H3), tooth (H4): docs/clinic-heal-api.md.
  A small MOCK ctx (card, tally, log, say, done, patient built on js/clinic/body.js read-only),
  a stub Clinic.Heal registry used only if the core's js/clinic/heal/registry.js is absent.
  URL: ?game=knee&level=1&seed=7&side=left&ailment=leg-break&tray=right|wrong|missing&fair=1
-->
<style>
  :root { --bg: #fbf5ea; --ink: #2b1810; --line: #d9bf95; --mute: #8a7a6c; --tick: #4f9a58; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.3 system-ui, -apple-system, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; display: flex; gap: 6px; align-items: center; padding: 0 8px; background: #efe3cc; border-bottom: 1px solid var(--line); z-index: 10; font-size: 12px; white-space: nowrap; overflow-x: auto; }
  #bar select, #bar input, #bar button { font: inherit; padding: 2px 4px; }
  #bar input { width: 52px; }
  #app { position: fixed; top: 34px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: clamp(150px, 22vw, 250px) 1fr; }
  #side { border-right: 2px solid var(--line); background: #fdf6e8; padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  #card { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; }
  #card .who { font-size: 11px; color: var(--mute); }
  .row { display: flex; gap: 6px; align-items: flex-start; padding: 5px 0; border-top: 1px dashed #eadcc4; font-size: clamp(12px, 1.6vw, 16px); }
  .row:first-of-type { border-top: 0; }
  .row .box { flex: 0 0 18px; height: 18px; border: 2px solid var(--line); border-radius: 5px; margin-top: 1px; display: grid; place-items: center; color: #fff; font-size: 13px; }
  .row.ticked .box { background: var(--tick); border-color: var(--tick); }
  .row.ticked .box::after { content: "✓"; }
  .row.patient { font-style: normal; }
  .row.patient::before { content: "🗨"; font-size: 12px; }
  .row .ph { color: #9a9088; font-style: italic; }
  .row.pulse { animation: throb 1s ease-in-out 3; }
  @keyframes throb { 50% { background: #fff0c8; } }
  body.english .row .k { display: none; }
  body:not(.english) .row .e { display: none; }
  #tally { position: fixed; top: 40px; right: 8px; display: flex; gap: 6px; z-index: 5; pointer-events: none; }
  #tally span { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 2px 8px; font-weight: 700; }
  #mood { font-size: 28px; text-align: center; }
  #bulb { align-self: flex-start; font-size: 22px; background: #fff3d0; border: 2px solid #e0a63a; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
  #log { font-size: 11px; color: var(--mute); white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  #stage { position: relative; overflow: hidden; }
  #review { position: fixed; inset: 34px 0 0 0; background: rgba(40, 30, 20, 0.55); display: none; place-items: center; z-index: 20; }
  #review .panel { background: #fff; border-radius: 16px; padding: 16px 20px; max-width: 90vw; max-height: 80vh; overflow: auto; }
  #review.on { display: grid; }
  @media (max-height: 450px) { #log { display: none; } #mood { font-size: 20px; } }
</style>
</head>
<body>
<div id="bar">
  <b>Heal A</b>
  <select id="game"><option>knee</option><option>ear</option><option>tooth</option></select>
  L<select id="level"><option>1</option><option>2</option><option>3</option></select>
  side<select id="sideSel"><option value="">rng</option><option>left</option><option>right</option></select>
  ailment<select id="ailment"><option value="">rng</option></select>
  tray<select id="traySel"><option>right</option><option>wrong</option><option>missing</option></select>
  seed<input id="seed" type="number" value="1">
  <button id="go">New</button>
  <label><input id="eng" type="checkbox"> EN</label>
  <span id="answer" style="color:#8a3a52"></span>
</div>
<div id="app">
  <div id="side">
    <button id="bulb" title="light bulb">💡</button>
    <div id="card"><div class="who">the doctor's card</div><div id="rows"></div></div>
    <div id="mood">🙂</div>
    <div id="log"></div>
  </div>
  <div id="stage"></div>
</div>
<div id="tally"></div>
<div id="review"><div class="panel" id="reviewPanel"></div></div>

<script src="../js/clinic/body.js"></script>
<script>
(function () {
  // Load the core's registry if it has landed; else a stub with the same register().
  const Q = new URLSearchParams(location.search);
  window.Clinic = window.Clinic || {};
  const games = ["knee", "ear", "tooth"];
  const load = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  function stub() {
    if (Clinic.Heal && Clinic.Heal.register) return;
    const reg = {};
    Clinic.Heal = { register(g) { reg[g.id] = g; }, get(id) { return reg[id]; }, list() { return Object.keys(reg); }, _stub: true };
  }
  const ready = load("../js/clinic/heal/registry.js").catch(() => {}).then(() => { stub(); return Promise.all(games.map((g) => load("../js/clinic/heal/games/" + g + ".js").catch(() => console.warn("no game " + g)))); })
    .then(() => fetch("../data/patients/grey-adult.json").then((r) => r.json()).then((f) => (window.__body = ClinicBody.build(f))).catch(() => null));

  const $ = (id) => document.getElementById(id);
  const getGame = (id) => (Clinic.Heal.get ? Clinic.Heal.get(id) : (Clinic.Heal.games || {})[id]);
  ["game", "level", "sideSel", "traySel", "seed"].forEach((k) => {
    const v = Q.get({ game: "game", level: "level", sideSel: "side", traySel: "tray", seed: "seed" }[k]);
    if (v != null) $(k).value = v;
  });
  if (Q.get("fair")) document.body.dataset.fair = "1";
  const AIL = { knee: ["knee-bump", "leg-break"], ear: ["seed-in-ear"], tooth: ["sugar-bug", "cracked-tooth"] };
  function fillAilments() {
    $("ailment").innerHTML = '<option value="">rng</option>' + AIL[$("game").value].map((a) => `<option>${a}</option>`).join("");
    if (Q.get("ailment")) $("ailment").value = Q.get("ailment");
  }
  fillAilments();
  $("game").onchange = () => { fillAilments(); start(); };

  function mulberry(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const MOOD = { ouch: "😖", giggle: "😆", relief: "😌", happy: "😄" };
  let ctl = null;
  const logLines = [];
  const log = (s) => { logLines.push(s); $("log").textContent = logLines.slice(-14).join("\n"); };

  function trayFor(game, plan, kind) {
    const items = plan.items.map((id) => ({ id }));
    if (game === "knee") items.forEach((t) => { if (t.id === "cast") t.colour = "blue"; if (t.id === "bandage") t.colour = "white"; });
    if (kind === "wrong") items.splice(1, 0, { id: "plaster" });
    if (kind === "missing") items.pop();
    return items;
  }

  function start() {
    if (ctl) ctl.destroy();
    $("stage").innerHTML = "";
    $("rows").innerHTML = "";
    $("tally").innerHTML = "";
    $("review").classList.remove("on");
    logLines.length = 0; log("");
    const id = $("game").value;
    const level = Number($("level").value);
    const seed = Number($("seed").value) || 1;
    const G = getGame(id);
    const side = $("sideSel").value || (mulberry(seed * 7 + 3)() < 0.5 ? "left" : "right");
    const ailment = $("ailment").value || null;
    // the tray is what the pharmacy would carry in: derive from a preview plan with the same seed
    G.load().then(() => {
      const preview = G.plan(level, mulberry(seed), { side, ailment });
      const tray = trayFor(id, preview, $("traySel").value);
      const tallies = {};
      const body = window.__body;
      const ctx = {
        level, side, ailment: preview.ailment, rng: mulberry(seed),
        patient: {
          kind: "girl", el: $("mood"),
          hotspot(part, s) { if (!body) return { x: 0, y: 0, r: 40 }; const [x, y] = body.spot(part, s ? "side-" + s : null); return { x, y, r: 40 }; },
          react(m) { $("mood").textContent = MOOD[m] || "🙂"; clearTimeout(this._t); this._t = setTimeout(() => ($("mood").textContent = "🙂"), 900); log("react " + m); },
          pose(n) { log("pose " + n); },
        },
        tray,
        card: {
          setRows(rows) {
            $("rows").innerHTML = "";
            rows.forEach((r) => {
              const d = document.createElement("div");
              d.className = "row" + (r.voice === "patient" ? " patient" : "");
              d.dataset.id = r.id;
              const k = (r.parts || [{ t: r.kutchi }]).map((p) => (p.ph ? `<span class="ph">${p.t}</span>` : p.t)).join("");
              d.innerHTML = `<span class="box"></span><span><span class="k">${k}</span><span class="e">${r.english}</span></span>`;
              $("rows").appendChild(d);
            });
          },
          tick(id) { const r = $("rows").querySelector(`[data-id="${id}"]`); if (r) r.classList.add("ticked"); log("tick " + id); },
          pulse(id) { const r = $("rows").querySelector(`[data-id="${id}"]`); if (r) { r.classList.remove("pulse"); void r.offsetWidth; r.classList.add("pulse"); } },
        },
        say(line) { log("say " + line); },
        interject(w) { log("interject " + w); },
        tally(item, n) { tallies[item] = n; $("tally").innerHTML = Object.entries(tallies).map(([k, v]) => `<span>${k} ${v}</span>`).join(""); },
        log(e) { log("log " + e.type + " " + (e.rowId || "") + " " + JSON.stringify(e.detail || {})); (window.__healLog = window.__healLog || []).push(e); },
        hint() { log("hint"); },
        onboard(script) { log("onboard " + script.length + " step(s) (mock: not shown)"); return Promise.resolve("seen"); },
        done(res) {
          window.__healDone = res;
          log("done " + res.right + "/" + res.total);
          $("reviewPanel").innerHTML = `<h3>${res.right} / ${res.total}</h3>` + (res.words || []).map((w) => `<div>${w.kutchi} — ${w.english}</div>`).join("") + `<p><button onclick="document.getElementById('review').classList.remove('on')">close</button></p>`;
          $("review").classList.add("on");
        },
      };
      window.__healLog = [];
      window.__healDone = null;
      ctl = G.mount($("stage"), ctx);
      window.__heal = ctl;
      return ctl.start();
    }).then(() => {
      const P = ctl.debug && ctl.debug.plan;
      if (P && document.body.dataset.fair) $("answer").textContent = P.rows.map((r) => r.english).join(" · ");
      window.__healReady = true;
    });
  }
  $("go").onclick = () => { $("seed").value = Number($("seed").value) + 1; start(); };
  ["level", "sideSel", "ailment", "traySel"].forEach((k) => ($(k).onchange = start));
  $("eng").onchange = () => document.body.classList.toggle("english", $("eng").checked);
  $("bulb").onclick = () => { document.body.classList.add("english"); setTimeout(() => document.body.classList.toggle("english", $("eng").checked), 5000); };
  ready.then(start);
})();
</script>
</body>
</html>
