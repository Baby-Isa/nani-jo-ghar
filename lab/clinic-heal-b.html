<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clinic heal lab B</title>
<!--
  Clinic v2 heal games, lab B (design sheets part B): the soothing drinks
  (taste.js: coloured bumps, one drink per colour, before the timer), fever
  (a thermometer, red or blue; cloth / fan / blanket; alternating until just
  right), boing (wipes, beads counted into the doctor's syringe, BOING, a
  plaster, an apple). On the REAL host with the first-time cues on.
  Tests: build/test_clinic_heal_b.py, build/leak_clinic_heal_b.mjs.
-->
<style>
  :root { --bg: #f4ecdf; --ink: #3a2e28; --line: #d8c6a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; border-bottom: 2px solid var(--line); }
  nav b { margin-right: 4px; }
  nav span { white-space: nowrap; }
  nav a { display: inline-block; padding: 2px 8px; border: 2px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; background: #fff; }
  nav a.on { border-color: #2e8b7a; background: #e2f3ee; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
<nav id="nav"><b>Heal lab B</b> <small>clinic v2 prototypes on CB6b</small></nav>
<iframe id="f" title="The heal host"></iframe>
<script>
  const GAMES = [
    { id: "taste", name: "drinks (taste.js)" },
    { id: "fever", name: "fever" },
    { id: "boing", name: "boing" },
  ];
  const Q = new URLSearchParams(location.search);
  const nav = document.getElementById("nav");
  const f = document.getElementById("f");
  const kinds = ["girl", "boy", "nana", "old-woman", "ma", "ali"];
  const extras = GAMES.filter((g) => g.src).map((g) => "&src=" + encodeURIComponent(g.src)).join("");
  const links = [];
  GAMES.forEach((g, gi) => {
    const s = document.createElement("span");
    s.textContent = g.name + " ";
    [1, 2, 3].forEach((l) => {
      const a = document.createElement("a");
      a.textContent = "L" + l;
      const seed = 1 + Math.floor(Math.random() * 9999);
      a.href = `clinic-heal-host.html?game=${g.id}&level=${l}&kind=${kinds[(gi + l) % kinds.length]}&seed=${seed}&cues=1${extras}`;
      a.target = "f";
      a.onclick = () => links.forEach((x) => x.classList.toggle("on", x === a));
      links.push(a);
      s.appendChild(a);
    });
    nav.appendChild(s);
  });
  const first = links[Math.max(0, GAMES.findIndex((g) => g.id === (Q.get("game") || "eye"))) * 3 + (Number(Q.get("level") || 1) - 1)];
  first.classList.add("on");
  f.src = first.href;
</script>
</body>
</html>
