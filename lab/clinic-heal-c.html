<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic heal lab C (eye, foot + maybe-later)</title>
<style>
  :root { --side: 250px; --bar: 40px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #efe6d8; font: 15px/1.3 system-ui, sans-serif; color: #3a2e28; overflow: hidden; }
  #bar { height: var(--bar); display: flex; gap: 6px; align-items: center; padding: 0 8px; background: #3a2e28; color: #fff; font-size: 13px; overflow-x: auto; white-space: nowrap; }
  #bar select, #bar input, #bar button { font: inherit; padding: 2px 4px; }
  #bar input { width: 52px; }
  #main { position: absolute; top: var(--bar); left: 0; right: 0; bottom: 0; display: flex; }
  #side { width: var(--side); flex: none; background: #fbf6ee; border-right: 3px solid #d8c8b0; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  #stage { position: relative; flex: 1; min-width: 0; }
  .card { background: #fff; border: 2px solid #c9b79c; border-radius: 12px; padding: 6px 8px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 15px; }
  .row .t { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 2px solid #b9a88f; display: grid; place-items: center; font-size: 13px; color: #fff; }
  .row.done .t { background: #4f9a58; border-color: #4f9a58; }
  .row.pulse { animation: p 1s ease-in-out 3; }
  @keyframes p { 50% { background: #fff3b0; } }
  .ph { color: #8b8b8b; font-style: italic; }
  .en { display: none; color: #6b5b4b; font-size: 12px; }
  body.english .en { display: block; }
  #tally { font-size: 14px; }
  #patient { display: flex; gap: 8px; align-items: center; }
  #patient svg { width: 56px; height: 72px; }
  #mood { font-size: 26px; }
  #log { font-size: 11px; color: #6b5b4b; max-height: 120px; overflow-y: auto; white-space: pre-wrap; }
  #review { position: absolute; inset: 8%; background: #fffdf6; border: 4px solid #4f9a58; border-radius: 18px; padding: 14px; display: none; overflow: auto; z-index: 5; }
  #review h2 { margin: 0 0 8px; }
  .slot { display: inline-block; width: 26px; height: 26px; border-radius: 6px; margin: 2px; }
  #bulb { font-size: 22px; background: none; border: 0; cursor: pointer; }
  @media (max-height: 420px) { :root { --side: 210px; --bar: 34px; } .row { font-size: 13px; } #log { display: none; } }
  @media (max-width: 800px) and (orientation: portrait) { #main { flex-direction: column; } #side { width: auto; height: 34%; border-right: 0; border-bottom: 3px solid #d8c8b0; } }
</style>
</head>
<body>
<div id="bar">
  <b>Heal lab C</b>
  <select id="game"></select>
  <select id="level"><option>1</option><option>2</option><option>3</option></select>
  <select id="sideSel"><option value="">side: auto</option><option value="left">patient's left</option><option value="right">patient's right</option></select>
  seed <input id="seed" type="number" value="1">
  <button id="go">Restart</button>
  <label><input id="host" type="checkbox"> real host</label>
  <span id="hostNote"></span>
</div>
<div id="main">
  <div id="side">
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Doctor</b><button id="bulb" title="English for a few seconds">💡</button></div><div id="rows"></div></div>
    <div id="patient"><svg id="pt" viewBox="300 20 680 880"></svg><div><div id="mood">🙂</div><div id="tally"></div></div></div>
    <div id="log"></div>
  </div>
  <div id="stage"><div id="review"></div></div>
</div>

<script src="../js/shared/sfx.js"></script>
<script src="../js/shared/uistore.js"></script>
<script src="../js/shared/onboard.js"></script>
<script src="../js/clinic/body.js"></script>
<!-- the core's registry, once it lands on claude/clinic-core (a 404 until then) -->
<script src="../js/clinic/heal/registry.js"></script>
<script>
  // a stand-in registry with the contract's shape, only if the core's isn't here yet
  window.Clinic = window.Clinic || {};
  if (!Clinic.Heal) {
    const games = {};
    Clinic.Heal = { stub: true, register(def) { games[def.id] = def; }, get: (id) => games[id], list: () => Object.keys(games) };
  }
</script>
<script src="../js/clinic/heal/games/eye.js"></script>
<script src="../js/clinic/heal/games/foot.js"></script>
<script src="../js/clinic/heal/games/tummy.js"></script>
<script src="../js/clinic/heal/games/hic.js"></script>
<script src="../js/clinic/heal/games/hair.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const IDS = ["eye", "foot", "tummy", "hic", "hair"];
  const $ = (id) => document.getElementById(id);
  const get = (id) => (Clinic.Heal.get ? Clinic.Heal.get(id) : (Clinic.Heal.games || {})[id]);
  IDS.filter(get).forEach((id) => { const o = document.createElement("option"); o.value = o.textContent = id; $("game").appendChild(o); });
  $("game").value = Q.get("game") || "eye";
  $("level").value = Q.get("level") || "1";
  $("sideSel").value = Q.get("side") || "";
  $("seed").value = Q.get("seed") || "1";
  $("host").checked = Q.get("host") === "1";
  $("hostNote").textContent = Clinic.Heal.stub ? "(stub registry)" : "(core registry)";

  function mulberry(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // the grey patient, from the body map (read-only use of js/clinic/body.js)
  let BODY = null;
  const bodyP = fetch("../data/patients/grey-adult.json").then((r) => r.json()).then((f) => (BODY = ClinicBody.build(f)));
  function drawPatient() {
    const svg = $("pt");
    svg.innerHTML = "";
    Object.keys(BODY.polys).sort((a, b) => ClinicBody.area(BODY.polys[b]) - ClinicBody.area(BODY.polys[a])).forEach((k) => {
      if (/eye|nose|mouth|tooth|throat/.test(k)) return;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      p.setAttribute("points", BODY.polys[k].map((q) => q.join(",")).join(" "));
      p.setAttribute("fill", "#9aa0a8"); p.setAttribute("stroke", "#6d737c"); p.setAttribute("stroke-width", "4");
      svg.appendChild(p);
    });
  }

  const lab = (window.__lab = { events: [], result: null, ctl: null, rows: [], ticks: [], says: [], logs: [], tallies: {} });
  function ev(type, x) { lab.events.push(Object.assign({ type, t: Date.now() }, x)); const l = $("log"); l.textContent = `${type} ${JSON.stringify(x || {})}\n` + l.textContent; }

  function renderRows() {
    $("rows").innerHTML = "";
    lab.rows.forEach((r) => {
      const d = document.createElement("div");
      d.className = "row" + (lab.ticks.includes(r.id) ? " done" : "");
      d.dataset.row = r.id;
      const html = String(r.kutchi || "").replace(/\[EN: ([^\]]*)\]/g, '<span class="ph">$1</span>');
      d.innerHTML = `<span class="t">✓</span><span>${html}<span class="en">${r.english || ""}</span></span>`;
      $("rows").appendChild(d);
    });
  }
  function speak(text) {
    try { if (!window.speechSynthesis || Q.get("mute") === "1") return; const u = new SpeechSynthesisUtterance(text.replace(/\[EN: ([^\]]*)\]/g, "$1")); u.rate = 0.95; speechSynthesis.speak(u); } catch (e) {}
  }

  function makeCtx(level, side, seed) {
    const rng = mulberry(seed * 9973 + level);
    const def = get($("game").value);
    const trayQ = Q.get("tray");
    const tray = (trayQ ? trayQ.split(",") : def.items).map((id) => ({ id }));
    const moods = { ouch: "😖", giggle: "😆", relief: "😌", happy: "😄" };
    return {
      level, side, rng, tray,
      patient: {
        kind: "grey-adult", el: $("pt"),
        hotspot(partId, s) { const [x, y] = BODY.spot(partId, s ? "side-" + s : null); return { x, y, r: 40 }; },
        react(m) { $("mood").textContent = moods[m] || "🙂"; ev("react", { m }); setTimeout(() => ($("mood").textContent = "🙂"), 900); },
        pose(name) { ev("pose", { name }); },
      },
      card: {
        setRows(rows) { lab.rows = rows; ev("setRows", { n: rows.length }); renderRows(); },
        tick(id) { if (!lab.ticks.includes(id)) lab.ticks.push(id); ev("tick", { id }); renderRows(); },
        pulse(id) { ev("pulse", { id }); const d = document.querySelector(`[data-row="${id}"]`); if (d) { d.classList.remove("pulse"); void d.offsetWidth; d.classList.add("pulse"); } },
      },
      say(id, line) { lab.says.push({ id, line }); ev("say", { id, text: line && line.kutchi }); if (line && line.audio && Q.get("mute") !== "1") { const a = new Audio("../" + line.audio); a.play().catch(() => speak(line.kutchi || "")); } else if (line) speak(line.kutchi || ""); },
      interject(w) { ev("interject", { w }); },
      tally(item, n) { lab.tallies[item] = n; $("tally").textContent = Object.entries(lab.tallies).map(([k, v]) => `${k.replace(/^.*-/, "")} ${v}`).join(" · "); },
      log(e) { lab.logs.push(e); ev("log", e); },
      hint() { ev("hint"); },
      onboard(script) { if (Q.get("onboard") === "1" && window.Onboard) Onboard.run("heal-" + $("game").value, script, { force: true, container: $("stage") }); },
      done(res) {
        lab.result = res; ev("done", { right: res.right, total: res.total });
        const r = $("review"); r.style.display = "block";
        r.innerHTML = `<h2>${res.right} / ${res.total}</h2><div>${(res.rows || []).map((x) => `<span class="slot" title="${x.id}" style="background:${x.right ? "#4f9a58" : "#c9483b"}"></span>`).join("")}</div>` +
          `<h3>Words</h3>` + res.words.map((w) => `<div><b>${w.kutchi}</b> · ${w.english}</div>`).join("") + `<p><button onclick="document.getElementById('go').click()">Next</button></p>`;
      },
    };
  }

  let hostCtl = null;
  async function run() {
    await bodyP;
    drawPatient();
    if (lab.ctl) lab.ctl.destroy();
    if (hostCtl && hostCtl.destroy) hostCtl.destroy();
    Object.assign(lab, { events: [], result: null, rows: [], ticks: [], says: [], logs: [], tallies: {} });
    $("review").style.display = "none"; $("tally").textContent = ""; $("log").textContent = ""; renderRows();
    const level = Number($("level").value);
    const side = $("sideSel").value || null;
    const seed = Number($("seed").value) || 1;
    const def = get($("game").value);
    if ($("host").checked && Clinic.Heal.host) {
      // the core's real host (js/clinic/heal/host.js) when it has landed
      hostCtl = Clinic.Heal.host({ game: def.id, level, side, seed, stage: $("stage") });
      return;
    }
    const ctx = makeCtx(level, side, seed);
    lab.ctx = ctx;
    lab.ctl = def.mount($("stage"), ctx);
    await lab.ctl.start();
    ev("started", { game: def.id, level });
  }
  $("go").onclick = run;
  ["game", "level", "sideSel"].forEach((id) => ($(id).onchange = run));
  $("bulb").onclick = () => { document.body.classList.add("english"); setTimeout(() => document.body.classList.remove("english"), [0, 5000, 3000, 2000][Number($("level").value)] || 3000); };
  lab.run = run;
  run();
})();
</script>
</body>
</html>
