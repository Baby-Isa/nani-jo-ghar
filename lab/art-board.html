<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art board</title>
<!--
  The art board (s19-artreg; read-only). Every piece of art in the art registry (data/art/registry.json), by game: is it fine, does it
  need replacing, has it been replaced. Data: lab/art-board-data.js, written by build/tools/art/artuse.mjs (which pictures each page
  really loads, in full plays) through build/tools/art/registry.mjs --board (the pieces). How it works: docs/design-language/art-registry.md.
  ?theme=dark|light picks the theme (the button remembers it); ?status=needs-redo,stand-in shows only those.
-->
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#26211a; --soft:#655d4f; --line:#ddd5c4; --ok:#2e8b4f; --cand:#2f6fc2; --stand:#b97c0c; --redo:#c8372d; --ret:#7d776b; --park:#8a7fa3; --chk1:#e9e4d8; --chk2:#f7f4ec; --pill-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1a16; --card:#26231d; --ink:#efe9da; --soft:#b5ad97; --line:#3c382e; --ok:#5cc487; --cand:#6ea8f0; --stand:#e8b14a; --redo:#ff6b5f; --ret:#a39d90; --park:#b7acd0; --chk1:#34302a; --chk2:#2c2923; --pill-ink:#1c1a16; } }
  :root[data-theme="dark"] { --bg:#1c1a16; --card:#26231d; --ink:#efe9da; --soft:#b5ad97; --line:#3c382e; --ok:#5cc487; --cand:#6ea8f0; --stand:#e8b14a; --redo:#ff6b5f; --ret:#a39d90; --park:#b7acd0; --chk1:#34302a; --chk2:#2c2923; --pill-ink:#1c1a16; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding:12px 16px 40px; max-width:1500px; margin:0 auto; overflow-x:hidden; }
  h1 { font-size:clamp(20px,3.2vh + 1vw,30px); margin:0 120px 4px 0; }
  h2 { font-size:18px; margin:18px 0 6px; }
  .sub { color:var(--soft); margin:0 0 10px; font-size:14px; }
  .theme { position:fixed; top:8px; right:10px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; z-index:3; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:0 0 10px; }
  .tile { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:10px; padding:7px 10px; cursor:pointer; text-align:left; font:inherit; color:inherit; }
  .tile b { display:block; font-size:24px; line-height:1.1; color:var(--c); }
  .tile span { font-size:13px; color:var(--soft); }
  .tile.off { opacity:.45; }
  .c-approved { --c:var(--ok); } .c-candidate { --c:var(--cand); } .c-stand-in { --c:var(--stand); } .c-needs-redo { --c:var(--redo); } .c-retired { --c:var(--ret); } .c-parked { --c:var(--park); }
  .alarm { background:var(--card); border:2px solid var(--redo); border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:14px; }
  .alarm b { color:var(--redo); }
  .note { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:14px; }
  .jump { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; font-size:14px; }
  .jump a { color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:2px 10px; text-decoration:none; }
  section.game > h2 { display:flex; flex-wrap:wrap; gap:2px 12px; align-items:baseline; }
  section.game > h2 small { font-size:13px; color:var(--soft); font-weight:400; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
  .pc { background:var(--card); border:1px solid var(--line); border-top:5px solid var(--c); border-radius:10px; overflow:hidden; font-size:12px; line-height:1.3; min-width:0; }
  .pc .th { height:96px; display:flex; gap:4px; align-items:center; justify-content:center; background:repeating-conic-gradient(var(--chk1) 0 25%, var(--chk2) 0 50%) 0 0/14px 14px; padding:4px; }
  .pc .th figure { margin:0; flex:1 1 0; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .pc .th img { max-width:100%; max-height:74px; object-fit:contain; }
  .pc .th figcaption { font-size:10px; font-weight:700; color:var(--ink); background:var(--card); border-radius:3px; padding:0 3px; }
  .pc .t { padding:5px 7px 7px; color:var(--soft); overflow-wrap:anywhere; }
  .pc .t b.nm { color:var(--ink); font-size:13px; display:block; }
  .pill { display:inline-block; padding:0 6px; border-radius:999px; background:var(--c); color:var(--pill-ink); font-weight:700; font-size:11px; margin:2px 4px 2px 0; }
  .pc .was { display:flex; gap:3px; align-items:center; margin-top:3px; flex-wrap:wrap; }
  .pc .was img { width:28px; height:28px; object-fit:contain; opacity:.6; background:var(--chk1); border-radius:3px; }
  .pc .red { color:var(--redo); font-weight:700; }
  .pc code { font-size:11px; color:var(--soft); }
  table { border-collapse:collapse; width:100%; font-size:13px; table-layout:fixed; } td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; } td.num, th.num { text-align:right; width:5.5em; }
  .hidden { display:none !important; }
  @media (max-height:340px) { body { padding:6px 12px 24px; } .grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); } .pc .th { height:72px; } .pc .th img { max-height:54px; } .tile b { font-size:20px; } }
  @media (min-width:1700px) { body { font-size:18px; } .grid { grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); } .pc .th { height:120px; } .pc .th img { max-height:98px; } .pc { font-size:13px; } }
</style>
</head>
<body>
<button class="theme" id="theme" type="button">Light / dark</button>
<h1>Art board</h1>
<p class="sub" id="sub"></p>
<div class="tiles" id="tiles"></div>
<div id="alarm"></div>
<div class="note" id="needs"></div>
<div class="note" id="complete"></div>
<nav class="jump" id="jump"></nav>
<div id="games"></div>
<h2 id="moveout">Stored, loaded by nothing: Sprint 20's move-out list</h2>
<p class="sub" id="mosub"></p>
<div class="note"><table id="motable"></table></div>
<script src="art-board-data.js"></script>
<script>
(function () {
  var D = window.ART_BOARD, $ = function (id) { return document.getElementById(id); };
  var h = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var q = {}; location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { q[k] = decodeURIComponent(v); });
  var root = document.documentElement;
  var saved = (function () { try { return localStorage.getItem("artboard-theme") || ""; } catch (e) { return ""; } })();
  var theme = q.theme || saved;
  if (theme === "dark" || theme === "light") root.setAttribute("data-theme", theme);
  $("theme").onclick = function () {
    var dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var t = dark ? "light" : "dark"; root.setAttribute("data-theme", t);
    try { localStorage.setItem("artboard-theme", t); } catch (e) {}
  };
  if (!D || !D.pieces) { $("sub").textContent = "No data yet: run node build/tools/art/artuse.mjs"; return; }
  var ST = [["approved", "Fine (approved)", "the judge or Zafar passed it"], ["candidate", "New, waiting for a yes", "a new cut, not signed off yet"], ["stand-in", "Stand-in", "in the game, below the standard: fine while prototyping"], ["needs-redo", "Needs replacing", "a fault named: on the next art run"], ["retired", "Replaced", "a newer piece took its place"], ["parked", "Parked", "a parked game's art"]];
  var LABEL = {}; ST.forEach(function (s) { LABEL[s[0]] = s[1]; });
  var P = D.pieces, S = D.summary || {};
  var show = {}; ST.forEach(function (s) { show[s[0]] = !q.status || q.status.split(",").indexOf(s[0]) >= 0; });
  var count = function (st) { return P.filter(function (p) { return p.s === st; }).length; };
  $("sub").textContent = P.length + " pieces in the art registry, from what the pages really load (checked " + D.generated + "): " + S.loadedByAPage + " pictures loaded of " + S.onDisk + " stored. Tap a colour to show or hide it.";
  // the status tiles (they filter the board)
  $("tiles").innerHTML = ST.map(function (s) { return '<button type="button" class="tile c-' + s[0] + (show[s[0]] ? "" : " off") + '" data-s="' + s[0] + '"><b>' + count(s[0]) + "</b>" + h(s[1]) + "<br><span>" + h(s[2]) + "</span></button>"; }).join("");
  [].forEach.call(document.querySelectorAll(".tile"), function (t) { t.onclick = function () { var s = t.getAttribute("data-s"); show[s] = !show[s]; t.classList.toggle("off", !show[s]); apply(); }; });
  // the alarms: a replaced file a page still loads; a loaded picture the registry does not know
  var rl = P.filter(function (p) { return p.rl && p.rl.length; });
  var GN = { "chai-tray": "Chai", eggs: "Eggs", baking: "Baking", corn: "Corn", chop: "Chop", chaat: "Chaat", fetch: "Pantry", daar: "Daar", samosa: "Samosa", "maani-line": "Maani", "mishkaki-grill": "Sekelo (grill)", serve: "Serving kitchen", title: "Cook title", story: "Story mode", house: "House and first launch", clinic: "Clinic", day: "A day at Nani's", labs: "Lab pages", "parked modes": "Parked modes", shared: "Shared by several games", other: "Not loaded by any page played" };
  var nm = function (g) { return GN[g] || g; };
  var nrl = rl.reduce(function (a, p) { return a + p.rl.length; }, 0);
  $("alarm").innerHTML = (rl.length ? '<div class="alarm"><b>Old art still showing: ' + nrl + (nrl === 1 ? " replaced picture is" : " replaced pictures are") + " still loaded</b> (" + rl.map(function (p) { return h(p.n) + " in " + h(p.rl[0].games.map(nm).join(", ")); }).slice(0, 8).join("; ") + (rl.length > 8 ? "; ..." : "") + "). The retired check lists each place.</div>" : "") +
    (D.unregistered && D.unregistered.length ? '<div class="alarm"><b>' + D.unregistered.length + " loaded pictures are not in the registry</b>: " + h(D.unregistered.slice(0, 6).join(", ")) + "</div>" : "");
  // what needs Zafar: people's art waiting for his yes; and the next art run's count
  var people = P.filter(function (p) { return p.k === "person" && p.s === "candidate"; });
  var KG = ["chai-tray", "eggs", "baking", "corn", "chop", "chaat", "fetch", "daar", "samosa", "maani-line", "mishkaki-grill", "serve"];
  var inKitchen = function (p) { return p.used.some(function (g) { return KG.indexOf(g) >= 0; }); };
  var redo = P.filter(function (p) { return p.s === "needs-redo" && inKitchen(p); }), stand = P.filter(function (p) { return p.s === "stand-in" && inKitchen(p); });
  $("needs").innerHTML = "<b>Needs you:</b> " + (people.length ? people.length + " people's pictures wait for your yes (" + people.slice(0, 6).map(function (p) { return h(p.n); }).join(", ") + ")" : "no people's art waits for your yes") +
    ". <b>The next art run (the kitchen games):</b> " + redo.length + " pieces in use need replacing, " + stand.length + " in use are stand-ins (red and amber in each game below). The clinic, the day and the house art is not judged yet: it shows as stand-in.";
  // how complete the map is, per game (from the plays)
  var ORDER = ["chai-tray", "eggs", "baking", "corn", "chop", "chaat", "fetch", "daar", "samosa", "maani-line", "mishkaki-grill", "serve", "title", "story", "house", "clinic", "day", "labs", "parked modes"];
  var C = D.completeness || {}, pg = C.perGame || {};
  // (games with the same line are said once: "Chai, Eggs, ...: 4 plays to the end, 1 to the first step only")
  var same = {}; ORDER.filter(function (g) { return pg[g]; }).forEach(function (g) { (same[pg[g]] = same[pg[g]] || []).push(nm(g)); });
  $("complete").innerHTML = "<b>How complete:</b> " + Object.keys(same).map(function (k) { return h(same[k].join(", ")) + ": " + h(k); }).join("; ") + ". " +
    (C.notReached && C.notReached.length ? "Not reached: " + h(C.notReached.slice(0, 6).join("; ")) + (C.notReached.length > 6 ? "; ..." : "") + ". " : "") +
    "A picture only a path these plays did not take asks for (a mistake, a rare order) is not counted as loaded: it stays on the move-out list's \"named, not loaded\" side until a play reaches it.";
  // each piece's home: the one game that loads it; several games: shared; none: its own game's, else "other"
  var SHORT = { chai: "chai-tray", sekelo: "mishkaki-grill", maani: "maani-line", pantry: "fetch", cook: "title" };
  // (a story day, the serving kitchen, the title and the lab pages show every game's art: a piece one kitchen game uses lives there)
  var KITCHEN = ORDER.slice(0, 11);
  var home = function (p) {
    var kit = p.used.filter(function (g) { return KITCHEN.indexOf(g) >= 0; });
    if (kit.length === 1) return kit[0];
    if (p.used.length === 1) return p.used[0];
    if (p.used.length > 1) return "shared";
    var g = SHORT[p.g] || p.g;
    return ORDER.indexOf(g) >= 0 ? g : "other";
  };
  var groups = {}; P.forEach(function (p) { var k = home(p); (groups[k] = groups[k] || []).push(p); });
  var keys = ORDER.concat(["shared", "other"]).filter(function (k) { return groups[k]; });
  var rank = { "needs-redo": 0, "stand-in": 1, candidate: 2, approved: 3, parked: 4, retired: 5 };
  var img = function (f, cap) { return '<figure><img loading="lazy" src="../' + h(f) + '" alt="">' + (cap ? "<figcaption>" + h(cap) + "</figcaption>" : "") + "</figure>"; };
  var card = function (p) {
    var states = Object.keys(p.st), first = states.length ? p.st[states[0]] : null, cand = p.cand ? p.cand[Object.keys(p.cand)[0]] : null;
    var th = (first ? img(first, cand ? "now" : "") : "") + (cand ? img(cand, "new") : "") + (!first && !cand && p.rep.length ? img(p.rep[0], "old") : "");
    var lines = [];
    lines.push('<span class="pill">' + h(LABEL[p.s] || p.s) + "</span>" + h(p.v) + (p.rev > 1 ? ", version " + p.rev : ""));
    if (p.by) lines.push("passed by " + h(p.by) + (p.on ? ", " + h(p.on) : ""));
    if (p.note) lines.push(h(p.note));
    if (p.row) lines.push("row " + h(p.row));
    if (p.src) lines.push("from " + h(p.src) + (p.srcDate ? ", " + h(p.srcDate) : ""));
    if (states.length > 1) lines.push(states.length + " states: " + h(states.slice(0, 6).join(", ")) + (states.length > 6 ? " ..." : ""));
    if (p.used.length) lines.push("used in " + h(p.used.map(nm).join(", ")));
    else if (p.s !== "retired") lines.push("not loaded by any page played");
    if (p.repBy) lines.push("replaced by " + h(p.repBy));
    if (p.next) lines.push("<b>the new one is cut:</b> " + h(p.next) + " (to wire)");
    if (p.flaws.length) lines.push('<span class="red">flaw: ' + h(p.flaws.join(", ")) + "</span>");
    if (p.rl && p.rl.length) lines.push('<span class="red">its old file is still loaded (' + h(p.rl[0].games.map(nm).join(", ")) + ")</span>");
    var was = p.rep.length && first ? '<div class="was">was ' + p.rep.slice(0, 4).map(function (f) { return '<img loading="lazy" src="../' + h(f) + '" alt="" title="' + h(f) + '">'; }).join("") + (p.rep.length > 4 ? " +" + (p.rep.length - 4) : "") + "</div>" : "";
    return '<div class="pc c-' + h(p.s) + '" data-s="' + h(p.s) + '" title="' + h(p.id) + '"><div class="th">' + th + '</div><div class="t"><b class="nm">' + h(p.n) + "</b><code>" + h(p.id) + "</code><br>" + lines.join("<br>") + was + "</div></div>";
  };
  $("jump").innerHTML = keys.map(function (k) { return '<a href="#g-' + h(k.replace(/\W/g, "-")) + '">' + h(nm(k)) + " " + groups[k].length + "</a>"; }).join("") + '<a href="#moveout">Move-out list</a>';
  $("games").innerHTML = keys.map(function (k) {
    var l = groups[k].sort(function (a, b) { return rank[a.s] - rank[b.s] || (a.n < b.n ? -1 : 1); });
    var c = {}; l.forEach(function (p) { c[p.s] = (c[p.s] || 0) + 1; });
    return '<section class="game" id="g-' + h(k.replace(/\W/g, "-")) + '"><h2>' + h(nm(k)) + " <small>" + ST.filter(function (s) { return c[s[0]]; }).map(function (s) { return c[s[0]] + " " + s[1].toLowerCase(); }).join(", ") + (pg[k] ? " · map: " + h(pg[k]) : "") + '</small></h2><div class="grid">' + l.map(card).join("") + "</div></section>";
  }).join("");
  function apply() { [].forEach.call(document.querySelectorAll(".pc"), function (el) { el.classList.toggle("hidden", !show[el.getAttribute("data-s")]); }); }
  apply();
  // the move-out list
  var M = D.moveOut, mb = function (b) { return (b / 1e6).toFixed(1) + " MB"; };
  if (M) {
    var T = M.totals;
    $("mosub").innerHTML = h(T.unloadedUnnamed.files) + " pictures (" + mb(T.unloadedUnnamed.bytes) + ") are loaded by no page played and named by no file: they can move to sources/art-retired/ in Sprint 20. " +
      h(T.namedNotLoaded.files) + " more (" + mb(T.namedNotLoaded.bytes) + ") are named somewhere but no play loaded them: check before moving. Videos: " + M.videos.map(function (v) { return h(v.path) + " (" + mb(v.bytes) + ")"; }).join(", ") + ". " +
      (M.chatgpt && M.chatgpt.length ? "ChatGPT folders on main: " + M.chatgpt.length + " (" + mb(T.chatgptOnMain.bytes) + (M.chatgpt.every(function (d) { return !d.onThisBranch; }) ? ", already moved to sources/art on this branch" : "") + "). " : "") +
      "All of assets/: " + h(T.assets.files) + " files, " + mb(T.assets.bytes) + ".";
    $("motable").innerHTML = "<tr><th>Folder (loaded by nothing, named by nothing)</th><th class=num>Files</th><th class=num>Size</th></tr>" + M.folders.slice(0, 25).map(function (r) { return "<tr><td>" + h(r.path) + "</td><td class=num>" + r.files + "</td><td class=num>" + mb(r.bytes) + "</td></tr>"; }).join("") +
      (M.folders.length > 25 ? "<tr><td colspan=3>" + (M.folders.length - 25) + " smaller folders: build/reports/art-move-out.json</td></tr>" : "");
  }
})();
</script>
</body>
</html>
