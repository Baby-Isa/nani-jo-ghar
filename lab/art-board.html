<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art board</title>
<!--
  The art board (s19-artuse; read-only). Which picture each kitchen game really loads, and how new it is. Data: lab/art-board-data.js,
  written by build/tools/art/artuse.mjs from the load check's page loads (build/reports/art-use.json) and data/art/retired.json.
  green = new (v4, Sprint 19) and loaded | teal = approved and current though older (data/art/approved.json) | amber = old, no replacement yet, loaded | red = retired (a v4 piece replaces it) and still
  loaded | grey = stored, loaded by nothing. Pages were opened to their first step, not played to the end: see the line under the title.
-->
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#26211a; --soft:#6a6254; --line:#ddd5c4; --green:#2e8b4f; --appr:#1f9d9a; --amber:#c98a12; --red:#c8372d; --grey:#8b8578; --chk1:#e9e4d8; --chk2:#f7f4ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1a16; --card:#26231d; --ink:#efe9da; --soft:#b0a892; --line:#3c382e; --green:#5cc487; --appr:#4fd1cc; --amber:#e8b14a; --red:#ff6b5f; --grey:#9a9486; --chk1:#34302a; --chk2:#2c2923; } }
  :root[data-theme="dark"] { --bg:#1c1a16; --card:#26231d; --ink:#efe9da; --soft:#b0a892; --line:#3c382e; --green:#5cc487; --appr:#4fd1cc; --amber:#e8b14a; --red:#ff6b5f; --grey:#9a9486; --chk1:#34302a; --chk2:#2c2923; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding:12px 16px 40px; max-width:1500px; margin:0 auto; }
  h1 { font-size:clamp(20px,3.2vh + 1vw,30px); margin:0 0 4px; }
  .sub { color:var(--soft); margin:0 0 10px; font-size:14px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin:0 0 10px; font-size:14px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:14px; height:14px; border-radius:4px; display:inline-block; }
  .g { background:var(--green); } .p { background:var(--appr); } .a { background:var(--amber); } .r { background:var(--red); } .y { background:var(--grey); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:0 0 14px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:inherit; text-decoration:none; display:block; }
  .tile b { display:block; font-size:15px; margin-bottom:4px; }
  .tile .n { display:flex; gap:10px; font-weight:700; font-size:15px; }
  .tile .n span.g, .tile .n span.p, .tile .n span.a, .tile .n span.r { background:none; } .n .g { color:var(--green); } .n .p { color:var(--appr); } .n .a { color:var(--amber); } .n .r { color:var(--red); }
  .bar { display:flex; height:7px; border-radius:4px; overflow:hidden; margin-top:5px; background:var(--line); } .bar i { display:block; height:100%; }
  .tile small { color:var(--soft); font-size:12px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:0 0 14px; font-size:14px; }
  .note b { color:var(--red); }
  section.game { margin:0 0 14px; }
  section.game > h2 { font-size:18px; margin:0 0 6px; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
  section.game > h2 small { font-size:13px; color:var(--soft); font-weight:400; }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:0 0 6px; padding:6px 10px; }
  summary { cursor:pointer; font-weight:700; padding:2px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:6px; padding:8px 0 4px; }
  .pic { border:3px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card); font-size:11px; line-height:1.2; word-break:break-all; }
  .pic.g { border-color:var(--green); } .pic.p { border-color:var(--appr); border-style:dashed; } .pic.a { border-color:var(--amber); } .pic.r { border-color:var(--red); }
  .pic .th { height:78px; background:repeating-conic-gradient(var(--chk1) 0 25%, var(--chk2) 0 50%) 0 0/14px 14px; display:flex; align-items:center; justify-content:center; }
  .pic img { max-width:100%; max-height:100%; object-fit:contain; }
  .pic .t { padding:3px 4px 4px; color:var(--soft); }
  .pic .t b { color:var(--ink); font-weight:700; }
  .pic .v { display:inline-block; padding:0 4px; border-radius:3px; color:#fff; font-weight:700; margin-right:3px; }
  .pic.g .v { background:var(--green); } .pic.p .v { background:var(--appr); } .pic.a .v { background:var(--amber); } .pic.r .v { background:var(--red); }
  .pic .rep { display:block; color:var(--red); }
  table { border-collapse:collapse; width:100%; font-size:13px; } td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); } td.num, th.num { text-align:right; }
  .theme { position:fixed; top:8px; right:10px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; z-index:3; }
  @media (max-height:340px) { body { padding:6px 12px 24px; } .grid { grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); } .pic .th { height:60px; } }
  @media (min-width:1700px) { body { font-size:18px; } .grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); } .pic .th { height:96px; } .pic { font-size:12px; } }
</style>
</head>
<body>
<button class="theme" id="theme" type="button">Light / dark</button>
<h1>Art board</h1>
<p class="sub" id="sub"></p>
<div class="legend">
  <span><i class="dot g"></i> New (v4, Sprint 19), loaded</span>
  <span><i class="dot p"></i> Approved, current (older, but Zafar signed it off), loaded</span>
  <span><i class="dot a"></i> Old, not approved, no replacement yet, loaded</span>
  <span><i class="dot r"></i> Retired (a new piece replaces it) and still loaded</span>
  <span><i class="dot y"></i> Stored, loaded by nothing (the list at the bottom)</span>
</div>
<div class="tiles" id="tiles"></div>
<div class="note" id="note"></div>
<div id="games"></div>
<h2 style="font-size:18px">Stored, loaded by nothing</h2>
<p class="sub" id="greysub"></p>
<div class="note"><table id="grey"></table></div>
<script src="art-board-data.js"></script>
<script>
(function () {
  var D = window.ART_BOARD, $ = function (id) { return document.getElementById(id); };
  var h = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  document.documentElement.setAttribute("data-theme", (function () { try { return localStorage.getItem("artboard-theme") || ""; } catch (e) { return ""; } })() || "");
  if (!document.documentElement.getAttribute("data-theme")) document.documentElement.removeAttribute("data-theme");
  $("theme").onclick = function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var t = dark ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("artboard-theme", t); } catch (e) {}
  };
  var S = D.summary, C = D.completeness;
  $("sub").textContent = "From what the pages really load (checked " + D.generated + "). " + S.loadedByAPage + " pictures loaded of " + S.onDisk + " stored.";
  var names = { "(title)": "Title screen", "chai-tray": "Chai", assemble: "Chaat", fetch: "Pantry", "maani-line": "Maani", "mishkaki-grill": "Sekelo (grill)", daar: "Daar", chop: "Chop", samosa: "Samosa", baking: "Baking", eggs: "Eggs", corn: "Corn", tadka: "Tadka (inside daar)", stir: "Stir (inside daar)" };
  var order = ["chai-tray", "eggs", "baking", "corn", "chop", "assemble", "fetch", "daar", "samosa", "maani-line", "mishkaki-grill", "tadka", "stir", "(title)"];
  var G = D.games;
  order = order.filter(function (k) { return G[k]; }).sort(function (a, b) { return G[b].red - G[a].red || order.indexOf(a) - order.indexOf(b); }); // the games with retired art still loaded come first
  var nm = function (k) { return names[k] || k; };
  $("tiles").innerHTML = order.filter(function (k) { return G[k]; }).map(function (k) {
    var c = G[k], t = c.total || 1;
    return '<a class="tile" href="#g-' + h(k) + '"><b>' + h(nm(k)) + '</b><div class="n"><span class="g" title="new">' + c.green + '</span><span class="p" title="approved">' + c.approved + '</span><span class="a" title="old">' + c.amber + '</span><span class="r" title="retired, still loaded">' + c.red + '</span></div>' +
      '<div class="bar"><i class="g" style="width:' + c.green / t * 100 + '%"></i><i class="p" style="width:' + c.approved / t * 100 + '%"></i><i class="a" style="width:' + c.amber / t * 100 + '%"></i><i class="r" style="width:' + c.red / t * 100 + '%"></i></div>' +
      '<small>' + c.total + ' loaded</small></a>';
  }).join("");
  $("note").innerHTML = "<b>How complete:</b> " + C.pagesOpened.length + " of " + C.pagesRun + " pages opened; each only to its first step at level 1, none played to its end. " +
    "Art a later step, level or mood brings in shows as grey below even if the game uses it, so a grey count is an upper bound. " +
    (C.pagesNotOpened.length ? "Not opened: " + h(C.pagesNotOpened.join("; ")) + ". " : "") + "Chaat is the Assemble page (its chop is the Chop page).";
  var pics = D.pics.map(function (p) { return { path: p[0], v: p[1], s: p[2], games: p[3].split(","), rep: p[4] }; });
  var rank = { r: 0, a: 1, p: 2, g: 3 };
  $("games").innerHTML = order.filter(function (k) { return G[k]; }).map(function (k) {
    var c = G[k], mine = pics.filter(function (p) { return p.games.indexOf(k) >= 0; }).sort(function (a, b) { return rank[a.s] - rank[b.s] || (a.path < b.path ? -1 : 1); });
    function grp(label, s, open) {
      var l = mine.filter(function (p) { return p.s === s; });
      if (!l.length) return "";
      return '<details' + (open ? " open" : "") + '><summary><i class="dot ' + s + '"></i> ' + label + " (" + l.length + ")</summary><div class=\"grid\">" + l.map(function (p) {
        var f = p.path.split("/").slice(-1)[0], dir = p.path.replace(/\/[^/]*$/, "").replace(/^assets\//, "");
        return '<div class="pic ' + p.s + '" title="' + h(p.path) + '"><div class="th"><img loading="lazy" src="../' + h(p.path) + '" alt=""></div><div class="t"><span class="v">' + h(p.v) + "</span><b>" + h(f) + "</b><br>" + h(dir) +
          (p.games.length > 1 ? "<br>on " + p.games.length + " pages" : "") + (p.s === "p" ? "<br>approved: Zafar's chai sign-off" : "") + (p.rep ? '<span class="rep">use ' + h(p.rep.replace(/assets\/cook\/items\//, "")) + "</span>" : "") + "</div></div>";
      }).join("") + "</div></details>";
    }
    return '<section class="game" id="g-' + h(k) + '"><h2>' + h(nm(k)) + " <small>" + c.green + " new, " + c.approved + " approved, " + c.amber + " old, " + c.red + " retired and still loaded</small></h2>" +
      grp("Retired, still loaded", "r", true) + grp("Old, not approved, no replacement yet", "a", false) + grp("Approved, current", "p", false) + grp("New (v4)", "g", false) + "</section>";
  }).join("");
  $("greysub").textContent = S.storedLoadedByNothing + " pictures; " + S.greyButNamed + " are named by some file (maybe loaded at a later step), " + S.greyUnnamed + " are named by nothing.";
  var rows = Object.keys(D.grey).map(function (d) { return [d, D.grey[d]]; }).sort(function (a, b) { return b[1].n - a[1].n; }).slice(0, 40);
  $("grey").innerHTML = "<tr><th>Folder</th><th class=num>Stored</th><th class=num>Named somewhere</th></tr>" + rows.map(function (r) { return "<tr><td>" + h(r[0]) + '</td><td class=num>' + r[1].n + '</td><td class=num>' + r[1].named + "</td></tr>"; }).join("") + (Object.keys(D.grey).length > 40 ? "<tr><td colspan=3>" + (Object.keys(D.grey).length - 40) + " smaller folders not shown</td></tr>" : "");
})();
</script>
</body>
</html>
