<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word moment lab: half and full</title>
<!-- CHAI-67 (Zafar, 2 Nov): the word moment, tried here before chai. A vessel held tilted pours tea into two glasses, half and full;
     a camera-shutter snap round each glass turns it into its word card in place, said as it lands. The shared piece is
     js/shared/word-moment.js; the art is placeholder (the s14 pan and glasses) until art block 1's vessel and pour (ART-36) land.
     The bar at the top holds the numbered choices (grown-ups only); ?snap=after&shutter=flash&cards=rise&at=end sets them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../css/shared/tokens.css?v=20261102T083741Z">
<link rel="stylesheet" href="../css/shared/word-card.css?v=20261102T083741Z">
<link rel="stylesheet" href="../css/shared/word-moment.css?v=20261102T083741Z">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--njg-page); color: var(--njg-ink); font: 700 15px/1.3 var(--njg-font-body); overflow: hidden; display: flex; flex-direction: column; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; background: var(--njg-card); box-shadow: var(--njg-shadow); z-index: 9; }
  .bar label { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  .bar select, .bar button { font: inherit; min-height: 36px; border-radius: 8px; border: 1px solid var(--njg-edge); background: var(--njg-white); padding: 0 8px; }
  .bar button { background: var(--njg-gold); border: 0; cursor: pointer; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: var(--njg-page) center / cover no-repeat url("../assets/cook/bg/bg-cook-worktop-t-v1.webp"); overflow: hidden; }
  @media (max-height: 500px) { .bar { padding: 3px 8px; gap: 4px 10px; font-size: 13px; } .bar select, .bar button { min-height: 30px; } }
</style>
</head>
<body>
<div class="bar">
  <label>1. Snap <select id="snap"><option value="each">each glass after its pour</option><option value="after">both poured, then both snapped</option></select></label>
  <label>2. Shutter <select id="shutter"><option value="corners">gold corners, then the flash</option><option value="flash">the flash alone</option></select></label>
  <label>3. Cards <select id="cards"><option value="stay">stay where the glasses were</option><option value="rise">rise to the top, side by side</option></select></label>
  <label>4. Speed <select id="speed"><option value="1">a child's pace</option><option value="1.5">a bit quicker</option></select></label>
  <button id="go" type="button">Play again</button>
</div>
<div id="stage"></div>
<script src="../js/version.js?v=20261102T083741Z"></script>
<script src="../js/shared/sfx.js?v=20261102T083741Z"></script>
<script src="../js/shared/word-card.js?v=20261102T083741Z"></script>
<script src="../js/shared/word-moment.js?v=20261102T083741Z"></script>
<script>
  const q = new URLSearchParams(location.search);
  const G = "../assets/cook/items-s14/glass/";
  const fr = (k) => Array.from({ length: k }, (_, i) => `${G}glass-fill-milky-${i + 1}-s14.webp`);
  // (the family's own clips: Mum's adh; aako is Zafar's take until Mum's is redone, data/family-audio.json)
  const clip = (src) => () => new Promise((res) => { const a = new Audio(src); a.onended = a.onerror = res; a.play().catch(res); });
  const glasses = [
    { empty: `${G}glass-empty-top-s14.webp`, frames: fr(4), word: { id: "adh", kutchi: "adh", english: "half" }, say: clip("../assets/audio/family/mum/adh-rc.mp3") },
    { empty: `${G}glass-empty-top-s14.webp`, frames: fr(6), word: { id: "aako", kutchi: "aako", english: "full" }, say: clip("../assets/audio/family/zafar/aako-rc.mp3") },
  ];
  const vessel = { src: "../assets/cook/items-s14/chai-pan/pan-boil-milky-s14.webp", spout: [0.03, 0.37], aspect: 514 / 405, tilt: -28 };
  ["snap", "shutter", "cards", "speed"].forEach((k) => { if (q.get(k)) document.getElementById(k).value = q.get(k); });
  const stage = document.getElementById("stage");
  const go = (instant) => {
    const v = (k) => document.getElementById(k).value;
    window.lastMoment = WordMoment.play(stage, { vessel, glasses, snap: v("snap"), shutter: v("shutter"), cards: v("cards"), speed: +v("speed"), instant });
  };
  document.getElementById("go").addEventListener("click", () => { if (window.Sfx && Sfx.unlock) Sfx.unlock(); go(false); });
  let t = 0;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => go(true), 200); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => go(q.get("at") === "end"));
</script>
</body>
</html>
