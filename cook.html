<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3e7d3">
<title>Cook with Nani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/cook.css?v=20260925T222503Z">
</head>
<body>

<div id="rotate">
  <div class="rotate-card"><div class="rotate-icon">&#8635;</div><p>Turn your phone sideways to cook with Nani</p></div>
</div>

<div id="app">
  <main id="stage">
    <div id="game"></div>

    <!-- a speech bubble beside a character (service view) -->
    <div id="bubble" class="hidden" role="status" aria-live="polite"><div class="say-slot"></div></div>

    <div id="gist" class="hidden"></div>
    <div id="choices" class="hidden"></div>
    <div id="count-badge" class="hidden"><span class="count-digit"></span></div>
    <button id="done-btn" class="hidden" aria-label="Done">&#10003;</button>
    <div id="toast" class="hidden"></div>

    <!-- the intro order card: when someone orders it comes up big in the middle (nothing is live yet), then flies into the sidebar -->
    <div id="intro" class="hidden" role="dialog" aria-label="The order">
      <div class="ic-card">
        <div class="ic-head"><img class="ic-face" alt=""><div class="ic-name"></div><button class="ic-say" type="button" aria-label="Hear it again"></button></div>
        <div class="ic-order"></div>
        <div class="ic-go">Tap to start</div>
      </div>
    </div>

  </main>

  <aside id="side">
    <!-- 1. the order card, always on top: compact; ↻ opens it big again (the intro card). It becomes the completion card when the order is served -->
    <div id="mission" class="card hidden">
      <div class="m-head">
        <div class="m-ring" aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle class="pr-bg" cx="24" cy="24" r="22"/><circle class="pr-fg" cx="24" cy="24" r="22" pathLength="100"/></svg>
          <img class="m-face" alt="">
        </div>
        <!-- the dish ("Muke chai khape."), then the three stars; who it is shows in the face -->
        <div class="m-who"><div class="m-dish"></div><div class="m-stars"></div></div>
        <div class="m-tools">
          <button class="m-replay" type="button" aria-label="Hear the order again" title="Hear the order again"></button>
          <button class="m-tr" type="button" aria-label="Show in English" title="Show in English"></button>
        </div>
      </div>
      <div class="m-order"></div>
      <div class="m-stamp">Served!</div>
    </div>
    <!-- 2. Nani's current line: one short line; at the stations she talks from here, so her words never cover a thing to tap -->
    <div id="live">
      <div id="nani-card" class="card hidden" role="status" aria-live="polite">
        <img class="nc-face" src="assets/cook/characters/nani-badge.webp?v=20260925T222503Z" alt="Nani">
        <div class="say-slot"></div>
      </div>
    </div>
    <!-- 3. the rail: "?" (what do I do here?), menu, recipe book -->
    <div class="side-rail">
      <button id="btn-help" class="rail-btn" title="What do I do here?" aria-label="What do I do here?" aria-expanded="false">?</button>
      <button id="btn-home" class="rail-btn" title="Menu" aria-label="Menu">&#8962;</button>
      <button id="btn-book" class="rail-btn" title="Nani's recipe book" aria-label="Nani's recipe book">&#128214;</button>
    </div>
  </aside>

  <!-- the "?" pops out the goal for this station (never shown on its own) -->
  <div id="help-pop" class="hidden" role="dialog" aria-label="What do I do here?"><div class="hp-text"></div></div>

  <!-- Nani: "pass me…". Her card comes forward in the sidebar column, never over the play area -->
  <div id="passme" class="hidden" role="dialog" aria-label="Nani needs something">
    <div class="pm-nani"><img src="assets/cook/characters/nani-badge.webp?v=20260925T222503Z" alt="Nani"><div class="pm-say"></div></div>
    <div class="pm-tray"></div>
  </div>
</div>

<div id="overlay" class="hidden"><div id="panel"></div></div>

<script src="js/vendor/phaser.min.js?v=20260925T222503Z"></script>
<script src="js/version.js?v=20260925T222503Z"></script>
<script src="js/cook/core.js?v=20260925T222503Z"></script>
<script src="js/cook/lang.js?v=20260925T222503Z"></script>
<script src="js/cook/art.js?v=20260925T222503Z"></script>
<script src="js/cook/ui.js?v=20260925T222503Z"></script>
<script src="js/cook/stations.js?v=20260925T222503Z"></script>
<script src="js/cook/station-lib.js?v=20260925T222503Z"></script>
<script src="js/cook/zone.js?v=20260925T222503Z"></script>
<!-- mechanics: one verb per file (the order here is the Station lab's order) -->
<script src="js/cook/mechanics/fetch.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/passme.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/pour.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/add.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/boil.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/count.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/knead.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/roll.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/tawa.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/chop.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/tadka.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/stir.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/assemble.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/fill-fold.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/fry.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/thread.js?v=20260925T222503Z"></script>
<script src="js/cook/mechanics/grill.js?v=20260925T222503Z"></script>
<!-- combined stations: one file each (the next wave fills the three stubs) -->
<script src="js/cook/stations/roll-tawa.js?v=20260925T222503Z"></script>
<script src="js/cook/stations/maani-line.js?v=20260925T222503Z"></script>
<script src="js/cook/stations/chai-tray.js?v=20260925T222503Z"></script>
<script src="js/cook/stations/mishkaki-grill.js?v=20260925T222503Z"></script>
<script src="js/cook/recipes.js?v=20260925T222503Z"></script>
<script src="js/cook/order.js?v=20260925T222503Z"></script>
<script src="js/cook/flow.js?v=20260925T222503Z"></script>
</body>
</html>
