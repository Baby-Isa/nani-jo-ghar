<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3e7d3">
<title>Cook with Nani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/cook.css">
</head>
<body>

<div id="rotate">
  <div class="rotate-card"><div class="rotate-icon">&#8635;</div><p>Turn your phone sideways to cook with Nani</p></div>
</div>

<div id="app">
  <main id="stage">
    <div id="game"></div>

    <!-- a speech bubble beside a character (service view) -->
    <div id="bubble" class="hidden" role="status" aria-live="polite"><div class="say-slot"></div></div>

    <div id="gist" class="hidden"></div>
    <div id="choices" class="hidden"></div>
    <div id="count-badge" class="hidden"><span class="count-digit"></span></div>
    <button id="done-btn" class="hidden" aria-label="Done">&#10003;</button>
    <div id="toast" class="hidden"></div>

    <!-- Nani: "pass me…" (slides in from the edge mid-cook) -->
    <div id="passme" class="hidden" role="dialog" aria-label="Nani needs something">
      <div class="pm-nani"><img src="assets/cook/characters/nani-badge.webp" alt="Nani"><div class="pm-say"></div></div>
      <div class="pm-tray"></div>
    </div>
  </main>

  <aside id="side">
    <div class="side-top">
      <span class="pill coins" title="Pocket money"><i class="coin-dot"></i><b id="coins">0</b></span>
      <span class="pill stars" title="Stars today">&#9733; <b id="stars">0</b></span>
    </div>
    <!-- At the stations Nani talks from here, so her words never cover a thing to tap -->
    <div id="nani-card" class="card hidden" role="status" aria-live="polite">
      <img class="nc-face" src="assets/cook/characters/nani-badge.webp" alt="Nani">
      <div class="say-slot"></div>
    </div>
    <div id="how" class="hidden"></div>
    <!-- the mission card: becomes the completion card when the order is served -->
    <div id="mission" class="card hidden">
      <div class="m-head">
        <img class="m-face" alt="">
        <div class="m-who"><div class="m-name"></div><div id="patience" class="hidden"><i></i></div></div>
      </div>
      <div class="m-stars"></div>
      <ul class="m-order"></ul>
      <div class="m-steps"></div>
      <div class="m-stamp">Served!</div>
    </div>
    <div class="side-rail">
      <button id="btn-home" class="rail-btn" title="Menu">&#8962;</button>
      <button id="btn-book" class="rail-btn" title="Nani's recipe book">&#128214;</button>
    </div>
  </aside>
</div>

<div id="overlay" class="hidden"><div id="panel"></div></div>

<script src="js/vendor/phaser.min.js"></script>
<script src="js/cook/core.js"></script>
<script src="js/cook/lang.js"></script>
<script src="js/cook/art.js"></script>
<script src="js/cook/ui.js"></script>
<script src="js/cook/stations.js"></script>
<script src="js/cook/station-lib.js"></script>
<script src="js/cook/zone.js"></script>
<!-- mechanics: one verb per file (the order here is the Station lab's order) -->
<script src="js/cook/mechanics/fetch.js"></script>
<script src="js/cook/mechanics/passme.js"></script>
<script src="js/cook/mechanics/pour.js"></script>
<script src="js/cook/mechanics/add.js"></script>
<script src="js/cook/mechanics/boil.js"></script>
<script src="js/cook/mechanics/count.js"></script>
<script src="js/cook/mechanics/knead.js"></script>
<script src="js/cook/mechanics/roll.js"></script>
<script src="js/cook/mechanics/tawa.js"></script>
<script src="js/cook/mechanics/chop.js"></script>
<script src="js/cook/mechanics/tadka.js"></script>
<script src="js/cook/mechanics/stir.js"></script>
<script src="js/cook/mechanics/assemble.js"></script>
<script src="js/cook/mechanics/fill-fold.js"></script>
<script src="js/cook/mechanics/fry.js"></script>
<script src="js/cook/mechanics/thread.js"></script>
<script src="js/cook/mechanics/grill.js"></script>
<!-- combined stations: one file each (the next wave fills the three stubs) -->
<script src="js/cook/stations/roll-tawa.js"></script>
<script src="js/cook/stations/maani-line.js"></script>
<script src="js/cook/stations/chai-tray.js"></script>
<script src="js/cook/stations/mishkaki-grill.js"></script>
<script src="js/cook/recipes.js"></script>
<script src="js/cook/flow.js"></script>
</body>
</html>
