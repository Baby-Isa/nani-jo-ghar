<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3e7d3">
<title>Cook with Nani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/cook.css">
</head>
<body>

<div id="rotate">
  <div class="rotate-card"><div class="rotate-icon">&#8635;</div><p>Turn your phone sideways to cook with Nani</p></div>
</div>

<div id="app">
  <main id="stage">
    <div id="game"></div>

    <!-- Nani's head badge: shown at the stations, where Nani herself isn't in the picture -->
    <div id="nani-badge" class="hidden"><img src="assets/cook/characters/nani-badge.webp" alt="Nani"></div>

    <div id="bubble" class="hidden" role="status" aria-live="polite">
      <div class="bubble-kutchi"></div>
      <div class="bubble-english hidden"></div>
      <div class="bubble-foot">
        <button class="bubble-play hidden" aria-label="Hear it again">&#9654;</button>
        <span class="bubble-rec hidden" title="Needs a family recording">needs recording</span>
        <button class="bubble-en" aria-label="Show English">EN</button>
      </div>
    </div>

    <div id="gist" class="hidden"></div>
    <div id="choices" class="hidden"></div>
    <div id="count-badge" class="hidden"><span class="count-digit"></span><span class="count-word"></span></div>
    <button id="done-btn" class="hidden" aria-label="Done">&#10003;</button>
    <div id="toast" class="hidden"></div>
  </main>

  <aside id="side">
    <div class="side-top">
      <span class="pill coins" title="Coins"><i class="coin-dot"></i><b id="coins">0</b></span>
      <span class="pill stars" title="Stars today">&#9733; <b id="stars">0</b></span>
    </div>
    <div id="ticket" class="card hidden">
      <div class="ticket-head">
        <img id="ticket-face" alt="">
        <div>
          <div id="ticket-name"></div>
          <div id="patience" class="hidden"><i></i></div>
        </div>
      </div>
      <ul id="ticket-list"></ul>
      <button id="ticket-en" class="mini">EN</button>
    </div>
    <div id="recipe" class="card hidden">
      <div class="recipe-title"><span id="recipe-name"></span><small id="recipe-stage"></small></div>
      <div id="recipe-dots"></div>
    </div>
    <div class="side-rail">
      <button id="btn-home" class="rail-btn" title="Menu">&#8962;</button>
      <button id="btn-book" class="rail-btn" title="Nani's recipe book">&#128214;</button>
    </div>
  </aside>
</div>

<div id="overlay" class="hidden"><div id="panel"></div></div>

<script src="js/vendor/phaser.min.js"></script>
<script src="js/cook/core.js"></script>
<script src="js/cook/ui.js"></script>
<script src="js/cook/stations.js"></script>
<script src="js/cook/recipes.js"></script>
<script src="js/cook/flow.js"></script>
</body>
</html>
