<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3e7d3">
<title>Find it with Nani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/cook.css?v=20260926T094632Z">
<link rel="stylesheet" href="css/find.css?v=20260926T094632Z">
</head>
<body class="find">

<div id="rotate">
  <div class="rotate-card"><div class="rotate-icon">&#8635;</div><p>Turn your phone sideways to play Find it</p></div>
</div>

<div id="app">
  <main id="stage">
    <!-- the scene: a 1600x900 world of plain HTML (js/find/view.js), panned and zoomed -->
    <div id="letterbox" aria-hidden="true"></div>
    <div id="game"><div id="world"></div></div>

    <!-- shared with Cook (js/cook/ui.js); Find it only uses them before and after a search -->
    <div id="bubble" class="hidden" role="status" aria-live="polite"><div class="say-slot"></div></div>
    <div id="gist" class="hidden"></div>
    <div id="choices" class="hidden"></div>
    <div id="count-badge" class="hidden"><span class="count-digit"></span></div>
    <button id="done-btn" class="hidden" aria-label="Done">&#10003;</button>
    <div id="toast" class="hidden"></div>

    <!-- the intro card (shared with Cook): Nani's list comes up big in the middle while she says it
         (nothing is live yet), then flies into the sidebar -->
    <div id="intro" class="hidden" role="dialog" aria-label="Nani's list">
      <div class="ic-card">
        <div class="ic-head"><img class="ic-face" alt=""><div class="ic-name"></div><button class="ic-say" type="button" aria-label="Hear it again"></button></div>
        <div class="ic-order"></div>
        <div class="ic-go">Tap to start</div>
      </div>
    </div>
  </main>

  <aside id="side">
    <!-- 1. the list (the order card, js/cook/ui.js): one row and one dot per thing, never pictures.
         ↻ opens it big again; A/En is English (the answer: costs the ear star) -->
    <div id="mission" class="card hidden">
      <div class="m-head">
        <div class="m-ring" aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle class="pr-bg" cx="24" cy="24" r="22"/><circle class="pr-fg" cx="24" cy="24" r="22" pathLength="100"/></svg>
          <img class="m-face" alt="">
        </div>
        <div class="m-who"><div class="m-dish"></div><div class="m-stars"></div></div>
        <div class="m-tools">
          <button class="m-replay" type="button" aria-label="Hear the list again" title="Hear the list again"></button>
          <button class="m-tr" type="button" aria-label="Show in English" title="Show in English"></button>
        </div>
      </div>
      <div class="m-order"></div>
      <div class="m-stamp">Done!</div>
    </div>
    <!-- 2. Nani's (or the shopkeeper's) current line: one short line, never over the stall -->
    <div id="live">
      <div id="nani-card" class="card hidden" role="status" aria-live="polite">
        <img class="nc-face" src="assets/cook/characters/nani-badge.webp?v=20260926T094632Z" alt="Nani">
        <div class="say-slot"></div>
      </div>
    </div>
    <!-- 3. Done (hand the basket over), then the rail: "?", menu, zoom, "where?".
         Pinned to the bottom of the sidebar, so zoom is always in reach on a phone -->
    <div class="find-foot">
      <button id="find-done" class="btn primary hidden" type="button">Done &#10003;</button>
      <div class="side-rail">
        <button id="btn-help" class="rail-btn" title="What do I do here?" aria-label="What do I do here?" aria-expanded="false">?</button>
        <button id="btn-home" class="rail-btn" title="Menu" aria-label="Menu">&#8962;</button>
        <button id="btn-zoom-in" class="rail-btn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="btn-zoom-out" class="rail-btn" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="btn-warmer" class="rail-btn hidden" title="Nani, where should I look? (costs the no-help star)" aria-label="Where should I look?"></button>
      </div>
    </div>
  </aside>

  <!-- the "?" pops out the goal (never shown on its own) -->
  <div id="help-pop" class="hidden" role="dialog" aria-label="What do I do here?"><div class="hp-text"></div></div>

  <div id="passme" class="hidden" role="dialog" aria-label="Nani needs something">
    <div class="pm-nani"><img src="assets/cook/characters/nani-badge.webp?v=20260926T094632Z" alt="Nani"><div class="pm-say"></div></div>
    <div class="pm-tray"></div>
  </div>
</div>

<div id="overlay" class="hidden"><div id="panel"></div></div>

<script src="js/version.js?v=20260926T094632Z"></script>
<!-- the shared layer (docs/shared-api.md): the recogniser, relations, which-one, stars, the speaking moment -->
<script src="js/shared/speech.js?v=20260926T094632Z"></script>
<script src="js/shared/rel.js?v=20260926T094632Z"></script>
<script src="js/shared/whichone.js?v=20260926T094632Z"></script>
<script src="js/shared/stars.js?v=20260926T094632Z"></script>
<script src="js/shared/say.js?v=20260926T094632Z"></script>
<!-- shared with Cook with Nani: data, save, word progress, voice, word pills, the order ladder -->
<script src="js/cook/core.js?v=20260926T094632Z"></script>
<script src="js/cook/lang.js?v=20260926T094632Z"></script>
<script src="js/cook/ui.js?v=20260926T094632Z"></script>
<script src="js/cook/order.js?v=20260926T094632Z"></script>
<!-- Find it: the search engine, its mechanics, the non-speaker bot and the game's shape -->
<script src="js/find/engine.js?v=20260926T094632Z"></script>
<script src="js/find/gen.js?v=20260926T094632Z"></script>
<script src="js/find/view.js?v=20260926T094632Z"></script>
<script src="js/find/round.js?v=20260926T094632Z"></script>
<!-- one file per mechanic (docs/find-it-design.md D3), then the mini-games built from them -->
<script src="js/find/mechanics/spot.js?v=20260926T094632Z"></script>
<script src="js/find/mechanics/bag.js?v=20260926T094632Z"></script>
<script src="js/find/mechanics/greet.js?v=20260926T094632Z"></script>
<script src="js/find/mechanics/where.js?v=20260926T094632Z"></script>
<script src="js/find/mechanics/tell.js?v=20260926T094632Z"></script>
<script src="js/find/mechanics/bowl.js?v=20260926T094632Z"></script>
<script src="js/find/games/list.js?v=20260926T094632Z"></script>
<script src="js/find/games/whichone.js?v=20260926T094632Z"></script>
<script src="js/find/games/where.js?v=20260926T094632Z"></script>
<script src="js/find/games/ali.js?v=20260926T094632Z"></script>
<script src="js/find/bot.js?v=20260926T094632Z"></script>
<script src="js/find/flow.js?v=20260926T094632Z"></script>
</body>
</html>
