# The run spec for pack s08c: Sprint 8's fix run (20 Oct). The fix list's open art rows, the judges' FAIL lines of run
# ev-20261019-172022-khk, the builders' art lists (s08 w6B, w6C) and contract-11. Part A Cook, part B the clinic's objects,
# part C the doctor and the girl (real people: Zafar judges likeness after the run), part D Nana, Ma and Ali's frames and the
# waiting room. Every part boundary is a safe stop. Zafar runs it in Claude in Chrome on his ChatGPT allowance; delivery
# "download" (kept images stay in their chats until the end). The runner may not upload files: Zafar uploads every reference
# to one ChatGPT chat first (refs_chat) and the runner attaches them from ChatGPT's library. Read by artblock.py and
# artjudge.py. The prompts are in the plan (section 5: docs/design-language/art-plans/s08c-art-plan.md). Edit this file,
# then regenerate the block; never hand-edit the block.
