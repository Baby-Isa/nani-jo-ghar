parts:
- id: A
  title: 'COOK: THE KADCHI, THE DAAL, THE CHAI, SEKELO, THE MARBLE'
  intro: 'Objects only, no people. Each line attaches the picture it replaces or matches, plus the style anchor; match their look, never their mistakes (the line says which).'
  items:
  - lines: [KD1, DS1, TP1, GL1, CP3, CP4, SK4, SK5, WT1]
- id: B
  title: 'THE CLINIC: THE CRUTCHES AND THE CUP'
  intro: 'Objects only, no people. Each line attaches the plaster packet as the look to match: real-looking materials and fine surface detail.'
  items:
  - lines: [CR1, TC1]
- id: C
  title: 'THE DOCTOR AND THE GIRL (REAL PEOPLE: ZAFAR JUDGES LIKENESS LATER)'
  intro: 'DW2 redraws the doctor turned from his face-on base; DT2 and DB2 are edits of the kept DW2. GZ1 and GZ2 draw the girl from her sheet and the lineup; GZ3 and GZ4 are edits of the kept GZ2. Keep the first image that passes; do not wait for Zafar.'
  items:
  - lines: [DW2, DT2, DB2, GZ1, GZ2, GZ3, GZ4]
- id: D
  title: 'THE FAMILY''S FRAMES AND THE WAITING ROOM'
  intro: 'Nana, Ma and Ali are not real people. NN1 to AL3 are edits of their sheets (attach that one image only; only the named face changes). WR1 to WR3 redraw three waiting-room patients in the style of the attached old man and old woman.'
  items:
  - lines: [NN1, NN2, MA1, MA2, AL1, AL2, AL3, WR1, WR2, WR3]
checks:
  KADCHI:
    text: 'two views of the SAME steel kadchi from directly above: a deep round bowl with a short, foreshortened handle rising towards the camera and leaning right (never a flat handle lying level, never a measuring scoop); left clean, right its bowl full of smooth yellow daal; the same size and angle; nothing touches the middle or an edge; flat mid-grey'
    judge: {aspect: [3, 2], bg: flat, pieces: 2, no_touch: true}
  PIECES8:
    text: 'eight scatters in a 4 by 2 grid in the order asked (onion, tomato, green chilli, potato; garlic, ginger, cumin, mustard seeds), every piece cooked, soft, matte and coated in yellow daal: no white chunks, no fresh shiny pieces, no beads; nothing crosses a cell boundary; flat mid-grey'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 8, no_touch: true, sweets: true}
  SPOON3:
    text: 'the same teaspoon three times from directly above, bowl left, handle right, the same size and height: empty, heaped with white sugar, a little milky chai in its bowl; nothing touches another or an edge; flat mid-grey'
    judge: {aspect: [3, 2], bg: flat, pieces: 3, no_touch: true}
  GLASS3:
    text: 'the same small clear glass three times from EXACTLY above (the rim a perfect circle, the walls equally thick all round, the floor centred), the same size and place in each third: empty, milky chai, black tea (clear dark reddish amber); no side view; nothing touches a boundary; flat mid-grey'
    judge: {aspect: [3, 2], bg: flat, pieces: 3, no_touch: true}
  TIP6:
    text: 'the same steel pan six times in a 3 by 2 grid, from directly above, the handle to the right in every cell: flat, then tipped TOWARDS THE VIEWER (the bottom of the image) at 20, 40 and 60 degrees, the rim a flatter ellipse each time and more of the outside wall showing above it, the chai sliding to the near rim; cell 5 pours milky chai from the near rim straight down, cell 6 black tea; never tipped sideways towards the left lip; nothing crosses a cell boundary'
    judge: {aspect: [3, 2], bg: flat, pieces: 6, no_touch: true}
  PAN3:
    text: 'three times the SAME steel pan from EXACTLY straight above, same size and place in each third, handle to the right: water coming to the boil with real bubbles at the edge, dark amber tea with loose leaves, milky chai with a ring of fine foam; real liquid, never flat colour or drawn rings; the rim a perfect circle; nothing touches a boundary'
    judge: {aspect: [3, 2], bg: flat, pieces: 3, no_touch: true}
  TRAY1:
    text: 'ONE square matte brushed-steel tray from directly above, less shiny than the grill, in the upper part of the image; FOUR bare skewers standing upright, straight and parallel, evenly spread at one to four fifths of its width, tips near the top wall, wooden handles running past the tray''s bottom edge into the grey; no food; touches no edge; flat mid-grey'
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  SHEET12:
    text: 'twelve things in a 4 by 3 grid; each row one food (chicken, green chilli, corn on the cob): a raw heap, then one chunk raw, grilled, charred, each the size of the attached chunks; the chilli a tube, never a flat pepper square; corn kernels matte, never beads or sweets; nothing crosses a cell boundary; flat mid-grey'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 12, no_touch: true, sweets: true}
  TILE2:
    text: 'pale cream marble with warm amber-gold veins filling the whole image, evenly lit (no sunbeams, streaks, vignette or bright corners); the left edge continues the right edge and the top edge continues the bottom edge with no visible seam; nothing on it'
    judge: {aspect: [3, 2], bg: none}
  FLAT1:
    text: 'one pair of crutches lying FLAT and level on an implied surface, seen from the front and about 20 degrees above, pads at the left, feet at the right, every part down (nothing raised, tilted or floating); about 80% wide; no surface, no shadow; touches no edge; flat mid-grey'
    judge: {aspect: [3, 2], bg: flat, pieces: 1, no_touch: true}
  CUP1:
    text: 'one empty brushed-steel tumbler standing upright and level on its base, seen from the front and a little above so the inside and its floor show; NO shadow of any kind; about 50% wide; touches no edge; flat mid-grey'
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  DTURN:
    text: 'the doctor standing, full body, turned a TRUE three-quarter (about 45 degrees) to the viewer''s LEFT, chest and feet pointing lower left, head with his body, looking left and a little down; clearly more turned than the attached slight turn; the same size, feet line and head height as the face-on base; drawn, not flipped: the watch on his LEFT wrist; arms relaxed, nothing in his hands, neutral kind face, mouth closed; LIKENESS: the same man as the approved sheet and the lineup; the simplified clothes (plain navy blazer with a faint check, white open shirt, charcoal trousers, brown belt and shoes, silver watch; no bag, no stethoscope); stylised smooth hands, five fingers on each; SKIN within ΔE 6 of the sheet swatch #C88A6F; touches no edge, no floor, one flat mid-grey; Zafar judges likeness later'
    judge: {aspect: [2, 3], bg: flat, no_touch: true, skin_face: [0.25, 0.0, 0.75, 0.2], skin: '#C88A6F'}
  DEDIT:
    text: 'only the face changed (the mouth or the eyes, as asked); glasses, beard, hands, clothes, size and position identical; compare with the base it edits; SKIN unchanged from the base; LIKENESS unchanged (the same man)'
    judge: {aspect: [2, 3], bg: flat, no_touch: true, edit: {allowed: [0.25, 0.0, 0.75, 0.25]}, skin_face: [0.25, 0.0, 0.75, 0.2], skin: '#C88A6F'}
  GMOUTH:
    text: 'the girl from her sheet and the lineup, head and shoulders, front-on, face centred at about 55% of the height; mouth wide open "aah" showing clean white top and bottom teeth and her tongue (like the attached mouth close-up), eyes open and calm; her yellow dress and plaits with white bows; the soft out-of-focus clinic behind her; LIKENESS: the same girl as the sheet and the lineup; SKIN within ΔE 6 of #DA956C; Zafar judges likeness later'
    judge: {aspect: [3, 2], bg: none}
  GEYES:
    text: 'the girl''s face front-on from chin to above the top of her head, brows, forehead, fringe and hairline all in view, eyes wide open and calm (together about 40% of the width), mouth closed in a small smile; less close than the attached eye close-up; the soft out-of-focus clinic behind her; LIKENESS: the same girl as the sheet and the lineup; SKIN within ΔE 6 of #DA956C; Zafar judges likeness later'
    judge: {aspect: [3, 2], bg: none}
  GEDIT:
    text: 'only her eyes changed, as asked (her left eye on the viewer''s right a little sore, pink and watery but fully OPEN; or both eyes gently closed); face, hair, size and position identical; compare with the base it edits; never a wink'
    judge: {aspect: [3, 2], bg: none, edit: {allowed: [0.2, 0.15, 0.8, 0.6]}}
  FEDIT:
    text: 'the same sheet as the attached with ONLY the named person''s face changed (the mouth a little open with the teeth just showing, or both eyes gently closed); every other panel, figure, colour and position identical; compare with the attached'
    judge: {aspect: [3, 2], bg: none, edit: {allowed: [0.7, 0.0, 1.0, 0.35]}}
  IMPATIENT:
    text: 'the same picture as the attached with only the boy''s face changed: brows down and together, mouth a small flat line to one side, eyes glancing aside; impatient, NOT smiling or smirking; arms, pose, clothes and position identical'
    judge: {aspect: [3, 2], bg: none, edit: {allowed: [0.35, 0.0, 0.65, 0.25]}}
  SEATED:
    text: 'the person the line names, seated front-on on an invisible bench, full figure, hands on knees, feet flat, calm small smile; in the style, proportions and scale of the attached old man and old woman (a normal-sized head, never the big clay head of the first picture); the clothes and colours the line names, modest, arms and legs covered; no bench, floor or shadow; about 80% of the height; touches no edge; flat mid-grey'
    judge: {aspect: [2, 3], bg: flat, pieces: 1, no_touch: true}
passfail:
- Any text, letters, numbers, labels or logos, even fake or blurry ones.
- Outlines, cel shading, a flat vector look or painterly brushwork; blur, a vignette or lens flare (the soft clinic background behind the girl in GZ1 to GZ4 excepted).
- The background isn't one flat mid-grey (WT1 and GZ1 to GZ4 excepted); a floor, a surface or a shadow on the grey; grid lines, panel borders or labels.
- Things touching or crossing into a neighbour's cell, or touching an image edge (WT1 and GZ1 to GZ4 excepted).
- The wrong number of things, things in the wrong order, the wrong view, or extra objects, people, hands or animals.
- A top-down line not EXACTLY from above (an ellipse instead of a circle, one wall thicker than the other), except CP3's tipped cells, which are meant to flatten.
- An edit where anything other than what the prompt names has moved, changed size or changed colour, or that looks identical to the attached.
- 'Anything that looks like sweets, lollies, biscuits or gumballs: seeds, kernels or drops as glossy beads.'
- Immodest clothing; anything scary or gross; any religious marker.
