parts:
- id: A
  title: 'THE ANCHOR: CHAI''S SHELF, ONE SHEET'
  intro: 'The eight things on chai''s shelf, one batch: the water bottle, the milk carton, the tea and sugar jars and the four small spice jars, one camera, one light, one pale oak lid family. Every later side-on sheet attaches the kept FA01.'
  stop: 'Part A done: post FA01''s chat link in the log and carry straight on with part B (no waiting: Zafar, 6 Nov, the run is unsupervised).'
  items:
  - lines: [FA01]
- id: B
  title: 'THE LIVE STOVE GAMES (CHAI, DAAR, MAANI, CHAAT, SAMOSA, SEKELO)'
  intro: 'The shelf sheets copy FA01; the top-down sheets copy TB01 (the first top-down sheet). Send TB01 as soon as a window is free: it unblocks every other top-down sheet.'
  items:
  - lines: [FJ01, FK01, FJ02, FJ03, FJ04, FJ05, FJ06, FJ07, FJ08, FP01, FV01, FV02, TB01, TB02, TB03, TF01, TF02, TF03, TF04, TF05, TD01, TD02, TK01, TK02, TK03]
- id: C
  title: 'THE PROTOTYPES (EGGS AT BREAKFAST, BAKING, THE CORN STALL, THE CAKE)'
  intro: 'The same two anchors.'
  items:
  - lines: [FP02, FV03, TB04, TB05, TF06, TF07, TD03, TD04, TK04, TK05]
- id: D
  title: 'THE BANK (DISHES THE FAMILY COOKS THAT NO GAME HAS YET)'
  intro: 'The same two anchors. Lowest priority: if the run must stop, stop here.'
  items:
  - lines: [FJ09, FV04, TF08, TF09, TD05, TD06]
checks:
  ANCHOR:
    text: 'eight separate items in a 4 by 2 grid, in the order listed, each standing upright, exactly side-on at its own mid-height (a hint of each lid''s top, no more), every one the SAME drawn height (about 85% of its cell''s height); all four small jars and both tall jars share ONE pale oak screw lid (the attached jars'' lid: same wood, same profile, only the diameter changes); matte clear glass with one soft highlight, no hard white stripes; warm light from the upper left on every item; nothing under or behind them (no shelf, no shadow, no reflection), on one flat grey ground; salt reads as salt crystals, not pearls or tapioca'
    judge: {aspect: [3, 2], bg: flat, soft_edges: true, pieces: 8}
  SHELF:
    text: 'the sheet''s items in a 4 by 2 grid in the order listed, each upright, exactly side-on like the attached FA01, every one the SAME drawn height (about 85% of its cell; a wide thing fills 85% of the cell''s width instead); every glass jar has FA01''s pale oak lid; the same glass, light (upper left) and finish as FA01, as if from the same photo shoot; no labels; nothing under them, no shadow, one flat grey ground'
    judge: {aspect: [3, 2], bg: flat, soft_edges: true, pieces_min: 4}
  PRODUCE:
    text: 'the sheet''s produce in a 4 by 2 grid in the order listed, each standing on its own base, exactly side-on like the attached FA01, every one the SAME drawn height (about 85% of its cell); true food colours; the same light (upper left) and finish as FA01; nothing under them, no shadow, one flat magenta ground'
    judge: {aspect: [3, 2], bg: none, sweets: true}
  KATORI:
    text: 'the sheet''s items in a 3 by 3 grid in the order listed, seen from DIRECTLY above (rims perfect circles, no side wall showing), each plain brushed-steel katori or bowl the same size, its heap filling it; the style of the attached kitchen picture; light from the upper left; no shadow, one flat grey ground'
    judge: {aspect: [1, 1], bg: flat, pieces_min: 4}
  KIT:
    text: 'the sheet''s vessels and tools in a 3 by 3 grid in the order listed, seen from DIRECTLY above (round things perfect circles), each filling about 85% of its cell (a long tool lies diagonally corner to corner), empty and clean, the materials and light of the attached TB01; no shadow, one flat grey ground'
    judge: {aspect: [1, 1], bg: flat, pieces_min: 4}
  DISH:
    text: 'the sheet''s dishes in a 3 by 3 grid in the order listed, each served exactly as its line describes it (its vessel, its colours and the garnish that names it: a plain white plate, a plain steel plate, platter or bowl, or the glass, cup or cake stand the line names), seen from DIRECTLY above (rims perfect circles), each filling about 85% of its cell, appetising and clearly that dish (the four chais told apart by vessel, tea colour and garnish); the light and finish of the attached TB01; no cutlery unless named; no shadow, one flat grey ground'
    judge: {aspect: [1, 1], bg: flat, pieces_min: 4, sweets: true}
  FOOD:
    text: 'the sheet''s food in a 3 by 3 grid in the order listed, each seen from DIRECTLY above, loose (no board, no plate unless named), each filling about 70% of its cell, the heap look of the attached heaps; true food colours; light from the upper left; no shadow, one flat magenta ground'
    judge: {aspect: [1, 1], bg: none, sweets: true}
passfail:
- Any text, letters, numbers, labels, logos or price stickers, even fake ones, on any jar, tin, bottle, carton or pack.
- Outlines, cel shading, a flat vector look or painterly brushwork.
- Items at different heights on a side-on sheet (the token sizes are the game's job), or a camera that differs between cells (one from above, one side-on).
- On a side-on sheet, any glass jar whose lid is not the pale oak lid of FA01; hard white specular stripes down the glass; a rim light or a halo round the edge.
- A shadow, a reflection, a floor, a shelf or a table under any item; anything crossing into the next cell; two items merged.
- A cell holding the wrong item, an item missing or drawn twice, or the order changed.
- Pork, ham, bacon or anything that reads as it; wine, beer or any bottle that reads as alcohol.
- Sweets, lollies, biscuits or chocolates (mithai only on the one celebration platter, cake only as the birthday cake); sprinkles.
- Any religious marker (a swastika, an om, a diya, a bindi, a tilak) on a pot, a box or a cloth.
