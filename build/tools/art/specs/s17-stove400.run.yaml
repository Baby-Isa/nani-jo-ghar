# The run spec for pack s17-stove400: the stove family's shared item art (the chai shelf redo first, then every stove game's
# shelf items, station heaps, states, kit and dishes, then the banked future dishes), as sheets of items on one sheet.
# The list it draws from: docs/design-language/art-plans/stove-400-items.csv (the `sheet` column). The plan:
# docs/design-language/art-plans/s17-stove400-art-plan.md (section 2: the token size rule).
#   python3 build/tools/art/artblock.py --spec build/tools/art/specs/s17-stove400.run.yaml --check
#   python3 build/tools/art/artblock.py --spec build/tools/art/specs/s17-stove400.run.yaml
# Every sheet is one line; the two prompts (FS side-on, TS top-down) take the sheet's items as slots. A sheet's items are drawn
# all the same height: the game, not the picture, sets the token size steps (L 100 / M 92 / S 85 of the slot; plan section 2).
pack: s17-stove400
title: 'The stove family: one batch of shelf items, station heaps, kit and dishes (the chai shelf redo first)'
plan: docs/design-language/art-plans/s17-stove400-art-plan.md
plan_branch: ccr-1f71c98a-wwowh8
repo: Baby-Isa/nani-jo-ghar
raw_branch: ccr-1f71c98a-wwowh8
dest: sources/art/s17-stove400
real_people: false
# The house swatch strip on every new picture (artblock.py HOUSE LOOK); it and the plan are on the branch above (6 Nov).
house: {attach: true}
approvals: |-
  - Zafar: keep this laptop awake for the whole run (Mac: run `caffeinate -dims` in Terminal, charger in, lid open; Windows: PowerToys Awake on).
  - No people in this run: you judge every image with the checks below. Redo only for a failed check or a PASS/FAIL point.
  - No stops: the run is unsupervised (Zafar, 6 Nov: "not stop for my feedback, i want it to run unsupervised"). FA01 (part A) is the anchor every later shelf sheet copies (its jar, lid and light): judge it hardest against its checks, redo it until it passes, then carry on without waiting.
delivery: download
amend: true
runner: {windows: 3, send_gap_seconds: 60, stall_minutes: 6, hard_minutes: 10, redos: 2, commit_batch: 6, flush_minutes: 25}
