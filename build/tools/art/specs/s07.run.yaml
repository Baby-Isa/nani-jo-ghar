# The run spec for pack s07 (Sprint 7 art; Zafar, 15 Oct: the doctor from his own sheet, then the girl's morning complete,
# then the rest of the belt, then Cook). Part A the doctor (one base pose, two faces, six permutations, two door frames),
# part B the girl's set (life frames, sore face, neutral standing face, level-toed sole, the dirt, the knee bump, the
# drill view's tooth, boing's drop machine, the nine belt sheets her ailments ask for), part C the decoys sheet, part D
# Cook (the kitchen master, Nani's moods, the plate, the chai pan's tilt, the daar pieces, the potato). Read by
# build/tools/art/artblock.py (the paste block) and artjudge.py. The prompts stay in the plan (section 5:
# docs/design-language/art-plans/s07-art-plan.md). Edit this file, then regenerate the block; never hand-edit the block.
# Zafar runs it himself in ChatGPT (plan section 2). His doctor sheets are in sources/art/s07/ already (no DS1 line).
