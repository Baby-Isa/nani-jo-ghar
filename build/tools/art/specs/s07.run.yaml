    text: only the mouth changed, to closed and neutral with no smile; eyes and everything else identical to the attached standing picture (compare them)
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      no_touch: true
      edit:
        allowed:
        - 0.3
        - 0.1
        - 0.7
        - 0.3
  SOLE:
    text: the same sole as the attached picture (size, framing, the white trouser leg off the bottom), but the five toes in a LEVEL row, tips at about one height, clearly separate; smooth, no marks; touches the bottom edge only
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      exits:
      - bottom
      skin_obj: true
  DIRT:
    text: eight separate soft-edged bits of brown and grey-brown dirt in a 4 by 2 grid, in the order the prompt lists (patch, patch with grit, smear, scatter, big patch, streak, three specks, faint patch); matte and feathered, never hard-edged discs or flat blobs; no blood, no insects; no skin or surface drawn; nothing touches a cell boundary
    judge:
      soft_edges: true
      aspect:
      - 3
      - 2
      bg: flat
      pieces_min: 8
      no_touch: true
  BUMP:
    text: one soft rounded swelling on the kneecap with a mild pink-red blush, no cut, no blood, no purple or black · nothing else changed (compare with the attached knee)
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      - bottom
      edit:
        allowed:
        - 0.2
        - 0.2
        - 0.8
        - 0.8
      skin_obj: true
  TOOTH:
    text: 'ONE big upper front tooth straight on, centred, about 45% of the width, its two neighbours cut by the LEFT and RIGHT edges, the pink gum off the TOP edge; all clean white and healthy, no decay, spots or holes; nothing below the teeth but the flat grey; no tongue, lips, tools or hands; the same look as the attached mouth'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      - right
      - top
  DM1:
    text: a white and steel machine, four tall tubes of red, yellow, blue and green LIQUID (no balls or beads), a drip spout under each, a chute to one opening at the bottom, empty lever sockets, no levers · looks like a medicine dispenser, not a sweet, gumball or jelly-bean machine
    judge:
      soft_edges: true
      aspect:
      - 2
      - 3
      bg: flat
      pieces: 1
      no_touch: true
      sweets: true
  DM2:
    text: 'six things in a 3 by 2 grid: a lever UP, the same lever DOWN at the same size and place, then four falling teardrop drops (red, yellow, blue, green), matte and softly translucent, the same size and shape, never glossy balls, beads or sweets; nothing crosses a cell boundary'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 6
      no_touch: true
      sweets: true
      soft_edges: true
  SHEET8:
    text: 'eight cells in a 4 by 2 grid, in the order and at the angles the plan''s prompt lists (cell 1 the belt view: seen from the front and a little above, standing or lying LEVEL on its base, never tilted, never floating) · the same object, colours and materials as the attached reference in every cell · the colours asked are the whole object in one clean colour · "exactly side-on" and "from directly above" drawn so, not at an angle · lit from the upper left in every cell · nothing but the objects (no belt, no surface, no hands, skin or body parts) · nothing touches a cell boundary'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 8
      no_touch: true
  KMASTER:
    text: 'the same kitchen and camera as the attached picture, but wider and taller: the attached picture''s content sits in the middle-bottom (about the middle 76% of the width, the bottom 64% of the height), with ceiling and more wall above and more kitchen each side; the island''s back edge one straight line across the whole width at about 79% down, its oak front below it to the bottom edge; three empty walnut trays with their centres at about 29%, 50% and 71% across; ONE mixer tap, nothing loose beside it; NO plant on the floor through the arch; nobody; sharp to every edge, no blur'
    judge:
      aspect:
      - 3
      - 2
      bg: none
  NANI:
    text: 'Nani leaning: both forearms flat on a plain marble counter, elbows ON it, one over the other; the counter''s back edge one straight horizontal line across the whole image at about 82% down, marble below it, flat grey above; head a normal size for her body (the sheet''s proportions, never a big head); rendered as chunky and simplified as the attached Nana, not more photographic; glasses, red dupatta, cream embroidered kurta, bracelet and rings as the sheet, no bangles; nothing of her below the counter''s back edge but the arms on it; clear grey left and right of her'
    judge:
