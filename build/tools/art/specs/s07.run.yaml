  GSORE:
    text: only the face changed, to a comic wince with BOTH eyes open and a little narrowed (never one eye shut, which reads as a wink, CLN-136), a small tight mouth; no tears; everything else identical to the attached seated picture (compare them)
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      no_touch: true
      edit:
        allowed:
        - 0.3
        - 0.13
        - 0.7
