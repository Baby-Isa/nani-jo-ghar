    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      like: DW1
  DA3:
    text: the same doctor, size, framing and feet as DW1; only the near arm raised beside the shoulder, the index finger pointing straight UP; the other arm at his side; five fingers; touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      like: DW1
  DA4:
    text: the same doctor, size, framing and feet as DW1; BOTH arms raised high, open hands, palms to us, his laughing smile; both hands inside the image; five fingers on each; touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.98
      no_touch: true
      like: DW1
  DA5:
    text: the same doctor, size, framing and feet as DW1; only the near arm raised, the hand holding a small steel pen torch (OFF, no beam) at chest height, its tip to the viewer's left; the other arm at his side; five fingers; nothing else in his hands; touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      like: DW1
  DA6:
    text: 'the same doctor at the same size, feet on the same level as DW1, but turned three-quarters to the viewer''s RIGHT (the mirror of DW1''s turn, drawn, not flipped: the watch stays on his LEFT wrist); the near arm up in a wave, palm to us; a big warm smile; five fingers; touches no edge'
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
  DD1:
    text: the doctor's head, shoulders and one raised beckoning hand leaning in from the RIGHT edge only; NO door, frame or wall drawn; a big open calling smile; the head about 40% of the height, a little left of centre; as his sheet in every feature; five fingers
    judge:
      aspect:
      - 1
      - 1
      bg: flat
      exits:
      - right
      skin_obj: true
  DDFACE:
    text: only the face changed, to a closed-mouth smile looking out; the raised hand, clothes, size and position identical; compare with DD1
    judge:
