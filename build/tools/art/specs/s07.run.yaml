passfail:
- Any text, letters, numbers, labels or logos, even fake or blurry ones (tick marks with no digits are fine).
- Outlines, cel shading, a flat vector look, painterly brushwork or photorealism (the doctor follows his own sheet's soft 3D render); blur, a vignette or lens flare (the kitchen K1 included).
- The background isn't one flat mid-grey (K1 and the counter below Nani excepted); there's a floor, a surface or a shadow on the grey; grid lines, panel borders or labels.
- Things touching or crossing into a neighbour's cell, or touching an image edge, unless the check says a limb, head, body or tooth runs off that edge (K1 fills the whole image).
- The wrong number of things, things in the wrong order, the wrong view in a cell, or extra objects, people, hands or animals (in a sprite sheet, a hand holding the item is a fail; any piece of the belt drawn is a fail).
- 'A belt view (cell 1 of a belt sheet) not seen from the front and a little above, or the object tilted, standing on an edge, floating, or seen from straight above or straight on instead.'
- 'Hands: not five fingers on each visible hand, fused or extra fingers.'
- The girl not matching her sheet (face, plaits, ribbons, yellow dress, white leggings, white sandals), or looking older or younger.
- Skin that is orange, pink, grey or very pale instead of a warm light tan.
- Immodest clothes, or any religious marker (bindi, tilak, sindoor, deities, temple items); any person drawn in the kitchen.
- Anything scary, bloody, gory or gross; a bare needle anywhere; a bruise in purple or black; real distress instead of a mild, comic wince.
- 'Anything that looks like sweets, lollies, gumballs or jelly beans: drops drawn as glossy balls, daar pieces drawn as beads, potato drawn as butter.'
- An edit that looks identical to the original, or where something other than what was asked moved, changed size or changed colour.
- Light from anywhere but the upper left, or cells of one sheet lit from different sides; a second light; "seen exactly side-on" or "from directly above" drawn at an angle; circles drawn as ovals where "from directly above" was asked (the tipped pan excepted).
- A registered set (the doctor's poses on DW1, the four plates, the six pans, the plaster, bandage, thread and drops colours, the lever up and down) whose object moves or changes size between pictures or cells.
- 'Nani or the doctor not matching their sheet, or a likeness Zafar has not approved (real people: his yes is the pass).'
- Nani's head drawn bigger than Nana's for her body, or her face rendered more photographic than his.
- The doctor in a white coat, with a stethoscope or a bag, or without his glasses, beard, navy check blazer or silver watch.
