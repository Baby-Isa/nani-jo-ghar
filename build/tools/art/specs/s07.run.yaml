parts:
- id: A
  title: 'THE CLINIC: THE DOCTOR (P1; a real person: Zafar approves each one; his sheet doctor-s1-sheet-v1.png is every line''s reference)'
  intro: 'DW1 first: the two faces edit it and every pose is drawn from it. His box and card faces are cut from doctor-ref-faces-v1.png (no prompt). Follow HIS sheet in every line: bald with white side hair, short white beard, clear rectangular glasses, white open-collared shirt, navy check blazer, charcoal trousers, brown shoes, silver watch; no white coat, no stethoscope, no bag.'
  items:
  - lines:
    - DW1
    - DF1
    - DF3
    - DA1
    - DA2
    - DA3
    - DA4
    - DA5
    - DA6
    - DD1
    - DD2
- id: B
  title: 'THE CLINIC: THE GIRL COMPLETE (P1; her life frames and faces, her sole, the dirt, the bump, the drill view, boing''s machine, and the belt sheets her ailments ask for)'
  intro: 'GB1, GM1, GS1, GN1 and I2 are edits of repo files (attach only that one file). DM2 attaches the kept DM1. Every belt sheet attaches the painted belt (cb4c) for its camera only: nothing of the belt is drawn; judge cell 1 of each as the belt view: standing on its base, seen from the front and a little above, level, never tilted.'
  items:
  - lines:
    - GB1
    - GM1
    - GS1
    - GN1
    - RP1
    - I1
    - I2
    - TD1
    - DM1
    - DM2
    - B1
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B10
- id: C
  title: 'THE CLINIC: THE REST OF THE BELT (P2)'
  intro: 'The decoys, one sheet; the belt attached for its camera only.'
  items:
  - lines:
    - B9
- id: D
  title: 'COOK: THE KITCHEN MASTER, NANI (Zafar approves each one), THE STATIONS (as time allows)'
  intro: 'K1 first (the kitchen master). N1 next: every other Nani line edits it or attaches it; judge N1 against the attached Nana for scale and render before anything else: if her head reads bigger than his, or her face more photographic, redo it.'
  items:
  - lines:
    - K1
    - N1
    - N2
    - N3
    - N4
    - N5
    - SK2
    - CP1
    - DP1
    - PT1
checks:
  DW1:
    text: 'the doctor standing, full body, turned three-quarters to the viewer''s LEFT, both feet on one level, BOTH arms hanging relaxed at his sides, nothing in his hands, neutral kind face, mouth closed; as HIS sheet in every feature: bald with white side hair, short white beard, clear rectangular glasses, white open-collared shirt, navy check blazer, charcoal trousers, brown shoes, silver watch on the left wrist; no white coat, no stethoscope, no bag; fills about 85% of the height, touches no edge; no floor drawn; five fingers on each hand'
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      skin_face:
      - 0.25
      - 0.0
      - 0.75
      - 0.2
  DFACE:
    text: only the face changed (the expression asked); glasses, beard, clothes, hands, size and position identical; compare with DW1
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      no_touch: true
      edit:
        allowed:
        - 0.3
        - 0.0
        - 0.7
        - 0.25
      skin_face:
      - 0.25
      - 0.0
      - 0.75
      - 0.2
  DA1:
    text: the same doctor, size, framing and feet as DW1 (compare them side by side); BOTH arms folded across the chest; neutral face; five fingers where they show; touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      like: DW1
  DA2:
