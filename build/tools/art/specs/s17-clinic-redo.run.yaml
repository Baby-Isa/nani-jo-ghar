parts:
- id: A
  title: 'THE ANCHOR: THE PLASTERS'
  intro: 'The four colour plasters redrawn each in one colour with a cream pad, the round plasters in three sizes and the curved round plaster for the heel: one batch every later sheet copies.'
  stop: 'Part A done: post CA01''s chat link in the log and carry straight on with part B (no waiting: Zafar, 6 Nov, the run is unsupervised).'
  items:
  - lines:
    - CA01
- id: B
  title: 'THE REDOS: THE TOOTHBRUSH, THE DROP MACHINE, THE KIT'
  intro: 'TB01 first (the toothbrush at Zafar''s angle: the attached diagram), then its other views copy it; the drop machine; the redone wipes, jug, dropper, bandage, tweezers, thermometer, cup and foot bath.'
  items:
  - lines:
    - TB01
    - TB02
    - DM01
    - CB01
    - CB02
- id: C
  title: 'NEW ITEMS: A FAMILY CHILDREN''S CLINIC'
  intro: 'Wound care, diagnostics, medicines, drops and breathing, supplies, the dentist''s things, casts and comfort: every sheet copies CA01.'
  items:
  - lines:
    - CN01
    - CN02
    - CN03
    - CN04
    - CN05
    - CN06
    - CN07
    - CN08
    - CN09
- id: D
  title: TODAY'S ITEMS, IN THIS BATCH
  intro: 'The pharmacy belt''s own items redrawn so the belt reads as one batch. Lowest priority: if the run must stop, stop here.'
  items:
  - lines:
    - CD01
    - CD02
    - CD03
    - CD04
checks:
  ANCHOR:
    text: eight separate plasters in a 4 by 2 grid in the order listed, each lying flat, seen from the front and a little above, all about the same size except the three round plasters, which step up small, medium, large; each colour plaster ONE calm colour (sage green, mid blue, deep red, golden yellow) with a pale cream pad; the curved heel plaster clearly cupped; matte fabric, soft light from the upper left; one flat grey ground, no shadow; no text
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 8
  SHEET:
    text: the sheet's items in a 4 by 2 grid in the order listed, each clearly that thing to a young child, seen from the front and a little above like the attached CA01, every one about the same size (about 85% of its cell); the same light (upper left), finish and calm colours as CA01, as if from the same photo shoot; no bright sky blue; no text, numbers or labels; no needles; nothing under them, no shadow, one flat grey ground
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces_min: 6
  TOOTH:
    text: eight views of ONE toothbrush, the attached TB01 brush exactly (cream handle, Olympic Blue panels on the back of the handle and head, white bristles), each view as listed; the handle never twisted; the same light and finish as CA01; one flat grey ground, no shadow; no text
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces_min: 6
  ANGLE:
    text: 'one toothbrush lying on its side, bristles facing AWAY; the eye just above the counter''s plane: the back of the head and the back of the handle square-on, flat to us along the whole length, never twisted; the Olympic Blue grip panel exactly in the middle of the back, facing us; only the bristle tips showing over the head; light from the upper left; one flat grey ground, no counter, no shadow; no text'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 1
  MACHINE:
    text: 'one drop machine from the front: a rounded cream cabinet, four identical clear dispensers in a row (soft red, soft ochre yellow, soft green, soft Olympic Blue, in that order), each with a steel spout and a lever up on its right; calm colours, no shine bands, light from the upper left; one flat grey ground, no shadow; no text'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 1
passfail:
- Any text, letters, numbers, labels, logos or price stickers, even fake ones, on any box, bottle, tube, packet, dial or screen.
- Outlines, cel shading, a flat vector look or painterly brushwork.
- A needle, a blade or anything sharp pointed at the viewer; blood.
- Sweets, lollies, lollipops, biscuits or chocolates as anything (a sticker sheet is stars only).
- 'The generator''s bright sky blue (a light electric cyan-blue): a blue is a calm mid Olympic Blue, and only where the line''s prompt names one.'
- A shadow, a reflection, a floor or a table under any item; anything crossing into the next cell; two items merged.
- A cell holding the wrong item, an item missing or drawn twice, or the order changed.
- 'Light oak or pine: any wood is walnut, not too dark on a lid.'
- 'Any symbol or emblem on any item (a plain cross, a crescent or any sign): the items are plain.'
