# The run spec for pack s08b (Sprint 8's object art, from Zafar's play-tests of 17 Oct (Cook) and 18 Oct (clinic); his
# "yes to all" of 18 Oct). Part A Cook (chaat, daar, chai, sekelo, the go-on pictures, the samosa pastry), part B the clinic
# (ear, fever, knee, tooth, eye, foot, taste). No real people in this pack, so no approval gate: Claude judges pass/fail.
# Every part boundary is a safe stop. Zafar runs it himself in ChatGPT with his daily allowance; delivery "download" (kept
# images stay in their chats, downloaded from ChatGPT's Library and saved under the line's save name). Read by
# build/tools/art/artblock.py (the paste block) and artjudge.py. The prompts stay in the plan (section 5:
# docs/design-language/art-plans/s08b-art-plan.md). Edit this file, then regenerate the block; never hand-edit the block.
