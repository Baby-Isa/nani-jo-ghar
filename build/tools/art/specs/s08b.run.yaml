parts:
- id: A
  title: 'COOK: CHAAT, DAAR, CHAI, SEKELO, THE GO-ON PICTURES, THE PASTRY'
  intro: 'Objects only, no people. Each line attaches the picture it replaces or matches, plus the style anchor; match their look, never their mistakes (the line says which).'
  items:
  - lines: [CH1, CH2, CH3, DP2, DP3, CP2, SK3, GO1, SM1]
- id: B
  title: 'THE CLINIC: EAR, FEVER, KNEE, TOOTH, EYE, FOOT, TASTE'
  intro: 'Objects only, no people (FT1 is an edit of the girl''s sole close-up). Every line attaches the plaster packet as the look to match: real-looking materials and fine surface detail, as the item boxes.'
  items:
  - lines: [TH1, FN1, FV1, BD1, TB1, ED1, EC1, LM1, FT1, SP1, TS1]
checks:
  ITEM1:
    text: one object, whole, centred, seen as the line says, filling about 70% of the image, on one flat mid-grey; nothing touches an edge; no shadow on the grey
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  SHEET2:
    text: the two things the line names, one in each half, the same scale, each whole; nothing touches the middle or an edge; flat mid-grey
    judge: {aspect: [3, 2], bg: flat, pieces: 2, no_touch: true}
  SHEET3:
    text: the three things the line names, left to right, the same scale; nothing touches a neighbour or an edge; flat mid-grey
    judge: {aspect: [3, 2], bg: flat, pieces: 3, no_touch: true}
  SHEET4:
    text: the four things the line names in a 2 by 2 grid, the same scale, each whole; nothing touches a cell boundary or an edge; flat mid-grey
    judge: {aspect: [3, 2], bg: flat, pieces_min: 4, no_touch: true}
  FAN2:
    text: 'the SAME white ceiling fan twice (left still, right spinning), seen as in the attached room: from in front and a little BELOW, almost level with it, the blades a thin flattened ellipse spreading left and right with their undersides just showing, the motor''s underside visible, the down-rod rising to a ceiling plate at the top; never a flat star seen from straight below or above'
    judge: {aspect: [3, 2], bg: flat, pieces: 2, no_touch: true}
  SIDEON:
    text: 'the bowl EXACTLY side-on: the rim one straight horizontal line, NO ellipse of the rim or the floor showing; clear glass, empty; flat mid-grey; touches no edge'
    judge: {aspect: [3, 2], bg: flat, pieces: 1, no_touch: true}
  STRIPS5:
    text: 'five horizontal strips stacked with grey between, each the full width of the same glass bowl''s inside seen exactly side-on, the food as a layer seen through glass, in the order the line names; no bowl drawn; nothing touches an edge'
    judge: {aspect: [2, 3], bg: flat, pieces_min: 5, no_touch: true, sweets: true}
  TOPDOWN1:
    text: 'the pot from EXACTLY straight above: the rim a perfect circle, the walls equally thick all round, the floor a centred circle; empty; flat mid-grey; touches no edge'
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  DISCS6:
    text: 'six round discs of pot contents from exactly above, the SAME size, in a 3 by 2 grid, in the order the line names; no pot, no rim; perfect circles; nothing touches a cell boundary'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 6, no_touch: true, sweets: true}
  PAN3:
    text: 'three times the SAME steel chai pan from EXACTLY straight above, same size and place in each third, handle to the right: empty, milky chai, dark black tea; the rim a perfect circle; nothing touches a boundary'
    judge: {aspect: [3, 2], bg: flat, pieces: 3, no_touch: true}
  TRAY4:
    text: 'four times the SAME square, matte, brushed-steel tray from directly above in a 2 by 2 grid, with ONE, TWO, THREE, FOUR bare skewers straight and parallel left to right, handles to the right past the rim; less shiny than the grill; nothing touches a cell boundary'
    judge: {aspect: [3, 2], bg: flat, pieces: 4, no_touch: true}
  TILE:
    text: 'one seamless, tileable strip as the line says: its left and right ends match so it repeats with no visible seam; even light, no shadow on the grey; nothing else'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 1}
  BRUSH:
    text: 'a child''s toothbrush as the line says: the bristles facing the viewer''s left towards the teeth, the handle pointing to the viewer''s right and slightly down, NOT twisted (the bristles and the handle''s back on opposite sides); flat mid-grey; touches no edge'
    judge: {aspect: [3, 2], bg: flat, pieces: 1, no_touch: true}
  WALL:
    text: 'a plain optician''s wall filling the whole image, softly out of focus at its edges, with ONE blank white eye-test board on it taking about 70% of the height, centred; NO letters, pictures, lines or icons on the board'
    judge: {aspect: [2, 3], bg: none}
  SOLEEDIT:
    text: 'the same sole as the attached (size, framing, toes) but the leg runs on off the bottom edge of the image with no cuff edge or cut line; the gaps between the toes are clean background, no grey wedges; only that changed'
    judge: {aspect: [2, 3], bg: flat, exits: [bottom], skin_obj: true}
passfail:
- Any text, letters, numbers, labels or logos, even fake or blurry ones.
- Outlines, cel shading, a flat vector look or painterly brushwork; blur, a vignette or lens flare (EC1's soft wall edges excepted).
- The background isn't one flat mid-grey (EC1 excepted); a floor, a surface or a shadow on the grey; grid lines, panel borders or labels.
- Things touching or crossing into a neighbour's cell, or touching an image edge, unless the check says so (FT1's leg, EC1's wall).
- The wrong number of things, things in the wrong order, the wrong view, or extra objects, people, hands or animals.
- A top-down line not EXACTLY from above (an ellipse instead of a circle, one wall thicker than the other); a side-on line showing the rim or floor as an ellipse.
- Anything scary, bloody, gory or gross; a bare needle; a cut-open foot (SP1's channel is a raised red welt, never an open wound).
- 'Anything that looks like sweets, lollies, gumballs or jelly beans: drops as glossy balls, daar or chickpeas as beads.'
- Any religious marker.
