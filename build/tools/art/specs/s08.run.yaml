      the line''s {POSE} words; the new arms rendered like the rest of him, never like an attached s07 picture; the watch on his LEFT wrist; skin within ΔE 6 of the sheet swatch #D3997A (never orange, pink,
      darker or paler than the sheet); touches no edge, no floor, one flat mid-grey; five fingers on each visible hand; Zafar''s ok is the pass'
