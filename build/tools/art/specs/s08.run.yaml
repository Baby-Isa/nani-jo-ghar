passfail: ['Any text, letters, numbers, labels or logos, even fake or blurry ones.', 'Outlines, cel shading, a flat vector look, painterly brushwork or photorealism; blur, a vignette or lens flare.', 'The
    old s07 rendering copied instead of the sheet''s: pores, fine wrinkles, photographic skin, single hairs, fabric weave, knit or embroidery texture, refraction in the glasses.', 'Skin off the sheet''s
    swatch (the doctor about #D3997A, Nani about #D48E6B): orange, pink, grey, very pale, or visibly darker or lighter than the sheet; or a face and hands of different tones.', 'Eyes bigger than on the
    lineup (the rejected V5 look) or smaller and more photographic than it; a face that is not clearly the same person as the lineup (real people: Zafar''s yes is the pass).', 'The background isn''t one
    flat mid-grey (sheets light blue-grey; the marble below Nani''s counter excepted); a floor, a surface or a shadow on the grey; grid lines, panel borders or labels.', 'Anything touching an image edge,
    or crossing into a neighbour''s cell or panel on a sheet.', 'Extra objects, people, hands or animals; a bag or a stethoscope on the doctor; the watch missing or on the wrong wrist.', 'Hands: not five
    fingers on each visible hand, fused or extra fingers.', 'A turn or a pose whose figure moves, changes size or changes its feet line against the base it attaches first; a turn that is a mirror flip (the
    watch swaps wrists).', A pose with the wrong arm raised or the wrong direction (pointing left when the line says right); a pose copied in the old picture's rendering., 'An edit that looks identical
    to the original, or where something other than what was asked moved, changed size or changed colour.', 'Nani portly, or taller-looking than slim; her clothes tight or immodest, her dupatta off her head,
    embroidery all over the kameez instead of a few motifs; any religious marker (bindi, tilak, sindoor, deities, temple items).', 'A face sheet whose heads are not registered (the eyes not on one line
    across a row, a head a different size), or with fewer or more than twelve cells.', 'Light from anywhere but the upper left, or a second light.']
