parts:
- id: A
  title: 'THE DOCTOR, NEED (a real person: his first picture DW-F waits for Zafar''s ok before any other doctor line)'
  intro: 'DW-F first and alone (his approved sheet + the lineup): post it and WAIT for Zafar''s ok; nothing else of the doctor is sent before it, DX included. Then DX, DW-QL and DW-QR at once (the turns attach DW-F first, the sheet second). DT and DB edit a turn (that one image only); D-WAV-QR and D-WAV-F redraw their view''s base with the sheet and the lineup attached; D-WAVC-F edits D-WAV-F. A line''s "slots:" words go into its prompt''s {VIEW} or {POSE}, word for word.'
  stop: 'Part A done: post the part A summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
  items:
  - lines: [DW-F, DX, DW-QL, DT-QL, DB-QL, DW-QR, D-WAV-QR, D-WAV-F, D-WAVC-F]
- id: B
  title: 'NANI, NEED (a real person: her first picture NL waits for Zafar''s ok before any other Nani line)'
  intro: 'NL first and alone (her approved sheet + the lineup): post it and WAIT for Zafar''s ok; nothing else of Nani is sent before it, NX included. Then NX, and NL-HAP, NL-TLK and NL-BLK edit NL (that one image only); NL-PNT attaches NL first, the sheet second, the lineup third. No rings on her fingers anywhere.'
  stop: 'Part B done: post the part B summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
  items:
  - lines: [NL, NX, NL-HAP, NL-TLK, NL-BLK, NL-PNT]
- id: C0
  title: THE NEXT BASES AND FACES, LIKELY (his front and 3q-right faces; her standing base, faces and quarter turns)
  intro: 'DT-F, DB-F, DT-QR, DB-QR edit a kept base. NW-F is her standing base (her sheet + the lineup): post it for his ok, then NT-F and NB-F edit it and NW-QL and NW-QR redraw it (the sheet second); NT-QL and NT-QR edit the turns.'
  stop: 'Part C0 done: post the part C0 summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
