# The run spec for pack s08 (Sprint 8 art; Zafar, 16 Oct: the style is locked to sources/art/s08/lineup-v4-1.png, now the doctor
# and Nani in every view and gesture the game needs or will need). Read by build/tools/art/artblock.py (the paste block) and
# artjudge.py. The prompts stay in the plan (section 5: docs/design-language/art-plans/s08-style-prompts.md); a line says
# `prompt: X` to paste X's code box, and its `slots:` fill X's {VIEW} or {POSE}, word for word (artspec.py checks both ways).
# Parts: A the doctor's NEED set (sheet, face sheet, three bases with talk and blink, the waves), B Nani's NEED set (sheet, face
# sheet, the five leaning pictures, the standing base), C1-C3 the LIKELY set in value order; every part boundary is a safe stop.
# The drift guard: every line attaches the character's new sheet; a turn redraws the face-on base, a pose redraws its view's
# base, a face is an edit; every check carries the skin swatch sampled from the lineup (the doctor #D3997A, Nani #D48E6B) and
# the judge measures ΔE against it. Zafar runs it himself in Claude in Chrome: delivery "download" (kept images stay in their
# chats, downloaded in run order at the end; never page-JavaScript uploads). RAW is the branch because the lineup and the s07
# pictures are not on main yet; switch raw_branch to main and regenerate once they are published. Edit this file, then
# regenerate the block; never hand-edit the block. Written by a generator once (16 Oct); hand-edit from here.
