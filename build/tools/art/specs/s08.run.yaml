parts:
- id: S
  title: 'THE STYLE LOCK: three lineups, then STOP for Zafar''s pick (real people: his word is the pass)'
  intro: 'Run LA, LB and LC at once (one window each), judge each against its check and redo as usual, then STOP. Post the three kept lineups with their chat links and exactly these words: "Zafar: pick A, pick B, pick C or none". Start NOTHING from parts A, B or C until Zafar answers in this chat; this overrides the loop''s "parts are priorities, not walls": here they are walls. His answer: "pick A" = run part A only. "pick B" = run part B only. "pick C" = run part B with the kept LC attached wherever a line says kept:LB, then part C. "none" = run nothing more, post the log and the downloads. If he answers anything else, ask him for one of the four words.'
  stop: 'Part S done: post the part S summary and the three lineups, then WAIT for Zafar''s pick. Nothing below runs until he has answered.'
  items:
  - lines: [LA, LB, LC]
- id: A
  title: 'ONLY ON "pick A": THE DOCTOR AT NANI''S LEVEL (a real person: Zafar approves each one)'
  intro: 'DS2 first (post it; wait for his ok): every pose attaches it. Every pose line attaches its kept s07 picture for the pose only and the sheet for the rendering; judge the rendering against the sheet, never against the s07 picture. DF1 and DF3 edit DW1; DD2 edits DD1.'
  items:
  - lines: [DS2, DW1, DF1, DF3, DW1F, DW1QR, DA6QR, DD1, DD2, DR2]
- id: B
  title: 'ONLY ON "pick B" OR "pick C": THE DOCTOR AND NANI IN THE SOFT FINISH (real people: Zafar approves each one)'
  intro: 'DS2B first (post it; wait for his ok): every doctor pose attaches it. A line marked "(prompt X)" pastes the code box of X from the plan with the attachments on its own line. On pick C, attach the kept LC wherever a line says kept:LB. N1B next (post it; wait for his ok): N2B, N3B and N5B edit it and N4B attaches it first.'
  items:
  - lines: [DS2B, DW1B, DF1B, DF3B, DW1FB, DW1QRB, DA6QRB, DD1B, DD2B, DR2B, N1B, N2B, N3B, N4B, N5B]
- id: C
  title: 'ONLY ON "pick C", AFTER PART B: THE GIRL''S TWO BASES'
  intro: 'Each attaches the kept LC for her new rendering and her own picture for everything else.'
  items:
  - lines: [GW1C, GW13C]
checks:
  LINEUP:
    text: 'four people in a row, left to right the doctor, Nani, the little girl, Nana; full body, front-on, arms at their sides, standing on one invisible floor with every pair of feet on ONE level; the doctor about 1.5 times the girl''s height (her head top at his chest), Nani and Nana a little shorter than him; each as their attached picture in face and clothes (the doctor: bald, white side hair, white beard, rectangular glasses, navy check blazer; Nani: red dupatta over her head, cream kurta; the girl: yellow dress, plaits with white bows); the doctor as smooth-skinned as Nani, no pores or weave on him; one flat mid-grey; nothing touches an edge; five fingers on each hand'
    judge:
      aspect: [3, 2]
      bg: flat
      no_touch: true
  LINEUPB:
    text: 'as LINEUP, and: the doctor''s and Nani''s FACES unchanged (face shape, features, glasses, his beard and hairline, her dupatta''s framing, skin tone, age: clearly the same two people as their attached pictures); below the neck and in the finish they match the girl: matte poreless skin, rounder simpler bodies, plain soft cloth with no weave, knit or fine folds, simple hands, no refraction in the glasses; Nani''s clothes modest and loose, her dupatta over her head'
    judge:
      aspect: [3, 2]
      bg: flat
      no_touch: true
  DSHEET:
    text: 'the same sheet as his: the same panels in the same places (turnaround front, three-quarter, side, back; the seated portrait; two hands; glasses; watch; bag; fabric close-up; colour strip), the same man in every panel with identical clothing; rendered as the doctor in the lineup: smooth simple skin, no pores, no single hairs, no fabric weave, eyes a little larger, soft rounded forms; still clearly him (his face shape, glasses, beard, hairline; Zafar''s ok is the pass); light blue-grey ground'
    judge:
      aspect: [3, 2]
      bg: flat
  DSHEETB:
    text: 'as DSHEET, but the finish is the girl''s: his face unchanged (shape, features, glasses, beard, hairline, skin tone, age), matte poreless skin, rounder simpler body, plain soft cloth with no weave, simple hands with rounded fingers, no refraction, the same soft edges as the girl'
    judge:
      aspect: [3, 2]
      bg: flat
  DW1:
    text: 'the doctor standing, full body, turned three-quarters to the viewer''s LEFT, both feet on one level, BOTH arms hanging relaxed at his sides, nothing in his hands, neutral kind face, mouth closed; the same pose, size, framing and feet as the attached s07 picture (compare them side by side); rendered exactly as the attached SHEET, not as the s07 picture (no pores, no weave, no single hairs); bald with white side hair, short white beard, clear rectangular glasses, white open-collared shirt, navy check blazer, charcoal trousers, brown shoes, silver watch on the left wrist; no white coat, no stethoscope, no bag; fills about 85% of the height, touches no edge; no floor drawn; five fingers on each hand'
    judge:
      aspect: [2, 3]
      bg: flat
      fill_h: [0.75, 0.95]
      no_touch: true
      skin_face: [0.25, 0.0, 0.75, 0.2]
  DFACE:
    text: only the face changed (the expression asked); glasses, beard, clothes, hands, size and position identical; compare with the base it edits
    judge:
      aspect: [2, 3]
      bg: flat
      no_touch: true
      edit:
        allowed: [0.3, 0.0, 0.7, 0.25]
      skin_face: [0.25, 0.0, 0.75, 0.2]
  DFRONT:
    text: 'as DW1 but FRONT-on to the viewer, looking at us; the same pose, size, framing and feet as the attached s07 front picture; rendered exactly as the attached sheet'
    judge:
      aspect: [2, 3]
      bg: flat
      fill_h: [0.75, 0.95]
      no_touch: true
      skin_face: [0.25, 0.0, 0.75, 0.2]
  DQR:
    text: 'as DW1 but turned three-quarters to the viewer''s RIGHT (drawn, not flipped: the watch stays on his LEFT wrist); the same pose, size, framing and feet as the attached s07 picture; rendered exactly as the attached sheet'
    judge:
      aspect: [2, 3]
      bg: flat
      fill_h: [0.75, 0.95]
      no_touch: true
      skin_face: [0.25, 0.0, 0.75, 0.2]
  DA6:
    text: 'the doctor turned three-quarters to the viewer''s RIGHT, the near arm up in a wave with the palm to us, the other at his side, a big warm smile; the same pose, size, framing and feet as the attached s07 picture; rendered exactly as the attached sheet; the watch on his LEFT wrist; five fingers; touches no edge'
    judge:
      aspect: [2, 3]
      bg: flat
      fill_h: [0.75, 0.95]
      no_touch: true
  DD1:
    text: 'square; the doctor standing, full body, front-on, one hand raised in a wave beside his head with the palm to us, the other at his side, a big open calling smile; the same pose, size, framing and feet as the attached s07 picture; no door, frame, wall or floor drawn; rendered exactly as the attached sheet; five fingers; touches no edge'
    judge:
      aspect: [1, 1]
      bg: flat
      fill_h: [0.8, 0.98]
      no_touch: true
  DDFACE:
    text: only the face changed, to a closed-mouth smile looking out; the raised hand, clothes, size and position identical; compare with the DD1 it edits
    judge:
      aspect: [1, 1]
      bg: flat
      no_touch: true
      edit:
        allowed: [0.3, 0.0, 0.7, 0.3]
  DFACES:
    text: 'twelve head-and-shoulders faces in the same 4 by 3 grid and order as the attached faces sheet (neutral smile, talking, laughing, gentle smile, cheering, warm closed smile, finger up, thinking, surprised, worried, sceptical, wink-laugh), the same man in every cell, rendered exactly as the attached character sheet (no pores, no single hairs, no weave); light blue-grey ground in every cell; nothing crosses a cell boundary'
    judge:
      aspect: [3, 2]
      bg: flat
  NANIB:
    text: 'Nani leaning exactly as the attached N1 (both forearms flat on the marble counter, elbows on it, the counter''s back edge at the same height, the same size, framing, glasses, red dupatta, cream embroidered kurta, bracelet and rings); her FACE unchanged (shape, features, glasses, the dupatta''s framing, skin tone, age: clearly her); the finish now the girl''s: matte poreless skin, no knit or weave on the dupatta, simple embroidery, simple hands, no refraction; modest, no bangles; grey above the counter, marble below; Zafar''s ok is the pass'
    judge:
      aspect: [2, 3]
      bg: none
  NFACE:
    text: only the face changed (the mood asked); glasses, dupatta, arms, hands, counter, size and position identical; compare with N1B
    judge:
      aspect: [2, 3]
      bg: none
      edit:
        allowed: [0.25, 0.1, 0.75, 0.42]
  NPOINT:
    text: 'the same Nani, size, framing, face and counter line as N1B (compare them side by side: an edit of it, not a fresh drawing); her left forearm (viewer''s right) still flat on the counter; her right hand up beside her face, index finger pointing down to the viewer''s right, elbow on the counter; the raised arm rendered like the rest of her; five fingers'
    judge:
      aspect: [2, 3]
      bg: none
  GIRLC:
    text: 'the same girl, pose, size, framing, feet, clothes, plaits and bows as the attached picture (compare them side by side); only her rendering changed, exactly as the girl in the attached LC lineup: eyes a little smaller, a touch more shading on cheeks and nose, head a touch smaller; still the same small child, smooth matte skin; one flat mid-grey; touches no edge; five fingers'
    judge:
      aspect: [2, 3]
      bg: flat
      no_touch: true
passfail:
- Any text, letters, numbers, labels or logos, even fake or blurry ones.
- Outlines, cel shading, a flat vector look, painterly brushwork or photorealism; blur, a vignette or lens flare.
- 'Pores, fine wrinkles, single hairs, fabric weave or knit, or refraction in glasses, on anyone (LA excepted on nobody: in LA the doctor must already be as smooth as Nani).'
- The background isn't one flat mid-grey (sheets light blue-grey, the counter below Nani excepted); there's a floor, a surface or a shadow on the grey (a soft contact shadow under feet in a lineup is fine); grid lines, panel borders or labels.
- Anything touching an image edge, or crossing into a neighbour's cell on a sheet.
- The wrong number of people, people in the wrong order, or extra objects, people, hands or animals.
- 'Hands: not five fingers on each visible hand, fused or extra fingers.'
- 'A lineup whose feet are not on one level, or whose heights are wrong: the doctor must be about 1.5 times the girl (her head top at his chest), Nani and Nana a little shorter than him.'
- The girl not matching her sheet (face, plaits, ribbons, yellow dress, white leggings, white sandals) or looking older or younger (in LC and part C only the small rendering step asked).
- Skin that is orange, pink, grey or very pale instead of a warm light tan.
- Immodest or tight clothes on Nani, her dupatta off her head, or any religious marker (bindi, tilak, sindoor, deities, temple items).
- An edit that looks identical to the original, or where something other than what was asked moved, changed size or changed colour.
- Light from anywhere but the upper left, or a second light.
- 'A registered set (the doctor''s poses on their s07 pictures, Nani''s moods on N1B) whose figure moves or changes size between pictures.'
- 'The doctor or Nani not clearly the same person as their attached picture (face shape, glasses, his beard and hairline, her dupatta''s framing), or a likeness Zafar has not approved (real people: his yes is the pass).'
- The doctor in a white coat, with a stethoscope or a bag, or without his glasses, beard, navy check blazer or silver watch; the watch on the wrong wrist.
- A pose rendered like its attached s07 picture (the realistic one) instead of like the attached sheet.
