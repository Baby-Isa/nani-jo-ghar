parts:
- id: A
  title: 'THE DOCTOR, NEED (a real person: Zafar approves each one before it is attached to the next)'
  intro: 'DS first; post it and wait for his ok: every doctor line attaches it (DX and DW-F next, at once). DW-F is the face-on base: post it, wait for his ok, then the turns DW-QL and DW-QR attach it and
    the s07 picture of that turn (the turn only; its rendering is wrong). DT and DB edit a base; D-CALL-F edits D-WAV-F. A line''s "slots:" words go into its prompt''s {VIEW} or {POSE}, word for word.'
  stop: 'Part A done: post the part A summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
  items:
  - lines: [DS, DX, DW-F, DW-QL, DW-QR, DT-F, DB-F, DT-QL, DB-QL, DT-QR, DB-QR, D-WAV-F, D-CALL-F, D-WAV-QR]
- id: B
  title: 'NANI, NEED (a real person: Zafar approves each one before it is attached to the next)'
  intro: 'NS first; post it and wait for his ok: every Nani line attaches it (NX, NL and NW-F next, at once). NL is the Cook base: his ok, then NL-HAP, NL-TLK and NL-BLK edit it and NL-PNT attaches it first.
    NW-F is the standing base: his ok, then NT-F and NB-F edit it.'
  stop: 'Part B done: post the part B summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
  items:
  - lines: [NS, NX, NL, NL-HAP, NL-TLK, NL-BLK, NL-PNT, NW-F, NT-F, NB-F]
- id: C1
  title: TALKING AND POINTING, LIKELY (both; the story and conversation set)
  intro: Nani's quarter turns NW-QL and NW-QR first (his ok, then their poses attach them). Every pose attaches its view's base first and the sheet second; a third attachment, where there is one, is an
    old s07 picture for the arm pose only.
  stop: 'Part C1 done: post the part C1 summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
  items:
  - lines: [NW-QL, NT-QL, NW-QR, NT-QR, D-TLK-F, D-TLK-QL, D-TLK-QR, D-PNT-F, D-PNT-QL, D-PNT-QR, D-PL-F, D-PL-QL, D-PR-F, D-PR-QR, D-IDE-F, D-IDE-QL, D-IDE-QR, N-TLK-F, N-TLK-QL, N-TLK-QR, N-PNT-F, N-PNT-QL,
      N-PNT-QR, N-PL-F, N-PL-QL, N-PR-F, N-PR-QR, N-IDE-F, N-IDE-QL]
- id: C2
  title: WAVES, UP AND DOWN, WELCOME AND CELEBRATE, LIKELY
  intro: 'As C1: the base first, the sheet second, an old pose picture third where there is one.'
  stop: 'Part C2 done: post the part C2 summary (see AT THE END). This is a safe stop: if Zafar has said "stop" or "download" in this chat, do AT THE END now; otherwise carry on.'
  items:
  - lines: [D-WAV-QL, D-UP-F, D-UP-QL, D-UP-QR, D-DN-F, D-DN-QL, D-DN-QR, D-WEL-F, D-WEL-QL, D-WEL-QR, D-CEL-F, D-CEL-QL, D-CEL-QR, N-WAV-F, N-WAV-QL, N-WAV-QR, N-UP-F, N-DN-F, N-WEL-F, N-CEL-F, N-CEL-QL]
- id: C3
  title: FOLDED, THINKING, THE TORCH, THE COUNTER SET AND THE SIDE VIEWS, LIKELY
