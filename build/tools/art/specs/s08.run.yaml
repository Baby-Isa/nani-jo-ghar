checks:
  DSHEET:
    text: 'the doctor''s sheet from the lineup: a four-view turnaround on one feet line, a front face close-up, a three-quarter face, both hands, the glasses and watch, seven colour swatches; the same man
      in every panel with identical clothing (bald, white side hair, short solid white beard, thin rectangular glasses, white open shirt, plain navy blazer with a faint check, charcoal trousers, brown belt
      and shoes, watch on the LEFT wrist; no bag, no stethoscope); rendered exactly as the man on the left of the lineup (the likeness, the slightly larger open eyes, matte smooth skin, no pores, weave
      or single hairs); skin within ΔE 6 of the sheet swatch #D3997A (never orange, pink, darker or paler than the sheet); light blue-grey ground; nothing touches a neighbour or an edge; Zafar''s ok is
      the pass'
    judge:
      aspect: [3, 2]
      bg: flat
  DFACES:
    text: 'twelve head-and-shoulders faces of the doctor in a 4 by 3 grid in the order asked (neutral, talking A, talking B, smiling, laughing, blink, surprised, thinking, concerned, proud, nod, listening);
      REGISTERED: the head the same size and place in every cell, eyes on one line per row (lay a ruler across); only the face changes; rendered exactly as the attached sheet; skin within ΔE 6 of the sheet
      swatch #D3997A (never orange, pink, darker or paler than the sheet); light blue-grey in every cell; nothing crosses a cell boundary'
    judge:
      aspect: [3, 2]
      bg: flat
  DVIEW:
    text: 'the doctor standing, full body, in the view the line''s {VIEW} words say (a turn: compare with the face-on base it attaches first: the same size, feet line and head height; drawn, not flipped:
      the watch on his LEFT wrist), both arms relaxed at his sides, nothing in his hands, neutral kind face, mouth closed; rendered exactly as the attached sheet, never as the old s07 picture (no pores,
      weave or single hairs); skin within ΔE 6 of the sheet swatch #D3997A (never orange, pink, darker or paler than the sheet); fills about 85% of the height, touches no edge, no floor, one flat mid-grey;
      five fingers on each hand; Zafar''s ok is the pass'
    judge:
      aspect: [2, 3]
      bg: flat
      fill_h: [0.75, 0.95]
      no_touch: true
      skin_face: [0.25, 0.0, 0.75, 0.2]
      skin: '#D3997A'
  DEDIT:
    text: 'only the face changed (the mouth or the eyes, as asked); glasses, beard, hands, clothes, size and position identical; compare with the base it edits; skin within ΔE 6 of the sheet swatch #D3997A
      (never orange, pink, darker or paler than the sheet)'
    judge:
