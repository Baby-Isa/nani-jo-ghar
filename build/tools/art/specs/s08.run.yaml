# The run spec for pack s08 (Sprint 8 art; Zafar, 16 Oct: the style is locked to sources/art/s08/lineup-v4-1.png and the
# character sheets sheet-doctor-final-1.png and sheet-nani-final-1.png are approved; now the doctor and Nani in every view
# and gesture the game needs or will need). Read by build/tools/art/artblock.py (the paste block) and artjudge.py. The
# prompts stay in the plan (section 5: docs/design-language/art-plans/s08-style-prompts.md); a line says `prompt: X` to
# paste X's code box, and its `slots:` fill X's {VIEW} or {POSE}, word for word (artspec.py checks both ways).
# Parts: A the doctor's NEED set (the nine the game wires first), B Nani's NEED set (the five leaning pictures, her face
# sheet), C0-C3 the LIKELY set in value order; every part boundary is a safe stop. No sheet is drawn: the sheets are approved.
# The drift guard: the face sheets and the face-on bases are edits of the approved sheet (sheet + lineup attached); a turn
# redraws the face-on base (sheet attached); a pose redraws its view's base (sheet + lineup attached); a face is an edit of
# that one image. Every prompt names the skin hex (the doctor #C88A6F, Nani #D5906C, the sheet swatches) and the judge
# measures ΔE against it. Nani wears no rings (Zafar, 16 Oct). Zafar runs it himself in Claude in Chrome; delivery
# "download" (kept images stay in their chats; at the end they are downloaded from ChatGPT's Library page to his PC and
# logged "title -> save as"; never page JavaScript, never a GitHub upload). RAW is the branch because the approved files are
# not on main yet; switch raw_branch to main and regenerate once they are published. Edit this file, then regenerate the
# block (--out docs/design-language/art-plans/s08-paste-block.txt); never hand-edit the block.
pack: s08
title: 'Sprint 8 art: the doctor and Nani in the locked style, every view and gesture'
plan: docs/design-language/art-plans/s08-style-prompts.md
plan_branch: claude/new-session-b5r2am
repo: Baby-Isa/nani-jo-ghar
raw_branch: claude/new-session-b5r2am
dest: sources/art/s08
real_people: true
delivery: download
approvals: "- Zafar approves characters based on real people; the doctor and Nani are both in this run. The FIRST picture of each person gates the rest: DW-F for the doctor and NL for Nani. Post it in this chat as soon as it is kept and WAIT for his ok before any other line of that person is sent, even one that is READY (DX waits for DW-F's ok; NX waits for NL's); keep the other person's windows generating meanwhile. His \"no\" with a reason is a redo of that line with the same prompt and attachments, never a reworded one, and the gate holds until his ok. After the gate, post every later picture of that person as it is kept and carry on without waiting; if he says \"no\" to one, redo it (and the edits of it) before anything that attaches it is sent."
runner: {windows: 3, send_gap_seconds: 60, stall_minutes: 6, hard_minutes: 10, redos: 2, commit_batch: 6, flush_minutes: 25}
refs:
  lineup-v4-1.png: sources/art/s08/lineup-v4-1.png
  sheet-doctor-final-1.png: sources/art/s08/sheet-doctor-final-1.png
  sheet-nani-final-1.png: sources/art/s08/sheet-nani-final-1.png
people: {}
limb_sets: {}
templates: {}
limb_templates: {}
