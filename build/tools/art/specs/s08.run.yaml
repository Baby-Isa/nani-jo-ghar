# The run spec for pack s08 (Sprint 8 art; Zafar, 16 Oct: lock the style of the real people before any pose). Part S the
# style lock: three lineups (LA the doctor at Nani's level, LB faces kept and the rest in the girl's world, LC as LB with the
# girl a step toward them), then STOP for Zafar's pick. Part A (pick A): the doctor's sheet and his eight wired pictures and
# card faces at Nani's level. Part B (pick B or C): the same in the soft finish, plus Nani's N1-N5 redone as edits. Part C
# (pick C only): the girl's two bases. Read by build/tools/art/artblock.py (the paste block) and artjudge.py. The prompts
# stay in the plan (section 5: docs/design-language/art-plans/s08-style-prompts.md); a part-B pose line says `prompt: X` to
# paste part A's box with its own attachments. Edit this file, then regenerate the block; never hand-edit the block.
# Zafar runs it himself in Claude in Chrome (plan section 3): delivery is "download" (kept images stay in their chats and
# are downloaded in order at the end; never page-JavaScript uploads). RAW is the branch because the s07 kept pictures
# (DW1, DD1, N1 ...) are not on main yet; switch raw_branch to main and regenerate once they are published.
