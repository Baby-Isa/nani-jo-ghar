# drop machine, the sole, the sekelo plate, the girl's life frames, the man's and the woman's wide poses, the old man's and
# old woman's eye close-ups, the adult limbs, five belt sheets). Read by build/tools/art/artblock.py (the paste block) and
# artjudge.py. The prompts stay in the audit (section 5: docs/design-language/art-plans/s05-art-audit.md). Edit this file,
# then regenerate the block; never hand-edit the block. Zafar runs it himself in ChatGPT (audit section 2).
