passfail:
- Any text, letters, numbers, labels or logos, even fake or blurry ones (tick marks with no digits are fine).
- Outlines, cel shading, a flat vector look, painterly brushwork or photorealism; blur, a vignette or lens flare (the kitchen A1 included).
- The background isn't one flat mid-grey (A1 excepted); there's a floor, a surface or a shadow on the grey; grid lines, panel borders or labels.
- Things touching or crossing into a neighbour's cell, or touching an image edge, unless the check says a limb, head or body runs off that edge (A1 fills the whole image).
- The wrong number of things, things in the wrong order, the wrong view in a cell, or extra objects, people, hands or animals (in a sprite sheet, a hand holding the item is a fail).
- 'Hands: not five fingers on each visible hand, fused or extra fingers.'
- The girl not matching her sheet (face, plaits, ribbons, yellow dress, white leggings, white sandals), or looking older or younger.
- Skin that is orange, pink, grey or very pale instead of a warm light tan.
- Immodest clothes, or any religious marker (bindi, tilak, sindoor, deities, temple items); any person drawn in the kitchen.
- Anything scary, bloody, gory or gross; a bare needle on the syringe.
- 'Anything that looks like sweets, lollies, gumballs or jelly beans: coins or spots drawn as glossy discs, ginger drawn as gummies.'
- An edit that looks identical to the original, or where something other than what was asked moved, changed size or changed colour.
- Light from anywhere but the upper left, or cells of one sheet lit from different sides; a second light; "seen exactly side-on" or "from directly above" drawn at an angle; circles drawn as ovals where
  "from directly above" was asked (the tipped pan excepted).
- A registered set (the three glasses, the five jars, the six fold frames, the heater's pairs, a row of jugs) whose object moves or changes size between cells.
- 'Nani or the doctor not matching their sheet, or a likeness Zafar has not approved (real people: his yes is the pass).'
- Nani's head drawn bigger than Nana's for her body, or her face rendered more photographic than his.
