parts:
- id: A
  title: 'COOK: NANI AT THE COUNTER (P1; Zafar approves each one)'
  intro: 'N1 first: every other Nani line edits it or attaches it. Judge N1 against the attached Nana for scale and render before anything else: if her head reads bigger than his, or her face more photographic,
    redo it.'
  items:
  - lines:
    - N1
    - N2
    - N3
    - N4
    - N5
- id: B
  title: 'THE CLINIC: THE DOCTOR (P1; a real person: Zafar attaches the photos and approves each one)'
  intro: 'DS1 first: every doctor line attaches it. The photos never go into the repo.'
  items:
  - lines:
    - DS1
    - DW1
    - DW2
    - DW3
    - DW4
    - DW5
    - DD1
- id: C
  title: 'THE CLINIC AND COOK: THE GAPS (P1 and P2)'
  intro: DM2 attaches the kept DM1. RP1, SK2, GB1 and GM1 attach repo files only.
  items:
  - lines:
    - DM1
    - DM2
    - RP1
    - SK2
    - GB1
    - GM1
- id: D
  title: 'THE CLINIC: THE MAN AND THE WOMAN, THEIR WIDE POSES (W1 is P1; the rest P2)'
  compact: true
  intro: 'For each person, run these lines with that person''s prefix and sheet (the sheet is a repo file, already kept in the clinic pack):'
  items:
  - who: man
    ids:
    - W1
    - W2
    - W3
    - W4
    - W5
    - W6
    - W7
    - W8
    - W9
    - W10
  - who: woman
    ids:
    - W1
    - W2
    - W3
    - W4
    - W5
    - W6
    - W9
    - W10
    note: 'front only: none of her games is side-on'
- id: E
  title: 'THE CLINIC: HEAD CLOSE-UPS AND THE ADULT LIMBS (P2)'
  compact: true
  intro: 'The games each person plays (clinic plan 3.2): the old man and the old woman the eye games, the man the tooth, the woman the sore spots; the adult limbs are drawn from the man''s sheet and shared
    by every adult patient.'
  items:
  - who: oldman
    ids:
    - Y1
    - Y2
    - Y3
    - T1
    - T2
  - who: oldwoman
    ids:
    - Y1
    - Y2
    - Y3
    - T1
    - T2
  - who: man
    ids:
    - M1
  - who: woman
    ids:
    - M2
  - set: adult
    ids:
    - K1
    - K2
    - K3
    - F1
    - F2
    - F4
    - U1
    - P1
- id: F
  title: THE PHARMACY BELT SHEETS (P2; only if the pharmacy shot at /review shows the rough sprite for that item)
  intro: One sheet per item, the same object in eight views; judge the views against section 3.6 of the audit.
  items:
  - lines:
    - E18
    - E19
    - E20
    - E21
    - E22
checks:
  NANI:
    text: 'Nani leaning: both forearms flat on a plain marble counter, elbows ON it, one over the other; the counter''s back edge one straight horizontal line across the whole image at about 82% down, marble
      below it, flat grey above; head a normal size for her body (the sheet''s proportions, never a big head); rendered as chunky and simplified as the attached Nana, not more photographic; glasses, red
      dupatta, cream embroidered kurta, bracelet and rings as the sheet, no bangles; nothing of her below the counter''s back edge but the arms on it; clear grey left and right of her'
    judge:
      aspect:
      - 2
      - 3
      bg: none
  NFACE:
    text: only the face changed (the mood asked); glasses, dupatta, arms, hands, counter, size and position identical; compare with N1
    judge:
      aspect:
      - 2
      - 3
      bg: none
      edit:
        allowed:
        - 0.25
        - 0.1
        - 0.75
        - 0.42
  NPOINT:
    text: the same Nani, size, framing and counter line as N1 (compare them side by side); her left forearm (viewer's right) still flat on the counter; her right hand up beside her face, index finger pointing
      down to the viewer's right, elbow on the counter; five fingers
    judge:
      aspect:
      - 2
      - 3
      bg: none
  DSHEET:
    text: 'eight panels in two rows of four, nothing touching; the same man in every panel: bald, neat white beard, clear-framed glasses, white shirt under a checked blazer, stethoscope, steel watch; panel
      2 turned three-quarters to the viewer''s LEFT; panels 3-5 neutral, talking, laughing; a likeness of the photos that survives the stylising (Zafar decides); never a white coat; warm light tan skin'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces_min: 8
      no_touch: true
  DW1:
    text: the doctor standing, full body, turned three-quarters to the viewer's LEFT, both feet on one level, neutral kind face, mouth closed; as the sheet in every feature; fills about 85% of the height,
      touches no edge; no floor drawn; five fingers on each hand
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      skin_face:
      - 0.25
      - 0.0
      - 0.75
      - 0.2
  DFACE:
    text: only the face changed (the expression asked); glasses, beard, clothes, hands, stethoscope, size and position identical; compare with DW1
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      no_touch: true
      edit:
        allowed:
        - 0.3
        - 0.0
        - 0.7
        - 0.25
      skin_face:
      - 0.25
      - 0.0
      - 0.75
      - 0.2
  DW4:
    text: the same doctor, size, framing and feet as DW1 (compare them side by side); only the near arm raised, the index finger pointing to the viewer's left at chest height; five fingers; touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      no_touch: true
      like: DW1
  DD1:
    text: the doctor's head, shoulders and one raised beckoning hand leaning in from the RIGHT edge only; NO door, frame or wall drawn; a big open calling smile; the head about 40% of the height, a little
      left of centre; as the sheet in every feature; five fingers
    judge:
      aspect:
      - 1
      - 1
      bg: flat
      exits:
      - right
      skin_obj: true
  DM1:
    text: a white and steel machine, four tall tubes of red, yellow, blue and green LIQUID (no balls or beads), a drip spout under each, a chute to one opening at the bottom, empty lever sockets, no levers
      · looks like a medicine dispenser, not a sweet, gumball or jelly-bean machine
    judge:
      soft_edges: true
      aspect:
      - 2
      - 3
      bg: flat
      pieces: 1
      no_touch: true
      sweets: true
  DM2:
    text: 'six things in a 3 by 2 grid: a lever UP, the same lever DOWN at the same size and place, then four falling teardrop drops (red, yellow, blue, green), matte and softly translucent, the same size
      and shape, never glossy balls, beads or sweets; nothing crosses a cell boundary'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 6
      no_touch: true
      sweets: true
      soft_edges: true
  SOLE:
    text: the same sole as the attached picture (size, framing, the white trouser leg off the bottom), but the five toes in a LEVEL row, tips at about one height, clearly separate; smooth, no marks; touches
      the bottom edge only
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      exits:
      - bottom
      skin_obj: true
  PLATE4:
    text: four times the SAME plain oval steel plate from directly above, at the same size and place in each of the 2 by 2 cells, with ONE, TWO, THREE, FOUR bare skewers (as the attached stick, no food)
      lying STRAIGHT and PARALLEL left to right, close together, evenly spaced, handles to the RIGHT sticking past the rim; never fanned or bending; nothing touches a cell boundary
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      pieces: 4
      no_touch: true
  GBLINK:
    text: only the eyes changed, to gently closed; everything else identical to the attached seated picture (compare them)
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      no_touch: true
      edit:
        allowed:
        - 0.3
        - 0.13
        - 0.7
        - 0.35
  GMOUTH:
    text: only the mouth changed, open a little mid-word; eyes and everything else identical to the attached seated picture (compare them)
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      no_touch: true
      edit:
        allowed:
        - 0.3
        - 0.13
        - 0.7
        - 0.35
  W1:
    text: the same person as their sheet · front-on, facing us · thighs level, both feet flat at one level · hands on the lap, neutral face, mouth closed · fills about 85% of the height, touches no edge
      · no bed or stool drawn
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.75
      - 0.95
      skin_face:
      - 0.25
      - 0.0
      - 0.75
      - 0.24
      no_touch: true
  FACE:
    text: only the face changed (body, hands, clothes, hair, size and position identical to the original) · the expression asked for, readable at thumbnail size · nothing upsetting, no tears, sweat drops
      or symbols
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      edit:
        allowed:
        - 0
        - 0
        - 1
        - 0.45
  W7:
    text: 'exactly side-on, facing right · legs as the prompt says (child: hanging free; adult: feet flat on an invisible floor) · the same person · touches no edge'
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      fill_h:
      - 0.7
      - 0.95
      no_touch: true
  W9:
    text: the same person, size and framing as the attached front picture · a plain deep-red blanket round the shoulders, held at the chest · legs and feet in the same place as in the front picture · a
      cosy, relieved face · touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      like: W1
      no_touch: true
  W10:
    text: the same person, size and framing as the attached front picture · a teal knitted hot-water bottle hugged against the tummy · legs and feet in the same place as in the front picture · a comforted
      face · touches no edge
    judge:
      aspect:
      - 2
      - 3
      bg: flat
      like: W1
      no_touch: true
  K1:
    text: three-quarter side view of a knee · plain white cloth rolled just above the knee · the thigh enters from the left edge, the shin leaves the bottom edge, no foot · the knee about half the height
      · clean skin, no marks
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      - bottom
      skin_obj: true
  K2:
    text: 'the same framing as the attached K1: thigh in from the left, the knee at the same size and place · the shin kicked forward to the right · no foot, no motion lines'
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      - bottom
      like: K1
      skin_obj: true
  K3:
    text: one gentle pink graze on the kneecap, no blood · nothing else changed
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      - bottom
      edit:
        allowed:
        - 0.2
        - 0.2
        - 0.8
        - 0.8
      skin_obj: true
  F1:
    text: the forearm held out palm down, in from the left edge · white sleeve rolled below the elbow · the whole hand inside the image, five fingers · clean skin
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      skin_obj: true
  F2:
    text: one gentle pink graze mid-forearm, no blood · nothing else changed
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      edit:
        allowed:
        - 0.1
        - 0.1
        - 0.9
        - 0.9
      skin_obj: true
  F4:
    text: one short, thin pink line, no blood, nothing open · nothing else changed
    judge:
      aspect:
      - 3
      - 2
      bg: flat
      exits:
      - left
      edit:
        allowed:
        - 0.1
        - 0.1
        - 0.9
        - 0.9
      skin_obj: true
  Y2:
    text: only the eye on the viewer's right is sore (pink) · the other eye unchanged · no tears
    judge:
      allow_touch:
      - top
      - bottom
      side_hair: 0.08
      aspect:
      - 3
