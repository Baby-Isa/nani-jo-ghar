parts:
- id: A
  title: 'THE CHAI PAN, SIX STATES'
  intro: 'ST: the same pan six times, seen from exactly above (the photo sets the view, our pan only its look): empty, water, leaves, milky, milky boiling, black tea.'
  items:
  - lines: [ST]
- id: B
  title: 'THE CHAI POUR'
  intro: 'PT1 is the kept ST pan tipping lip-down, seen from exactly above, six cells on flat grey (the photos are only for how a pan tips); PT2 is an edit of the kept PT1 that recolours the tea to black tea.'
  items:
  - lines: [PT1, PT2]
- id: C
  title: 'THE GLASSES'
  intro: 'GL: three glasses exactly from above (the photo sets the view, our glasses only their look): empty, milky chai, black tea.'
  items:
  - lines: [GL]
- id: D
  title: 'THE KITCHEN'
  intro: 'KT: an edit of the kitchen in play: the lamp, shelves, gold pot and wall hanging gone, a backsplash all the way across, the cooker wider; the island stays where it is.'
  items:
  - lines: [KT]
checks:
  STATES:
    text: 'exactly six pans in a 3 by 2 grid, the same pan at the same size and place in every cell, seen from straight above: the rim a perfect circle, the floor a smaller circle exactly in its centre, the inside wall an even ring the same width all the way round (not wider on one side); the black handle level to the right, the lip on the left, in all six; in order empty, water coming to the boil, water with tea leaves, milky chai, milky chai boiling with foam, black tea; no hob, no shadow on ONE flat mid-grey'
    judge: {aspect: [3, 2], bg: none}
  TILT:
    text: 'exactly six pans in a 3 by 2 grid, the same pan as ST, every one seen from directly above at the same size with the rim''s centre at the same point of its cell, the handle to the right in all six; cells 1 to 4 four clearly different rims (a circle, then ellipses narrower from left to right), the tea sliding to the lip on the left and a band of inside wall growing on the right; cell 5 only a short tongue of tea over the lip, no long falling stream; cell 6 nearly empty with a thin trickle; no hand, sink or side view; no shadow on ONE flat mid-grey'
    judge: {aspect: [3, 2], bg: none}
  RECOLOUR:
    text: 'the same six pans as the attached sheet at the same places, sizes and tilts; only the liquid changed, now clear dark reddish-brown black tea in every cell; the grey and everything else unchanged'
    judge: {aspect: [3, 2], bg: none}
  GLASS:
    text: 'three identical glasses from directly above in a row: the rim a perfect circle, the floor a smaller circle exactly in its centre, the walls even all the way round, the facets evenly spaced round; empty, milky chai, black tea; no holder or saucer; no shadow on ONE flat mid-grey'
    judge: {aspect: [3, 2], bg: none}
  KITCHEN:
    text: 'the same kitchen as the attached at the same framing, the island''s top edge at the same height, its three trays where they were; no hanging lamp, no shelves, no gold pot, no wall hanging; one plain backsplash right across the back wall; the cooker wider, reaching the outer edges of the cabinets either side; nothing new added; no people, no writing'
    judge: {aspect: [3, 2], bg: none}
passfail:
- Any text, letters, numbers, labels, signs or logos, even fake or blurry ones.
- Outlines, cel shading, a flat vector look or painterly brushwork.
- The wrong number of things or the wrong view; a pan or glass seen even a little from the side (the inside wall wider on one side, the floor off centre); a hand, a sink or a side view copied from the photos.
- A key background that isn't one flat colour (a gradient, a floor, shadows or haze on it).
- 'In the kitchen, the island, window or door moved; anything new added; a person.'
- Anything scary; sweets, lollies or biscuits; any religious marker.
