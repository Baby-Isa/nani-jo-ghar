  PT1: {attach: ["kept:ST", pour-tipping.jpg, pour-full.jpg, pour-trickle.jpg], save: pt1-chai-pan-tip-overhead-v1.png, check: TILT}
  PT2: {attach: ["edit: kept:PT1"], save: pt2-chai-pan-tip-black-v1.png, check: RECOLOUR}
