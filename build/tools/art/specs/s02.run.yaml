# the checks, by check ID: text = the words in the block; judge = what the first-pass judge measures
checks:
  KITCHEN:
    text: the same room from the same camera as the attached kitchen (window and tap left, sink worktop with ONE marble edge, three empty shelves, hob in sage cabinets, mirror-work hanging and brass pot right, arched doorway, pendant lamp, marble island with oak-slat front across the whole width, its top edge horizontal at about 65% of the height) · three identical empty pale-oak trays side by side on the island at about 22%, 50% and 78% of the width · nobody, no hands, no food · the scene fits a central 16:9 band · light from the upper left, shadows to the right · sharp, no blur
    judge: {aspect: [3, 2], bg: none}
  DISHES:
    text: 'eight dishes in a 4 by 2 grid, in order: milky chai glass, black tea in the same glass, a stack of maani on a steel plate, a steel bowl of yellow daar, layered chaat in a thin glass bowl, two samosas on a steel plate, two straight parallel skewers on an oval steel plate, a basket with a milk jug, tea tin and cloth sack · all seen from the front and a little above · nothing under them · lit from the upper left'
    judge: {aspect: [3, 2], bg: flat, pieces: 8, no_touch: true, soft_edges: true}
  PANPOUR:
    text: the same brushed-steel pan as the attached draft, seen from above, tipped about 35 degrees to the lower left, a stream of milky chai leaving the lip · handle to the upper right · the WHOLE pan, handle and stream inside the image with a clear margin on every side · no shadow under it
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true, soft_edges: true}
  PANEDIT:
    text: only the liquid changed, to clear deep amber black tea (in the pan and the stream) · the pan, handle, tilt, size, position and background identical
    judge: {aspect: [1, 1], bg: flat, edit: {allowed: [0, 0, 1, 1]}, soft_edges: true}
  GLASSES:
    text: three times the SAME cutting glass as the attached, at the same size and place in each cell · empty, half, full of clear amber black tea (no milk) · straight on from the front
    judge: {aspect: [3, 2], bg: flat, pieces: 3, no_touch: true, soft_edges: true}
  SPOON:
    text: one plain steel teaspoon from directly above, bowl left, handle right, flat and level · nothing in it · about 80% of the width · touches no edge
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  JARS:
    text: 'four times the same small glass jar, straight on, full to the shoulder: garlic cloves (brass lid), ginger pieces (dark wood lid), green cardamom pods (black lid), coarse salt (white ceramic lid) · the contents large and clear through the glass · the four lids clearly different · no labels'
    judge: {aspect: [3, 2], bg: flat, pieces: 4, no_touch: true, soft_edges: true}
  GINGER:
    text: 'two cells from directly above: a knobbly branching ginger root with pale tan skin and one cut yellow end; three thin round slices lying flat · reads as real ginger, never as sweets or gummies'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 2, no_touch: true, sweets: true}
  PLATE:
    text: one plain oval brushed-steel plate from directly above, long axis left to right, completely EMPTY · no sticks, skewers, food or pattern · about 85% of the width · touches no edge
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  GLASSBOWL:
    text: one simple clear glass bowl exactly side-on, empty · straight slightly flaring sides, a THIN flat base, a plain rim · only a faint tint and two thin wall lines · NO reflections, highlights, thick bottom, facets or pattern · touches no edge
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true, soft_edges: true}
  KNIFE:
    text: one knife from directly above, blade left, pale wood handle right, cutting edge at the bottom · a little stocky · the tip and the handle's end both well inside the image (at least 10% margin all round) · touches no edge
    judge: {aspect: [1, 1], bg: flat, pieces: 1, no_touch: true}
  BOWLTRIVET:
    text: 'two cells from directly above, rims perfect circles: the steel bowl of plain yellow daar with NOTHING under it; the empty round woven trivet on its own · the bowl smaller than the trivet'
    judge: {aspect: [3, 2], bg: flat, pieces: 2, no_touch: true}
  FOLD:
    text: 'six frames in a 3 by 2 grid from directly above · the pastry strip the SAME height in every frame, its top and bottom edges on the same two lines in all six cells, its right-hand end at the same place · nothing above or below those lines · the fold grows from the LEFT end by diagonal folds; frame 6 is the finished triangle, the strip''s height, alone · simple matte pastry, not hyper-real'
    judge: {aspect: [3, 2], bg: flat, pieces: 6, no_touch: true}
  JAR:
    text: 'five times the SAME clear glass jar with a brass lid, at the same size and place in each cell, straight on · empty, a quarter, half, three-quarters, full of plain matte gold coins · no label · NO markings, numbers, letters or faces on any coin'
    judge: {aspect: [3, 2], bg: flat, pieces: 5, no_touch: true, soft_edges: true}
  COINS:
