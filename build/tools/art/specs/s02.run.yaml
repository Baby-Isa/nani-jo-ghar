  JUGS:
    text: 'nine jugs in a 3 by 3 grid: columns hot (steam), cold (frost and two ice cubes), lukewarm (plain); rows standing front-and-above, top-down (rim a circle), pouring tilted 40 degrees with the spout to the lower left and a stream · the three jugs of a row at the same size and place · the same jug as the attached foot-soak sheet'
