# The run spec for pack s17-simba: Simba's pose sheets, from Zafar's approved sheet, no collar (Zafar, 2 Nov 2026).
#   python3 build/tools/art/artblock.py --spec build/tools/art/specs/s17-simba.run.yaml --check
#   python3 build/tools/art/artblock.py --spec build/tools/art/specs/s17-simba.run.yaml
pack: s17-simba
title: 'Simba: his pose sheets, from the approved sheet, with no collar'
plan: docs/design-language/art-plans/s17-simba-art-plan.md
plan_branch: claude/nice-lovelace-0vfjcj
repo: Baby-Isa/nani-jo-ghar
raw_branch: claude/nice-lovelace-0vfjcj
dest: sources/art/s17-simba
real_people: false
approvals: "- Zafar: keep this laptop awake for the whole run (Mac: run `caffeinate -dims` in Terminal, charger in, lid open; Windows: PowerToys Awake on). If the screen sleeps the run stops.\n- Simba is Zafar's own cat: judge every sheet with the checks below, keep the best, and Zafar looks at them while the run goes or after. A cat with a collar, a bell or a tag fails."
delivery: download
amend: true
runner: {windows: 3, send_gap_seconds: 60, stall_minutes: 6, hard_minutes: 10, redos: 2, commit_batch: 6, flush_minutes: 25}
refs:
  simba-sheet.png: sources/art/characters/char-simba-v1.png
people: {}
limb_sets: {}
templates: {}
limb_templates: {}
lines:
  SM: {attach: ["edit: simba-sheet.png"], save: sm-simba-model-nocollar-v1.png, check: MODEL}
  S1: {attach: ["kept:SM", simba-sheet.png], save: s1-simba-rest-v1.png, check: CATSHEET}
  S2: {attach: ["kept:SM", simba-sheet.png], save: s2-simba-stretch-grab-v1.png, check: CATSHEET}
  S3: {attach: ["kept:SM", simba-sheet.png], save: s3-simba-peer-hide-v1.png, check: CATSHEET}
  S4: {attach: ["kept:SM", simba-sheet.png], save: s4-simba-heads-v1.png, check: CATHEADS}
  S5: {attach: ["kept:SM", simba-sheet.png], save: s5-simba-moments-v1.png, check: CATSHEET}
parts:
- id: A
  title: 'SIMBA'
  intro: 'Zafar''s cat, a smoky-grey Russian Blue with pale green eyes and NO collar: first his approved sheet edited to drop the collar (SM), then five pose sheets that copy him from it (rest, stretches and grabs, peering and hiding, head layers, everyday moments). In S1-S5 the first attached picture is kept:SM.'
  items:
  - lines: [SM, S1, S2, S3, S4, S5]
checks:
  MODEL:
    text: 'the attached sheet unchanged (the same eight cats, sizes, places, fur, eyes and light) except that NO cat wears a collar, bell or tag and the colour swatches are gone; plain grey where they were'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 8, no_touch: true}
  CATSHEET:
    text: 'the same smoky-grey Russian Blue with pale green eyes and NO collar in all eight cells of a 4 by 2 grid, the same size, the poses asked in the order asked; looks like the attached cat; no people, room or floor; no shadow on ONE flat light grey'
    judge: {aspect: [3, 2], bg: flat, pieces_min: 8, no_touch: true}
  CATHEADS:
    text: 'eight heads of the same cat, no collar, in a 4 by 2 grid, front view, the same size, place and tilt, only the face changing as asked; no bodies; no shadow on ONE flat light grey'
    judge: {aspect: [3, 2], bg: flat, pieces: 8, no_touch: true}
passfail:
- Any text, letters, numbers, labels, signs, logos or colour swatches.
- A collar, a bell, a tag or anything round his neck.
- A cat that doesn't look like the attached Simba (another colour, eye colour, face shape or a thin build).
- Outlines, cel shading, a flat vector look or painterly brushwork.
- The wrong number of cats or poses, or the wrong order.
- A person, a hand or an arm anywhere.
- A background that isn't one flat colour (a gradient, a floor, shadows or haze on it).
