# The run spec for pack s09b: Sprint 9's full art run (the skies, the empty house and Nani's door poses, the road's loop
# and window, the farm road's things, the book's find-it spreads), after Zafar agreed the road's style (20 Oct).
# Read by build/tools/art/artblock.py. Edit this file, then regenerate the block.
pack: s09b
title: 'Sprint 9 art: skies, the door, the road and its things, the book'
plan: docs/design-language/art-plans/s09b-art-plan.md
plan_branch: claude/funny-maxwell-3dkhif
repo: Baby-Isa/nani-jo-ghar
raw_branch: claude/funny-maxwell-3dkhif
dest: sources/art/s09b
real_people: true
approvals: "- Nani is a real person: Zafar judges her likeness after the run, in another chat. Don't wait for him and don't ask: keep the first image of each prompt that passes the checks below.\n- Redo only for a failed check (text, the wrong view or count, people where there should be none, a key colour that isn't flat, a sun or moon in the wrong corner, something on the book's centre fold)."
delivery: download
amend: true
runner: {windows: 3, send_gap_seconds: 60, stall_minutes: 6, hard_minutes: 10, redos: 2, commit_batch: 6, flush_minutes: 25}
refs:
  style-anchor-v1.png: sources/art/style-anchor-v1.png
  nani-sheet-final.png: sources/art/s08/sheet-nani-final-1.png
  nani-house.png: sources/art/s09a/h1-house-big-arch-v2.png
  nani-by-the-fire.png: sources/art/s09a/b1-library-fireplace-v2.png
  farm-animals.png: sources/art/s09r/i1-animals-v1.png
  farm-props.png: sources/art/s09r/p1-props-v1.png
  book-find-it.png: sources/art/s09a/l1-book-find-it-v1.png
  far-hills.png: sources/art/s09r/f1-farm-far-hills-v1.png
  car-window.png: sources/art/s09a/r1-car-window-v1.png
  nani-kitchen.png: sources/art/chatgpt/bg-nani-kitchen-e-v1.png
people: {}
limb_sets: {}
templates: {}
limb_templates: {}
lines:
  S1: {attach: [book-find-it.png, style-anchor-v1.png], save: s1-sky-sunny-v1.png, check: SKY}
  S2: {attach: [book-find-it.png, style-anchor-v1.png], save: s2-sky-cloudy-v1.png, check: SKY}
  S3: {attach: [book-find-it.png, style-anchor-v1.png], save: s3-sky-raining-v1.png, check: SKY}
  S4: {attach: [book-find-it.png, style-anchor-v1.png], save: s4-sky-night-v1.png, check: SKY}
  H3: {attach: [nani-house.png], save: h3-house-empty-wide-v1.png, check: HOUSE}
  N1: {attach: [nani-sheet-final.png, nani-house.png], save: n1-nani-door-poses-v1.png, check: POSES}
  N2: {attach: [nani-sheet-final.png, "kept:N1"], save: n2-nani-door-poses-v1.png, check: POSES}
  C1: {attach: [nani-by-the-fire.png, nani-sheet-final.png], save: c1-nani-face-fire-v1.png, check: FACE}
  F2: {attach: ["edit: far-hills.png"], save: f2-farm-far-hills-loop-v1.png, check: LOOP}
  W1: {attach: [car-window.png], save: w1-car-window-wide-v1.png, check: WINDOW}
  A1: {attach: [farm-animals.png, book-find-it.png], save: a1-farm-animals-v1.png, check: SPRITES}
  A2: {attach: [farm-animals.png, book-find-it.png], save: a2-farm-animals-v1.png, check: SPRITES}
  V1: {attach: [farm-animals.png, farm-props.png], save: v1-road-vehicles-v1.png, check: SPRITES}
  V2: {attach: [farm-animals.png, farm-props.png], save: v2-road-things-v1.png, check: SPRITES}
  L1: {attach: [farm-props.png, nani-house.png], save: l1-road-landmarks-v1.png, check: SPRITES}
  K1: {attach: [book-find-it.png, farm-animals.png], save: k1-book-farm-spread-v1.png, check: SPREAD}
  K2: {attach: [nani-kitchen.png, book-find-it.png], save: k2-book-kitchen-spread-v1.png, check: SPREAD}
parts:
- id: A
  title: 'THE SKIES'
  intro: 'S1-S4: one sky per weather, only sky, the sun or moon in the upper right, the upper left kept plain.'
  items:
  - lines: [S1, S2, S3, S4]
- id: B
  title: 'THE DOOR AND NANI'
  intro: 'H3 is the empty house, wider. N1 and N2 are Nani''s door poses on flat grey (a real person: Zafar judges her likeness later). C1 is her face close up by the fire, for the book''s camera.'
  items:
  - lines: [H3, N1, N2, C1]
- id: C
  title: 'THE ROAD'
  intro: 'F2 is an edit of the far hills so their edges join; W1 is the car window with its opening in the middle.'
  items:
  - lines: [F2, W1]
- id: D
  title: 'THE FARM ROAD''S THINGS'
  intro: 'A1-L1: sheets of separate things on flat magenta, each whole and apart, in the style of the attached animals.'
  items:
  - lines: [A1, A2, V1, V2, L1]
- id: E
  title: 'THE BOOK''S FIND-IT SPREADS'
  intro: 'K1 and K2: empty scenes across a book''s two pages, nothing on the centre fold.'
  items:
  - lines: [K1, K2]
checks:
  SKY:
    text: 'only sky (no ground, hills, trees or buildings); the sun or moon in the upper right quarter only; the upper left quarter plain; no raindrops drawn'
    judge: {aspect: [3, 2], bg: none}
  HOUSE:
    text: 'the same house as the reference, empty (no people), the house in the middle 60 percent with garden to both edges, a straight roofline about a third down with even empty sky above, no cast shadows, open paving at the foot of the steps'
    judge: {aspect: [3, 2], bg: none}
  POSES:
    text: 'exactly the poses the line names, each whole, the same size, feet on one baseline, her face and clothing as on the sheet, modestly dressed, no rings, on ONE flat mid-grey with no shadow'
    judge: {aspect: [3, 2], bg: none}
  FACE:
    text: 'the same woman as the sheet, head and shoulders, face centred and sharp, the same room and light as the reference, the top of the book along the bottom'
    judge: {aspect: [3, 2], bg: none}
  LOOP:
    text: 'the edit changed only the outer tenths: the hill line meets the left and right edges at the same height; the magenta above still flat; nothing else moved'
    judge: {aspect: [3, 2], bg: none}
  WINDOW:
    text: 'the car''s inside all round; the opening in the middle, about 60 percent of the height, filled with ONE flat pure green; no reflections; no people'
    judge: {aspect: [3, 2], bg: none}
  SPRITES:
    text: 'exactly the things the line names, each whole and well apart, those on the ground on one baseline and facing left, on ONE flat pure magenta with no floor or shadow; no text, numbers or plates'
    judge: {aspect: [3, 2], bg: none}
  SPREAD:
    text: 'the whole image is the scene, empty of the things the line excludes, the middle tenth (the fold) empty, open space on both halves'
    judge: {aspect: [3, 2], bg: none}
passfail:
- Any text, letters, numbers, labels, signs, number plates or logos, even fake or blurry ones.
- Outlines, cel shading, a flat vector look or painterly brushwork.
- The wrong number of things, the wrong view, or people where the line says none.
- A key background that isn't one flat colour (a gradient, a floor, shadows or haze on it); pink or purple anywhere else in a magenta image.
- Immodest clothing; anything scary; sweets, lollies or biscuits; any religious marker.
