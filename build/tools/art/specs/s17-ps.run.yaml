# The run spec for pack s17-ps: a real chai stream for the word moment (Zafar's chai replay, 4 Nov evening).
#   python3 build/tools/art/artblock.py --spec build/tools/art/specs/s17-ps.run.yaml --check
pack: s17-ps
title: 'A real chai pour for the word moment (one falling stream)'
plan: docs/design-language/art-plans/s17-ps-art-plan.md
plan_branch: claude/admiring-ptolemy-77fuv5
repo: Baby-Isa/nani-jo-ghar
raw_branch: claude/admiring-ptolemy-77fuv5
dest: sources/art/s17-ps
real_people: false
approvals: "- Zafar: keep this laptop awake for the whole run (Mac: run `caffeinate -dims` in Terminal, charger in, lid open; Windows: PowerToys Awake on).
- No people in this run: you judge every image with the checks below. Redo only for a failed check or a PASS/FAIL point."
delivery: download
amend: true
runner: {windows: 2, send_gap_seconds: 60, stall_minutes: 6, hard_minutes: 10, redos: 2, commit_batch: 3, flush_minutes: 25}
refs:
  counter.png: sources/art/s17-wm/ms-word-moment-counter-v1.png
  chai-glass.webp: sources/art/s17-wm2/wf-chai-glass-full-large-v1.webp
  kettle.png: sources/art/s17-art1/wv-chai-kettle-tilted-v1.png
people: {}
limb_sets: {}
templates: {}
limb_templates: {}
lines:
  PS: {attach: [counter.png, chai-glass.webp, kettle.png], save: ps-chai-stream-v1.png, check: STREAM}
parts:
- id: A
  title: 'ONE FALLING STREAM'
  intro: 'One straight stream of milky chai falling from the top edge to the bottom edge, on the plain wall, nothing else.'
  items:
  - lines: [PS]
checks:
  STREAM:
    text: 'ONE straight vertical stream of milky caramel chai, centred, running off the very top and the very bottom edges, about 6% of the width, glassy and smooth (a real liquid, not a wavy cartoon rope), a soft highlight down its left side, in front of a completely plain limewash wall the colour of the attached counter; no kettle, no glass, no counter, no splashes or flying drops; nothing else'
    judge: {aspect: [2, 3], bg: none}
passfail:
- Any text, letters, numbers, labels or logos, even fake ones.
- Outlines, cel shading, a flat vector look or painterly brushwork.
- A wavy, bumpy or zigzag rope; a stream that bends, splits or stops before an edge.
- A kettle, spout, glass, cup, counter, hand or anything else in the picture.
- Tiles, a window or anything on the wall; a wall colour different from the attached counter.
