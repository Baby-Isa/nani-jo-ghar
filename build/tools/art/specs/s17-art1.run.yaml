passfail:
- Any text, letters, numbers, labels, signs or logos, even fake or blurry ones (on a jug, a cake, bunting, balloons, a tin or a crate too).
- Outlines, cel shading, a flat vector look or painterly brushwork.
- The wrong number of things, the wrong order, or the wrong view (a top-down line drawn even a little from the side; a side-on line drawn from above).
- A person, a hand or an arm anywhere, or anything copied from a person in a mock-up.
- A key background that isn't one flat colour (a gradient, a floor, shadows or haze on it).
- 'In an edit, the island, window, door, oven or frame moved or changed size; anything added that the prompt did not ask for.'
- Anything scary; sweets, lollies or biscuits (the birthday cake is the celebration, not a reward); any religious marker; anything not halal (no pork, no alcohol).
