parts:
- id: A
  title: 'CHAI: THE HALF AND FULL WORD MOMENT'
  intro: 'WV: the same steel chai kettle twice, tilted, dry and with a short tongue of chai; WG: one chai glass side-on five times, empty to full; WS: six falling streams (chai, black tea, water, milk, flour, sugar); WF: the camera snap (corners and the shutter iris).'
  items:
  - lines: [WV, WG, WS, WF]
- id: B
  title: 'EGGS AT BREAKFAST'
  intro: 'The hob scene from exactly above (the pot, the pan, the eggs, the shakers, the fried states, the bowl and egg cups), the served plates side-on, and two relit edits of the kitchen in play (morning and night).'
  items:
  - lines: [EP, EF, EG, EY, EB, ES, EM, EN]
- id: C
  title: 'BAKING'
  intro: 'The straight-on counter, the mixing bowl''s six states, the measuring jug (lines, no numbers), the oven shut then two edits of it (baking, open), the naan on its tray; BL (the loaf and cake tins) is optional and runs last.'
  items:
  - lines: [BK, BB, BJ, BO1, BO2, BO3, BN]
- id: D
  title: 'THE CORN STALL'
  intro: 'The stall''s table from exactly above, the cob in four states, the crate of cobs, the six dressing bowls, and the six dressings alone in the cob''s shape.'
  items:
  - lines: [CT, CB, CX, CD, CO]
- id: E
  title: 'THE CAKE'
  intro: 'The empty party room, its table as its own piece, the birthday cake and its slices, the candles.'
  items:
  - lines: [PR, TB, CK, CN]
- id: G
  title: 'SIMBA, THE POSE SHEET'
  intro: 'Zafar''s cat (a charcoal Russian Blue, pale mint-green eyes, a dark collar with a silver bell): his model sheet first, then four pose sheets made from it (rest, stretches and grabs, peering and hiding, head layers for blinking and yawning). Zafar approved a basic Simba sheet in ChatGPT before: look for it in ChatGPT''s Library (a black cat with green eyes) and attach it with simba.png to SM if you find it. Zafar judges these himself while the run goes or after.'
  items:
  - lines: [SM, S1, S2, S3, S4]
- id: F
  title: 'OPTIONAL, LAST'
  intro: 'BL: the loaf and the cake in their tins (the design''s later bakes). Run it only when every other line is KEPT or SKIPPED.'
  items:
  - lines: [BL]
