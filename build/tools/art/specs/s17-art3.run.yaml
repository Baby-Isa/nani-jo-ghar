passfail:
- Any text, letters, numbers, labels, signs or logos, even fake or blurry ones (on a bottle, a tube, a box, a thermometer's display or a plaster too); dressings or marks that look like writing.
- Outlines, cel shading, a flat vector look or painterly brushwork; a patient drawn photorealistic (items may be semi-photoreal, people never).
- The wrong number of things, the wrong order, or the wrong view.
- A patient whose face, hair, skin tone or clothes drift from the attached sheet or close-up; any grown-up (the doctor, Nani or another adult); clothes lifted.
- Extra or missing fingers or toes.
- A key background that isn't one flat colour (a gradient, a floor, shadows or haze on it), where the line asks for one.
- Anything scary or gory (blood running, an open wound, a needle shown going in); sweets, lollies or biscuits; any religious marker; anything not halal.
