parts:
- id: A
  title: 'BLOCK 1''S REDOS AND TWO STOVE PIECES'
  intro: 'The baking counter (the edge at half height, cream tiles), the crate of six husked cobs, the cob dressings as dots and drops only (no lines: block 1''s looked like writing), the loaf and cake tins (block 1 skipped them), the chai pan boiling over, the potato that reads as potato.'
  items:
  - lines: [BK, CX, CO, BL, PO, PU]
- id: B
  title: 'THE CUT GAME AND THE HAND SPLINTER'
  intro: 'The boy''s and the girl''s whole arm on the paper strip, their palms with fingers spread, the scrape in four states, the grit''s fizz and the water splash, the cream tube, plasters in four colours, tissues, splinters and the splinter''s channel tiles.'
  items:
  - lines: [AB, AG, PB, PG, SR, GS, CR, PL, TX, SL]
- id: C
  title: 'THE BLOCKED NOSE AND THE DRINKS'
  intro: 'The girl''s face in four nose states (an edit of her approved close-up), the eye and nose droppers and drops, the bin, the boy and the girl sitting with a cup, the clinic''s empty counter, the six drink things.'
  items:
  - lines: [NF, DR, BI, UB, UG, DC, DT]
- id: D
  title: 'THE SIDE-ON HEADS AND THE FOOT'
  intro: 'The girl''s and the boy''s head exactly side-on (the ear clear), and the foot and ankle from the side, the leg fading out of the picture.'
  items:
  - lines: [HG, HO, FA]
- id: E
  title: 'THE HEAL GAMES'' ROWS WAITING ON ART'
  intro: 'Boing''s drop machine wider, truly neutral faces, the zoom''s middle step to the mouth, a photographic thermometer, the knee bandage wrapping round, the toothbrush the right way round, the taste cups with no shadow, the girl''s forearm in her lap, nine body-part tiles.'
  items:
  - lines: [DM, NG, MZ, TH, KB, TB, TC, FL, BT]
- id: F
  title: 'THE STOVE FAMILY''S ROLL-OUT'
  intro: 'The chop game''s board scene (empty), the samosa strip filled and folded in six states with real layered folds, and baking''s word moment: the opaque scoop held tilted, the glass jug side-on filling with flour and with water (no numbers).'
  items:
  - lines: [KC, SF, BV, BW]
